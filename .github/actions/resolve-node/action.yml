# GREP_SUMMARY: resolve-node composite-action node-configs ssh-host node-yaml centralized-host
# STRUCTURE: inputs(target_node,node_configs_token) → ○ gh repo clone tronyx-lab/platform → ◇ python3 -c "yaml load → node.host" → ⎋ ssh_host output
# region MODULE_CONTRACT
## @purpose  Canonical SSH host resolution from centralized node-configs repository.
##           Eliminates 3× duplicate inline resolve-node blocks across project templates
##           (template-backend, template-frontend, template-fullstack) with a single
##           Source of Truth for SSH host resolution.
## @scope    Used by template/*/deploy.yml workflows that need to resolve SSH host from
##           node.yaml for a given target node. Receives target_node and node_configs_token
##           as inputs, clones tronyx-lab/platform, reads node.host, outputs ssh_host.
## @invariants
##   - Clones tronyx-lab/platform (read-only) via gh CLI with provided token
##   - Reads node.host from node-configs/<target_node>/node.yaml
##   - Requires node_configs_token with read-only scope to tronyx-lab/platform
##   - target_node must exist as a directory under node-configs/ in the platform repo
##   - Outputs ssh_host only — never stores or outputs the token
## @rationale  DevPlan 020 T7: 3× identical inline resolve-node blocks (36 LOC each) in
##             template workflows. Consolidation reduces drift risk and enables central
##             updates to the resolution logic (e.g., changing repo path, adding fields).
##             Centralized node-configs is single source of truth for node metadata;
##             SSH host is not stored as a GitHub secret (IPs change on provider migration).
##             Rejected: hardcode IP in secrets — manual update on every IP change.
##             Rejected: DNS A record — provider may not support API-driven DNS.
## @changes — 2026-07-17 | Extracted from 3× template deploy.yml blocks per DevPlan 020 T7
# endregion MODULE_CONTRACT

name: 'Resolve Node'
description: 'Resolve SSH host from centralized node-configs repository for a given target node'

inputs:
  target_node:
    description: 'Node name to resolve (must match a directory name under node-configs/ in tronyx-lab/platform)'
    required: true
  node_configs_token:
    description: 'GitHub token with read-only access to tronyx-lab/platform repository'
    required: true

outputs:
  ssh_host:
    description: 'Resolved SSH host (node.host from node.yaml)'
    value: ${{ steps.resolve.outputs.ssh_host }}

runs:
  using: 'composite'
  steps:
    # ─── Step 1: Clone centralized node-configs repository ──────────────
    - name: Clone node-configs from tronyx-lab/platform
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.node_configs_token }}
      run: |
        echo "[IMP:9][resolve-node][clone] Cloning tronyx-lab/platform (target_node: ${{ inputs.target_node }})"
        gh repo clone tronyx-lab/platform /tmp/platform -- --depth 1 --quiet
        echo "[IMP:9][resolve-node][clone] Clone complete"

    # ─── Step 2: Resolve SSH host from node.yaml ────────────────────────
    - name: Resolve SSH host from node.yaml
      id: resolve
      shell: bash
      run: |
        NODE_YAML="/tmp/platform/node-configs/${{ inputs.target_node }}/node.yaml"
        echo "[IMP:9][resolve-node][resolve] Reading node.host from: $NODE_YAML"

        if [ ! -f "$NODE_YAML" ]; then
          echo "[IMP:10][resolve-node][resolve] ERROR: node.yaml not found at $NODE_YAML"
          exit 1
        fi

        SSH_HOST=$(python3 -c "import yaml, sys; y=yaml.safe_load(open('$NODE_YAML')); print(y['node']['host'])")
        echo "ssh_host=${SSH_HOST}" >> "$GITHUB_OUTPUT"
        echo "[IMP:9][resolve-node][resolve] Resolved ssh_host: $SSH_HOST"
