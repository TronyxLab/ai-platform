# GREP_SUMMARY: composite-action setup-python-venv pip-cache symlink reusable
# STRUCTURE: ▶ actions/setup-python → ◇ cache .venv → ◇ symlink (BEFORE pip install) → ◇ pip install → ⎋ GITHUB_PATH
# region MODULE_CONTRACT
## @purpose  Reusable composite action: Python venv setup with pip cache, dependency install, and symlink.
##           Eliminates 6× duplicate boilerplate across CI workflows.
## @scope    All .github/workflows/*.yml that need Python + pytest dependencies
## @invariants
##   - Python version: 3.14 (default, overridable via input) — pinned to match local .venv (3.14.5)
##   - pip cache: actions/setup-python cache: 'pip'
##   - .venv cache key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('Makefile', 'pyproject.toml') }}
##     (python-version in key — cache from an old Python version must not be reused)
##   - Dependencies: pytest, pyyaml, jsonschema, requests, python-dotenv, boto3, botocore
##   - Optional: pre-commit (via install-pre-commit input)
## @rationale  TestsMetaDevPlan2.md audit identified 6× identical .venv setup sequences
##             across workflows. Composite action reduces drift risk and maintenance toil.
# endregion MODULE_CONTRACT

name: 'Setup Python venv'
description: 'Cache and setup Python .venv with test dependencies and GITHUB_PATH symlink'

inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.14'
  install-pre-commit:
    description: 'Install pre-commit in venv (true/false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Cache .venv
      uses: actions/cache@v6
      with:
        path: .venv
        # python-version in cache key: .venv is NOT portable across Python versions.
        # A cache created under 3.10 must never be restored for a 3.14 run (stale
        # binaries/site-packages) — the symlink fix below is a safety net, not a policy.
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('Makefile', 'pyproject.toml') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-

    # TRAP[BUG] 2026-07-23: symlink must be set BEFORE pip install.
    # Cached .venv/bin symlinks may point to old Python version (e.g. 3.10.19).
    # If pip install runs with old symlink, packages go to wrong site-packages.
    # Then symlink overwrite points to new Python — tests fail with ModuleNotFoundError.
    #
    # Additionally: cached .venv/pyvenv.cfg makes Python treat .venv as real venv,
    # using .venv/lib/python3.*/site-packages (old version) instead of system site-packages.
    # Delete pyvenv.cfg to ensure plain symlink setup — no virtual env isolation.
    #
    # TRAP[BUG] 2026-07-23 (stale binaries): After pyvenv.cfg removal, pip installs
    # packages to SYSTEM site-packages, not .venv/lib/. Cached pip-installed binaries
    # (pre-commit, pytest, etc.) persist in .venv/bin/ with shebangs pointing to old
    # Python version (e.g. #!/opt/hostedtoolcache/Python/3.10.19/...). On runner with
    # a different patch version → execve() returns ENOENT ("cannot execute: required
    # file not found").
    # Fix: find .venv/bin -type f -not -name 'activate*' -delete removes all stale
    # regular files before symlink creation. Pip --force-reinstall would NOT help —
    # the bug is in the stale binary shebangs on disk, not in package metadata.
    - name: Setup .venv symlink for make targets
      shell: bash
      run: |
        mkdir -p .venv/bin
        # Remove stale pip-installed regular files (pre-commit, pytest, etc.) whose
        # shebangs point to old Python version — causes ENOENT on execve() at runtime
        find .venv/bin -type f -not -name 'activate*' -delete 2>/dev/null || true
        # Remove stale symlinks and pyvenv.cfg from cache (may point to old Python)
        rm -f .venv/bin/python .venv/bin/pip .venv/bin/python3 .venv/bin/pip3
        rm -f .venv/pyvenv.cfg
        ln -sf "$(which python3)" .venv/bin/python
        ln -sf "$(which python3)" .venv/bin/python3
        ln -sf "$(which pip3)" .venv/bin/pip
        ln -sf "$(which pip3)" .venv/bin/pip3
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Install test dependencies
      shell: bash
      run: |
        if [ ! -d .venv/bin ]; then
          python -m venv .venv
        fi
        .venv/bin/pip install --upgrade pip
        # ⚠️ TRAP[BUG] 2026-08-03 · хардкод DEPS расходился с pyproject.toml (инвариант 11)
        # · Symptom: CI gate-fast check-manifests G6 — ModuleNotFoundError: pydantic
        #   (config_renderer → policy_schema → pydantic); pydantic не было в хардкод-списке.
        # · Root: setup-python-venv ставил фиксированный список вместо generated
        #   core/requirements.txt (SoT — pyproject.toml [project].dependencies).
        # · Fix: pip install -r core/requirements.txt (runtime) + pytest (dev).
        .venv/bin/pip install -r core/requirements.txt pytest
        if [ "${{ inputs.install-pre-commit }}" = "true" ]; then
          .venv/bin/pip install pre-commit
        fi
