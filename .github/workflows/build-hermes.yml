# GREP_SUMMARY: build-hermes ghcr-push hermes-agent-base L1 gha-cache auto-build public-distribution-base tag-policy
# STRUCTURE: on:push:main/core/modules/hermes-agent/** → ⚡ cancel-in-progress → ▶ checkout → ◇ setup-buildx → ◇ ghcr-login → ⊕ L1 build+push (ghcr.io/tronyx161/hermes-agent-base:latest + sha-<sha>) → ⎋
# region MODULE_CONTRACT
## @purpose  Auto-build hermes-agent L1 (hermes-agent-base) image on push to core/modules/hermes-agent/**,
##           push to ghcr.io/tronyx161 as a PUBLIC distribution base (DevPlan 116 B3 T7, U-60, D1).
##           L1 is built ONCE in tronyx161 — context orgs pull it anonymously and build only their
##           thin L2 (context overlay). No L2 is pushed from this workflow (L2 = context org responsibility).
## @scope    CI workflow in tronyx161/ai-platform. Not for context-specific L2 builds (those use
##           make hermes-build-context or context-org CI via build-platform.yml).
## @invariants
##   - Trigger: push to core/modules/hermes-agent/** on main branch only
##   - Concurrency: cancel-in-progress — redundant builds from rapid commits are cancelled
##   - L1: hermes-agent-base (platform base with configs, profiles, skills) — public distribution base
##   - Tags: ghcr.io/tronyx161/hermes-agent-base:latest + :sha-${GITHUB_SHA} (full SHA — unambiguity)
##   - NO L2 build/push — L2 build step removed (D1, DevPlan 116 B3 T7); context orgs build L2
##   - Cache: type=gha,scope=hermes-agent-base (mode=max preserves all layers)
##   - DOCKER_BUILDKIT=1 for BuildKit-enhanced builds
##   - Registry: ghcr.io/tronyx161 (source org) — package published PUBLIC (manual operator step below)
## @rationale  U-60: L2-push into tronyx161 was dead weight (runtime pulls L2 from tronyxlab; no
##             consumer pulled tronyx161 L2). L1 contains no secrets (TRAP 2026-07-15) — publishing
##             the PACKAGE (org/repo stay private) enables anonymous pull for context-org L2 builds.
##             Tag policy: releases = versioned tags; prod defaults = digest-pin; :latest — dev/test
##             overrides + this workflow's floating base marker (DevPlan 116 B3 T7).
## @changes — 2026-07-24 | Initial creation — T3.2 CI workflow for auto-build + GHCR push
## @changes — 2026-08-01 | DevPlan 116 B3 T7 (U-60, D1): L2 build+push REMOVED; L1 tags →
##            :latest + :sha-${GITHUB_SHA}; @purpose/@rationale updated (public distribution base).
##            MANUAL operator step after merge (NOT from CI): publish the package —
##            `gh package visibility set hermes-agent-base --visibility public`
##            (or UI: Packages → hermes-agent-base → visibility → public). Required once so
##            context orgs can pull L1 anonymously (L1 has no secrets — only Python deps).
# endregion MODULE_CONTRACT

name: Build Hermes Images

on:
  push:
    branches: [main]
    paths:
      - 'core/modules/hermes-agent/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1
  REGISTRY: ghcr.io
  L1_IMAGE: ghcr.io/tronyx161/hermes-agent-base

jobs:
  build-and-push-l1:
    # [IMP:9][CI][L1] Build and push ONLY the L1 distribution base on hermes-agent source changes
    runs-on: ubuntu-latest
    steps:
      # ─── Step 1: Checkout ────────────────────────────────────────────────
      # [IMP:7][CI][checkout] Full checkout at pushed ref for Docker build context
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─── Step 2: Set up Docker Buildx ────────────────────────────────────
      # [IMP:7][CI][buildx] Enable BuildKit features: cache mounts, multi-stage, --cache-from/to
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ─── Step 3: Log in to GitHub Container Registry ─────────────────────
      # [IMP:8][CI][ghcr-login] Authenticate with GITHUB_TOKEN for push+gha cache
      # GITHUB_TOKEN provides full packages:write access with no additional secrets needed
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Step 4: Build and push L1 (hermes-agent-base) ──────────────────
      # [IMP:9][CI][L1] Build hermes-agent-base (platform base image) from build/Dockerfile
      # Context: core/modules/hermes-agent/build/ — contains configs, templates, skills, init scripts
      # Cache: type=gha with scope=hermes-agent-base for layer isolation from other workflows
      # Tags (DevPlan 116 B3 T7, D1): :latest (floating base marker) + :sha-<full SHA> (immutable).
      # Context orgs pull :latest anonymously (package is public — see MANUAL step in MODULE_CONTRACT).
      - name: Build and push L1 — hermes-agent-base
        uses: docker/build-push-action@v7
        with:
          context: core/modules/hermes-agent/build
          file: core/modules/hermes-agent/build/Dockerfile
          push: true
          tags: |
            ${{ env.L1_IMAGE }}:latest
            ${{ env.L1_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=hermes-agent-base
          cache-to: type=gha,mode=max,scope=hermes-agent-base
