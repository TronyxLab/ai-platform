# GREP_SUMMARY: build-platform sha-aware-aggregator workflow-run platform-test hermes-agent-base docker-buildx smoke-test load-true provisioner
# STRUCTURE: on:workflow_run(platform-test:completed,main) + workflow_dispatch → push-filter → verify SHA → build L1 hermes-agent-base (load:true) → smoke test → cleanup
# region MODULE_CONTRACT
## @purpose  SHA-aware platform agent build: triggered by platform-test success, builds L1 image
##           locally (load:true), runs smoke test. Manual workflow_dispatch also validates SHA.
## @scope    Uses SHA-aware aggregator (D4): verifies platform-test success for the same SHA before building.
## @invariants
##   - Triggers on workflow_run of platform-test (main-full-gate removed — Plan 2 consolidation)
##   - Push filter: github.event.workflow_run.event == 'push' prevents build on PR trigger
##   - Verifies platform-test succeeded for same SHA via GitHub API
##   - Builds locally via load:true; L1 pushed to ghcr.io as disaster recovery backup (not used directly by contexts)
##   - Smoke test: docker compose up + curl :9119/ + docker compose down
##   - Cache: type=gha,scope=hermes-agent-base
##   - Provisioner: provision-environment.sh replaces inline docker network create
## @rationale  SHA-aware prevents build after partial pipeline. load:true builds L1 locally.
##             L1 pushed to ghcr.io as disaster recovery backup — never used directly by contexts
##             (per RefactoringBrief M19/R6 context isolation).
## @changes — 2026-07-15 | Trigger: main-full-gate→platform-test + push event filter
## @changes — 2026-07-15 | Inline docker network create → provision-environment.sh --scope networks --scope volumes
## @changes — 2026-07-15 | Removed inline sudo mkdir (provisioner volumes scope handles it)
# endregion MODULE_CONTRACT

name: Build Platform Agent

on:
  workflow_run:
    workflows: ["platform-test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hermes-agent-base
  DOCKER_BUILDKIT: 1

jobs:
  verify-and-build:
    # Push filter: only build when triggered by push event (not PR)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # ⚠️ TRAP[BUG] · 2026-07-23 · P0 · sha-resolve before checkout — local action not found
      # · Same fix as core-deploy.yml (F2): checkout must precede any ./.github/actions/* usage

      # ─── Step 1: Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─── Step 2: SHA resolution + verification (canonical composite) ──
      - name: Resolve SHA + verify platform-test
        id: sha
        uses: ./.github/actions/sha-resolve
        with:
          verify: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ⚠️ TRAP[BUG] · 2026-07-18 · HI · same fix as platform-test.yml — ghcr.io 403 on cache
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Step 3: Provision environment ────────────────────────────────
      - name: Provision Docker environment (networks + volumes)
        uses: ./.github/actions/provisioner-call
        with:
          scope: networks,volumes

      # ─── Step 4: Build L1 locally (load:true) ────────────────────────
      - name: Build hermes-agent-base image
        uses: ./.github/actions/docker-build-cache
        with:
          context: core/modules/hermes-agent/build
          file: core/modules/hermes-agent/build/Dockerfile
          tags: hermes-agent-base:latest
          cache-scope: hermes-agent-base

      # ─── Step 5: Smoke test ───────────────────────────────────────────
      - name: Pull dependency images
        env:
          COMPOSE_PROFILES: hermes-agent
        run: |
          echo "=== Pulling images from compose file ==="
          docker compose -f core/modules/hermes-agent/docker-compose.base.yml pull --ignore-buildable 2>/dev/null || true

      - name: Smoke test — compose up and healthcheck
        env:
          COMPOSE_PROFILES: hermes-agent
        run: |
          echo "=== Smoke test: Starting hermes-agent with built image ==="
          SHA="${{ steps.sha.outputs.sha }}"

          # Ensure bind-mount source directory exists (volume: hermes-data → /var/lib/platform/hermes-agent/data)
          sudo mkdir -p /var/lib/platform/hermes-agent/data

          # ⚠️ TRAP[DECISION] · 2026-07-24 · HI · Loopback bind + test password for CI smoke test
          # · hermes-agent v2026.7+ refuses to bind dashboard + API server to 0.0.0.0 without auth.
          # · In production, HERMES_DASHBOARD_PASSWORD + API_SERVER_KEY are set via secrets.env.
          # · In CI smoke test, no secrets are available:
          # ·   - HERMES_DASHBOARD_HOST=127.0.0.1 → loopback bind, bypasses dashboard auth gate
          # ·   - API_SERVER_HOST=127.0.0.1 → loopback bind, bypasses API server auth gate
          # ·   - HERMES_DASHBOARD_PASSWORD=test-smoke-password → curl uses Basic Auth
          # · Port mapping is already 127.0.0.1:9119:9119 — no public exposure.
          # · Rev: if smoke test needs to validate auth → add HERMES_DASHBOARD_PASSWORD from CI secrets.
          SMOKE_PASSWORD="test-smoke-password"
          CONTEXT_IMAGE="hermes-agent-base:latest" \
          HERMES_DASHBOARD_HOST="127.0.0.1" \
          API_SERVER_HOST="127.0.0.1" \
          HERMES_DASHBOARD_PASSWORD="${SMOKE_PASSWORD}" \
          docker compose -f core/modules/hermes-agent/docker-compose.base.yml \
            --project-name build-platform-smoke \
            up -d

          echo "=== Waiting for agent readiness (180s max) ==="
          for i in $(seq 1 90); do
            if curl -sf -u "admin@ai-platform.local:${SMOKE_PASSWORD}" http://localhost:9119/ > /dev/null 2>&1; then
              echo "=== Agent ready on :9119 after ${i}s ==="
              break
            fi
            if [ $i -eq 90 ]; then
              echo "=== ERROR: Agent not ready after 180s ==="
              docker compose -f core/modules/hermes-agent/docker-compose.base.yml \
                --project-name build-platform-smoke logs
              docker compose -f core/modules/hermes-agent/docker-compose.base.yml \
                --project-name build-platform-smoke down -v
              exit 1
            fi
            sleep 2
          done

          echo "=== Dashboard endpoint: $(curl -s -o /dev/null -w '%{http_code}' -u "admin@ai-platform.local:${SMOKE_PASSWORD}" http://localhost:9119/) ==="
          echo "=== Smoke test PASSED ==="

      - name: Cleanup
        if: always()
        env:
          COMPOSE_PROFILES: hermes-agent
        run: |
          docker compose -f core/modules/hermes-agent/docker-compose.base.yml \
            --project-name build-platform-smoke down -v 2>/dev/null || true

      # ─── Step 6: Push L1 to ghcr.io (disaster recovery backup) ───────────
      - name: Push L1 to ghcr.io (backup)
        if: success()
        run: make hermes-push-l1
