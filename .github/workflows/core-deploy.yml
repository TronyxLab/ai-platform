# GREP_SUMMARY: core-deploy sha-aware-aggregator workflow-run platform-test rsync ssh-native bootstrap node-arg ci-pipeline audit-trail
# STRUCTURE: on:workflow_run(platform-test:completed,main) + workflow_dispatch → push-filter → verify SHA via GitHub API → rsync core/ → /opt/platform/ → ssh make node-update NODE=<name> → cleanup
# region MODULE_CONTRACT
## @purpose  CI pipeline for core code delivery to VPS — SHA-aware aggregator:
##           Triggers on platform-test completion (push to main only), verifies platform-test success
##           for same SHA, then rsyncs core/ and bootstraps on VPS with NODE= argument.
## @scope    Triggered by workflow_run on platform-test (completed, success, push event) OR manual workflow_dispatch
## @invariants
##   - Triggers ONLY on platform-test success (main-full-gate removed — Plan 2 consolidation)
##   - Push filter: github.event.workflow_run.event == 'push' prevents deploy on PR trigger
##   - Verifies platform-test succeeded for the same SHA via GitHub API
##   - SHA from workflow_run.head_sha (not github.sha)
##   - Rsync excludes: .git/, __pycache__/, *.pyc
##   - Destination: /opt/platform/core/ on VPS
##   - SSH user default: ci-deploy
##   - Node-update: `cd /opt/platform && make node-update NODE=<name>` (bootstrap-node сохранён как INIT-only manual fallback)
##   - NODE= auto-detected from /opt/node-configs/ on VPS (P11 fix replaced by auto-detection)
##   - Audit trail via GITHUB_SHA logged at deploy time
##   - workflow_dispatch: manual override with SHA validation
## @rationale  SHA-aware aggregator prevents deploy after partial pipeline (D4).
##             Plan 2 consolidation: main-full-gate removed, deploy workflows trigger
##             on platform-test with push event filter (no race condition P6).
##             NODE= auto-detected via auto_detect_node_name() in bootstrap.sh (replaces P11 fix).
## @changes — 2026-07-15 | Trigger: main-full-gate→platform-test + push event filter
## @changes — 2026-07-15 | NODE auto-detected (Option A, replacing P11 secrets-based fix)
# endregion MODULE_CONTRACT

name: core-deploy

on:
  workflow_run:
    workflows: ["platform-test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  VPS_USER: ci-deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    # Push filter: only deploy when triggered by push event (not PR)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # StatusReport 046 T7 (CICD-03): inline SHA verification → sha-resolve composite action.
      # Removed TRAP[DEBT] (resolved): core-deploy now uses shared sha-resolve with skip output.
      # ─── Step 1: Resolve SHA + verify platform-test (composite) ────────
      - name: Resolve SHA and verify platform-test
        id: sha
        uses: ./.github/actions/sha-resolve
        with:
          verify: 'true'

      # ─── Step 2: Checkout repository for rsync ─────────────────────────
      - name: Checkout repository
        if: steps.sha.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup platform (composite — python only)
        if: steps.sha.outputs.skip != 'true'
        uses: ./.github/actions/setup-platform
        with:
          python-version: ''
          install-gitleaks: 'false'
          run-provisioner: 'false'

      # ─── Step 3: Guard — check required secrets ────────────────────────
      - name: Check required secrets
        id: secrets-check
        if: steps.sha.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::warning::[IMP:8][deploy][skip] Required secrets VPS_HOST and/or VPS_SSH_KEY are not set — skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ─── Step 4: Rsync core + config to VPS (S5 consolidated — 3 steps → 2 rsync calls) ───
      - name: Rsync core + config to VPS
        if: steps.sha.outputs.skip != 'true' && steps.secrets-check.outputs.skip != 'true'
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/platform/core"
          # Rsync core/ with --delete (excludes .git, __pycache__, *.pyc)
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude 'default-user.xml' \
            --exclude '.env' \
            ./core/ ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/core/
          # Rsync root-level config files (no --delete, single-file sync)
          rsync -avz \
            ./platform-env.yaml ./Makefile \
            ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/
          echo "[IMP:9][deploy][rsync] Core + config rsync complete — SHA $SHA"

      # Step 6: Provision networks + volumes on VPS via make provision (Invariant 1).
      - name: Provision environment on VPS (networks + volumes)
        if: steps.sha.outputs.skip != 'true' && steps.secrets-check.outputs.skip != 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/platform && make provision SCOPE=networks,volumes"

      # ─── Step 7: Node update on VPS (5m) ──────────────────────────────
      # T18: заменён make bootstrap-node → make node-update.
      # bootstrap-node сохранён как manual fallback (INIT-only) через
      # make bootstrap-node NODE=<name> — недоступен через CI, только shell.
      - name: Node update on VPS (native SSH)
        if: steps.sha.outputs.skip != 'true' && steps.secrets-check.outputs.skip != 'true'
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          ssh -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            ${{ env.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/platform && GITHUB_SHA=$SHA make node-update"

      # ─── Step 8: Audit trail ──────────────────────────────────────────
      - name: Log deployment audit trail
        if: steps.secrets-check.outputs.skip != 'true'
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          echo "[DEPLOY] core SHA $SHA → ${{ secrets.VPS_HOST }}:/opt/platform/core/"

      # ─── Step 9: Failure notification ─────────────────────────────────
      - name: Notify on failure
        if: failure() && steps.secrets-check.outputs.skip != 'true'
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          echo "::error::core-deploy FAILED for SHA $SHA on ${{ secrets.VPS_HOST }}"
          echo "::error::Action required: investigate and rollback if needed"

      # ─── Step 10: Cleanup SSH key ─────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
          echo "[IMP:7][deploy][cleanup] SSH key cleaned up"
