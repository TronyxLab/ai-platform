# GREP_SUMMARY: deploy-project reusable workflow workflow_call deploy-project lifecycle deploy deliver-payload platform-deliver verify
# STRUCTURE: inputs(project_name, [node]) → ○ resolve node from NODE_HOST_MAP or inputs.node → ◇ fromJson → ⊕ ssh_host → ◆ deliver-payload (tar→SSH) → ◆ deploy → ◆ verify → ⎋ done
# region MODULE_CONTRACT
## @purpose  Reusable workflow for deploying projects — resolves target node from
##           NODE_HOST_MAP org variable, then SSH-deploys via forced-command.
##           Org-agnostic — no hardcoded org references (DD9).
## @scope    Called ONCE per project via `uses: <org>/ai-platform/.github/workflows/deploy-project.yml@main`
##           from project-level .github/workflows/deploy.yml
## @invariants
##   - `on.workflow_call` with required input: project_name, optional: node
##   - Uses `vars.NODE_HOST_MAP` (JSON) for zero-secret node resolution (K4)
##   - Uses `secrets: inherit` for CI_DEPLOY_KEY — no project-level secrets
##   - No org-specific references — any context org can use this workflow (DD1)
## - Zero-secret node resolution via NODE_HOST_MAP variable (DD4)
## @rationale Single reusable workflow eliminates 3× duplicate deploy patterns across templates,
##            centralizes node resolution, and keeps CI/CD thin (DD1, DD4).
##            Org-agnostic = context-safe: private workflows are org-scoped by default.
## @usecases  project deploy -> git push -> CI -> reusable workflow -> SSH forced-command
## @changes 2026-07-21 | W1: Added Check VPS readiness step before deliver
##           2026-07-21 | W5: Added Verify deliver step + command_timeout: 10m + set -euo pipefail on all run steps
# endregion MODULE_CONTRACT

name: Deploy Project (Reusable)

"on":
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name to deploy — must match ai-platform.yaml in checkout root"
      node:
        required: false
        type: string
        description: "Target node name (e.g. tronyx-vps) — overrides auto-resolution from ai-platform.yaml"
      org:
        required: false
        default: ''
        type: string
        description: "Organization name (for org-aware paths)"
    secrets:
      CI_DEPLOY_KEY:
        description: "SSH private key for CI deploy user on target node"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform (composite — python only)
        uses: ./.github/actions/setup-platform
        with:
          python-version: ''
          install-gitleaks: 'false'
          run-provisioner: 'false'

      - name: Resolve target node
        id: node-resolution
        env:
          NODE_HOST_MAP: ${{ vars.NODE_HOST_MAP }}
        run: |
          set -euo pipefail
          # Use inputs.node if provided, otherwise resolve from ai-platform.yaml
          # StatusReport 046 T4 (CICD-01c): inline python3 → yaml_query.py
          TARGET_NODE="${{ inputs.node }}"
          if [ -z "${TARGET_NODE}" ]; then
            TARGET_NODE=$(python3 core/internal/scripts/yaml_query.py --file ai-platform.yaml --get target_node --default tronyx-vps 2>/dev/null || echo "tronyx-vps")
          fi
          echo "[IMP:9][node-resolve] target_node=${TARGET_NODE}"
          echo "target_node=${TARGET_NODE}" >> "${GITHUB_ENV}"

          if [ -z "${NODE_HOST_MAP}" ]; then
            echo "[IMP:10][node-resolve] FATAL: NODE_HOST_MAP org variable not configured (K5)"
            exit 1
          fi

          # StatusReport 046 T5 (CICD-01d): inline python3 → yaml_query.py --stdin
          SSH_HOST=$(echo "${NODE_HOST_MAP}" | python3 core/internal/scripts/yaml_query.py --stdin --get "${TARGET_NODE}" --default "" 2>/dev/null) || true
          if [ -z "${SSH_HOST}" ]; then
            echo "[IMP:10][node-resolve] FATAL: node ${TARGET_NODE} not found in NODE_HOST_MAP (K5)"
            exit 1
          fi
          echo "[IMP:9][node-resolve] ssh_host=${SSH_HOST}"
          echo "ssh_host=${SSH_HOST}" >> "${GITHUB_ENV}"

      - name: Validate project payload
        run: |
          set -euo pipefail
          echo "[IMP:7][validate] Validating project payload for ${{ inputs.project_name }}..."
          make gate MODE=fast PROJECT=${{ inputs.project_name }}
          echo "[IMP:9][validate] Project payload validation passed"

      - name: Check VPS readiness
        env:
          NODE_HOST_MAP: ${{ vars.NODE_HOST_MAP }}
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          echo "[IMP:9][preflight] Checking VPS readiness via forced-command status verb..."
          STATUS_JSON=$(ssh -i ~/.ssh/ci_deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            ci-deploy@${{ env.ssh_host }} "status ${{ inputs.project_name }}" 2>&1) || true
          echo "[IMP:8][preflight] Status response: ${STATUS_JSON}"
          # StatusReport 046 T5 (CICD-01d): inline python3 → vps_status_check.py
          echo "${STATUS_JSON}" | python3 core/internal/scripts/vps_status_check.py
          echo "[IMP:9][preflight] VPS readiness check passed (status: $(echo "${STATUS_JSON}" | python3 core/internal/scripts/vps_status_check.py --output-status-only))"
        shell: bash

      - name: Deliver project payload
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_DEPLOY_KEY }}" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          ssh-keyscan -H "${{ env.ssh_host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Build file list — docker-compose.yml OR compose.yaml, ai-platform.yaml always, .env.platform if exists
          FILES="ai-platform.yaml"
          [ -f docker-compose.yml ] && FILES="$FILES docker-compose.yml"
          [ -f compose.yaml ] && FILES="$FILES compose.yaml"
          [ -f .env.platform ] && FILES="$FILES .env.platform"

          echo "[IMP:9][deliver] Delivering to ${{ env.ssh_host }}: ${FILES}"
          tar czf - $FILES | ssh -i ~/.ssh/ci_deploy_key -o StrictHostKeyChecking=accept-new ci-deploy@${{ env.ssh_host }} "platform-deliver ${{ inputs.org && format('{0} {1}', inputs.org, inputs.project_name) || inputs.project_name }}"
          echo "[IMP:9][deliver] Delivery complete"
        shell: bash

      - name: Verify deliver
        if: success()
        run: |
          set -euo pipefail
          echo "[IMP:9][verify-deliver] Verifying deliver via forced-command status verb..."
          STATUS_JSON=$(ssh -i ~/.ssh/ci_deploy_key -o StrictHostKeyChecking=accept-new \
            ci-deploy@${{ env.ssh_host }} "status ${{ inputs.project_name }}" 2>&1) || true
          # StatusReport 046 T5 (CICD-01d): inline python3 → vps_status_check.py
          # verify-deliver uses richer semantics (prints success/fatal + exit) — inline check kept minimal
          STATUS=$(echo "${STATUS_JSON}" | python3 core/internal/scripts/vps_status_check.py --output-status-only 2>/dev/null || echo "")
          if [ "${STATUS}" = "found" ] || [ "${STATUS}" = "stub" ]; then
            echo "[IMP:9][verify-deliver] Compose file verified on VPS (status: ${STATUS})"
          else
            echo "[IMP:10][verify-deliver] FATAL: project not found on VPS (status: ${STATUS})"
            exit 1
          fi
        shell: bash

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.ssh_host }}
          username: ci-deploy
          key: ${{ secrets.CI_DEPLOY_KEY }}
          script: /opt/platform/core/entrypoints/deploy.sh ${{ inputs.project_name }} ${{ github.sha }} production
          command_timeout: 10m

      - name: Post-deploy verify
        # ⚠️ TRAP[BUG] · 2026-07-20 · ci-deploy forced-command blocks arbitrary scripts.
        # Use 'verify <node>' verb (verb contract, dispatched by deploy.sh entrypoint).
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.ssh_host }}
          username: ci-deploy
          key: ${{ secrets.CI_DEPLOY_KEY }}
          script: verify ${{ env.target_node }}
