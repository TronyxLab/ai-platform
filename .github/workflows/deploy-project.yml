# GREP_SUMMARY: deploy-project reusable workflow workflow_call deploy-project lifecycle deploy receive verify ping single-channel
# STRUCTURE: inputs(project_name, [node]) → ○ resolve node from NODE_HOST_MAP or inputs.node → ◇ fromJson → ⊕ ssh_host → ◆ preflight ping → ◆ deliver+deploy (receive verb, tar→SSH) → ◆ post-deploy verify → ⎋ done
# region MODULE_CONTRACT
## @purpose  Reusable workflow for deploying projects — resolves target node from
##           NODE_HOST_MAP org variable, then SSH-deploys via the единый forced-command канал
##           (DevPlan 116 B1 T4, D1): preflight = честный ping; deliver+deploy = один шаг
##           `receive <project> <sha>` (tar по stdin); post-deploy verify = `verify <node>`.
##           Org-agnostic — no hardcoded org references (DD9).
## @scope    Called ONCE per project via `uses: <org>/ai-platform/.github/workflows/deploy-project.yml@main`
##           from project-level .github/workflows/deploy.yml
## @invariants
##   - `on.workflow_call` with required input: project_name, optional: node
##   - Uses `vars.NODE_HOST_MAP` (JSON) for zero-secret node resolution (K4)
##   - Uses `secrets: inherit` for CI_DEPLOY_KEY — no project-level secrets
##   - No org-specific references — any context org can use this workflow (DD1)
##   - ТОЛЬКО verbs ping/receive/verify (T4 критерий: 0 масок `|| true`, честные exit-коды)
##   - `set -euo pipefail` во всех SSH-шагах; exit-код SSH = результат receive (нет || true)
##   - Legacy workflow-каналы удалены (DevPlan 116 B1 T4, инвариант 9: не чинить)
## @rationale Single reusable workflow eliminates 3× duplicate deploy patterns across templates,
##            centralizes node resolution, and keeps CI/CD thin (DD1, DD4).
##            DevPlan 116 B1 (D1): one-shot receive = extract + preflight + compose-deploy +
##            healthcheck + notify/catalog в одном вызове; шаг «Verify deliver» удалён как дубль
##            (receive уже вернул JSON с result.status) — канон пост-деплоя — `verify <node>`.
## @usecases  project deploy -> git push -> CI -> reusable workflow -> SSH forced-command dispatch
## @changes 2026-07-21 | W1: Added Check VPS readiness step before deliver
##           2026-07-21 | W5: Added Verify deliver step + command_timeout: 10m + set -euo pipefail on all run steps
##           2026-08-01 | DevPlan 116 B1 T4: единый канал — preflight `ping`, deliver `receive <project> <sha>`,
##                       «Verify deliver» удалён (дубль receive-JSON), legacy deliver-verb убран
# endregion MODULE_CONTRACT

name: Deploy Project (Reusable)

"on":
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name to deploy — must match ai-platform.yaml in checkout root"
      node:
        required: false
        type: string
        description: "Target node name (e.g. tronyx-vps) — overrides auto-resolution from ai-platform.yaml"
      org:
        required: false
        default: ''
        type: string
        description: "Organization name (kept for caller compatibility — не используется в receive-канале, DevPlan 116 B1 D1)"
    secrets:
      CI_DEPLOY_KEY:
        description: "SSH private key for CI deploy user on target node"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform (composite — python only)
        uses: ./.github/actions/setup-platform
        with:
          # Pinned to 3.14: the payload-validation step runs `make gate MODE=fast PROJECT=...`
          # locally, which needs .venv/bin/python + PyYAML (yaml_query.py).
          python-version: '3.14'
          install-gitleaks: 'false'
          run-provisioner: 'false'

      - name: Resolve target node
        id: node-resolution
        env:
          NODE_HOST_MAP: ${{ vars.NODE_HOST_MAP }}
        run: |
          set -euo pipefail
          # Use inputs.node if provided, otherwise resolve from ai-platform.yaml
          # StatusReport 046 T4 (CICD-01c): inline python3 → yaml_query.py
          TARGET_NODE="${{ inputs.node }}"
          if [ -z "${TARGET_NODE}" ]; then
            TARGET_NODE=$(python3 core/internal/scripts/yaml_query.py --file ai-platform.yaml --get target_node --default tronyx-vps 2>/dev/null || echo "tronyx-vps")
          fi
          echo "[IMP:9][node-resolve] target_node=${TARGET_NODE}"
          echo "target_node=${TARGET_NODE}" >> "${GITHUB_ENV}"

          if [ -z "${NODE_HOST_MAP}" ]; then
            echo "[IMP:10][node-resolve] FATAL: NODE_HOST_MAP org variable not configured (K5)"
            exit 1
          fi

          # StatusReport 046 T5 (CICD-01d): inline python3 → yaml_query.py --stdin
          SSH_HOST=$(echo "${NODE_HOST_MAP}" | python3 core/internal/scripts/yaml_query.py --stdin --get "${TARGET_NODE}" --default "" 2>/dev/null) || true
          if [ -z "${SSH_HOST}" ]; then
            echo "[IMP:10][node-resolve] FATAL: node ${TARGET_NODE} not found in NODE_HOST_MAP (K5)"
            exit 1
          fi
          echo "[IMP:9][node-resolve] ssh_host=${SSH_HOST}"
          echo "ssh_host=${SSH_HOST}" >> "${GITHUB_ENV}"

      - name: Validate project payload
        run: |
          set -euo pipefail
          echo "[IMP:7][validate] Validating project payload for ${{ inputs.project_name }}..."
          make gate MODE=fast PROJECT=${{ inputs.project_name }}
          echo "[IMP:9][validate] Project payload validation passed"

      # ═══════════════════════════════════════════════════════════════════
      # DevPlan 065 P1+P3+P5: setup-ssh composite action — единый source of truth
      # ═══════════════════════════════════════════════════════════════════
      - name: Setup SSH for VPS
        id: setup-ssh
        uses: ./.github/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}
          ssh-host: ${{ env.ssh_host }}
          ssh-user: ci-deploy

      # ═══════════════════════════════════════════════════════════════════
      # DevPlan 065 P2 + 116 B1 T4: SSH pre-flight — ЧЕСТНЫЙ ping (без || true).
      # forced-command dispatch: SSH_ORIGINAL_COMMAND="ping" → "pong", exit 0.
      # ═══════════════════════════════════════════════════════════════════
      - name: SSH pre-flight check
        run: |
          set -euo pipefail
          PONG=$(ssh -o ConnectTimeout=10 ci-deploy@${{ env.ssh_host }} "ping")
          echo "[IMP:9][preflight] ping response: ${PONG}"
          if [ "${PONG}" != "pong" ]; then
            echo "[IMP:10][preflight] FATAL: expected 'pong' from forced-command ping, got '${PONG}'"
            exit 1
          fi
          echo "[IMP:9][preflight] SSH connectivity + forced-command verified (ping→pong)"

      - name: Deliver + deploy (one-shot receive)
        run: |
          set -euo pipefail
          # Build file list — docker-compose.yml OR compose.yaml, ai-platform.yaml always, .env.platform if exists
          FILES="ai-platform.yaml"
          [ -f docker-compose.yml ] && FILES="$FILES docker-compose.yml"
          [ -f compose.yaml ] && FILES="$FILES compose.yaml"
          [ -f .env.platform ] && FILES="$FILES .env.platform"

          echo "[IMP:9][deliver] Delivering to ${{ env.ssh_host }}: ${FILES}"
          # DevPlan 116 B1 D1: one-shot receive — tar по stdin → `receive <project> <sha>`.
          # forced-command dispatch диспетчеризует SSH_ORIGINAL_COMMAND="receive proj sha".
          # exit-код SSH = результат receive (БЕЗ || true) — честный канал.
          tar czf - $FILES | ssh -o ConnectTimeout=10 \
            ci-deploy@${{ env.ssh_host }} "receive ${{ inputs.project_name }} ${{ github.sha }}"
          echo "[IMP:9][deliver] Receive completed (exit=$?)"

      - name: Post-deploy verify
        # ⚠️ TRAP[BUG] · 2026-07-20 · ci-deploy forced-command blocks arbitrary scripts.
        # Use 'verify <node>' verb (verb contract, dispatched by orchestrator_cli dispatch).
        # DevPlan 116 B1 T4: «Verify deliver» удалён как дубль — receive вернул JSON;
        # канон пост-деплоя = verify <node>.
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=10 ci-deploy@${{ env.ssh_host }} "verify ${{ env.target_node }}"
