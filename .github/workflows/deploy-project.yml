# GREP_SUMMARY: deploy-project reusable workflow workflow_call deploy-project lifecycle deploy deliver-payload platform-deliver verify
# STRUCTURE: inputs(project_name, [node]) → ○ resolve node from NODE_HOST_MAP or inputs.node → ◇ fromJson → ⊕ ssh_host → ◆ deliver-payload (tar→SSH) → ◆ deploy → ◆ verify → ⎋ done
# region MODULE_CONTRACT
## @purpose  Reusable workflow for deploying projects — resolves target node from
##           NODE_HOST_MAP org variable, then SSH-deploys via forced-command.
##           Org-agnostic — no hardcoded org references (DD9).
## @scope    Called ONCE per project via `uses: <org>/ai-platform/.github/workflows/deploy-project.yml@main`
##           from project-level .github/workflows/deploy.yml
## @invariants
##   - `on.workflow_call` with required input: project_name, optional: node
##   - Uses `vars.NODE_HOST_MAP` (JSON) for zero-secret node resolution (K4)
##   - Uses `secrets: inherit` for CI_DEPLOY_KEY — no project-level secrets
##   - No org-specific references — any context org can use this workflow (DD1)
## - Zero-secret node resolution via NODE_HOST_MAP variable (DD4)
## @rationale Single reusable workflow eliminates 3× duplicate deploy patterns across templates,
##            centralizes node resolution, and keeps CI/CD thin (DD1, DD4).
##            Org-agnostic = context-safe: private workflows are org-scoped by default.
## @usecases  project deploy -> git push -> CI -> reusable workflow -> SSH forced-command
# endregion MODULE_CONTRACT

name: Deploy Project (Reusable)

"on":
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name to deploy — must match ai-platform.yaml in checkout root"
      node:
        required: false
        type: string
        description: "Target node name (e.g. tronyx-vps) — overrides auto-resolution from ai-platform.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve target node
        id: resolve-node
        env:
          NODE_HOST_MAP: ${{ vars.NODE_HOST_MAP }}
        run: |
          # Use inputs.node if provided, otherwise resolve from ai-platform.yaml
          TARGET_NODE="${{ inputs.node }}"
          if [ -z "${TARGET_NODE}" ]; then
            TARGET_NODE=$(python3 -c "import yaml; d=yaml.safe_load(open('ai-platform.yaml')); print(d.get('target_node','tronyx-vps'))" 2>/dev/null || echo "tronyx-vps")
          fi
          echo "[IMP:9][resolve-node] target_node=${TARGET_NODE}"
          echo "target_node=${TARGET_NODE}" >> "${GITHUB_ENV}"

          if [ -z "${NODE_HOST_MAP}" ]; then
            echo "[IMP:10][resolve-node] FATAL: NODE_HOST_MAP org variable not configured (K5)"
            exit 1
          fi

          SSH_HOST=$(echo "${NODE_HOST_MAP}" | python3 -c "import json,sys; m=json.load(sys.stdin); n='${TARGET_NODE}'; h=m.get(n,''); print(h if h else (print(f'K5: node {n} not found in NODE_HOST_MAP',file=sys.stderr) or exit(1)))")
          echo "[IMP:9][resolve-node] ssh_host=${SSH_HOST}"
          echo "ssh_host=${SSH_HOST}" >> "${GITHUB_ENV}"

      - name: Deliver project payload
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_DEPLOY_KEY }}" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          ssh-keyscan -H "${{ env.ssh_host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Build file list — docker-compose.yml OR compose.yaml, ai-platform.yaml always, .env.platform if exists
          FILES="ai-platform.yaml"
          [ -f docker-compose.yml ] && FILES="$FILES docker-compose.yml"
          [ -f compose.yaml ] && FILES="$FILES compose.yaml"
          [ -f .env.platform ] && FILES="$FILES .env.platform"

          echo "[IMP:9][deliver] Delivering to ${{ env.ssh_host }}: ${FILES}"
          tar czf - $FILES | ssh -i ~/.ssh/ci_deploy_key -o StrictHostKeyChecking=no ci-deploy@${{ env.ssh_host }} "platform-deliver ${{ inputs.project_name }}"
          echo "[IMP:9][deliver] Delivery complete"
        shell: bash

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.ssh_host }}
          username: ci-deploy
          key: ${{ secrets.CI_DEPLOY_KEY }}
          script: /opt/platform/core/entrypoints/deploy.sh ${{ inputs.project_name }} ${{ github.sha }} production

      - name: Post-deploy verify
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.ssh_host }}
          username: ci-deploy
          key: ${{ secrets.CI_DEPLOY_KEY }}
          script: |
            echo "[IMP:9][verify] Starting post-deploy verification for ${{ inputs.project_name }} on ${TARGET_NODE}"
            make verify NODE=${{ env.target_node }}
            echo "[IMP:10][verify] Verification PASSED — all endpoints healthy for ${{ inputs.project_name }}"
