# GREP_SUMMARY: heartbeat-check cron out-of-band s3-readonly staleness notify-critical telegram direct-https
# STRUCTURE: on:schedule(*/30) → checkout → setup-python+boto3 → heartbeat_check.py (S3 list → stale>2ч → notify critical, прямой HTTPS) → ⎋ exit 0|1
# region MODULE_CONTRACT
## @purpose  Out-of-band живучесть (DevPlan 003 A2): CI cron каждые 30 мин читает
##           S3 {prefix}/heartbeat/ → авто-обнаружение нод → stale >2ч → Telegram critical
##           (прямой HTTPS). Узел умер целиком → heartbeat stale → алерт извне.
##           Писатель heartbeat — core/modules/backup-cron/scripts/heartbeat.py (нода, */15).
## @scope    GitHub Actions cron (schedule */30 + workflow_dispatch). boto3 — только здесь
##           (DevPlan 003 REQUIRES: «boto3 — только CI-крон»).
## @invariants
##   - Read-only креды: S3_READONLY_ACCESS_KEY/S3_READONLY_SECRET_KEY (отдельный read-only IAM
##     ключ, НЕ мастер-ключи — DevPlan 003 B5); отсутствие → честный fail (R4)
##   - Прямой HTTPS: notify-ci контракт (proxy не используется; раннер вне ноды — TRAP[BUG] 141)
##   - Приватные значения (ключи/токены) — env-контекст шага из GitHub Secrets (M4)
##   - S3-ошибка → exit 1 (heartbeat-reader не может молчать; видимость в Actions UI)
## @rationale  Self-hosted dead-man's switch (DevPlan 162 W6-1 validation: external checker
##             LastModified >2ч → алерт) без third-party uptime-сервисов.
## @changes  2026-08-16 | DevPlan 003 A2 — created
# endregion MODULE_CONTRACT

name: heartbeat-check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat-check:
    name: Heartbeat staleness check (S3 → Telegram)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # boto3 — только CI-крон (DevPlan 003 REQUIRES); heartbeat_check.py — stdlib + boto3
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install -q boto3

      - name: Check heartbeats (S3 list + staleness >2h)
        env:
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_READONLY_ACCESS_KEY: ${{ secrets.S3_READONLY_ACCESS_KEY }}
          S3_READONLY_SECRET_KEY: ${{ secrets.S3_READONLY_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_CRITICAL: ${{ secrets.TELEGRAM_CHAT_ID_CRITICAL }}
          TELEGRAM_CHAT_ID_WARNING: ${{ secrets.TELEGRAM_CHAT_ID_WARNING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 core/internal/scripts/heartbeat_check.py
