# GREP_SUMMARY: hermes-nightly scheduled cron weekly L2-rebuild node-update S8-auto-rebuild D-134-L4
# STRUCTURE: on:schedule(weekly cron) → job(nightly: checkout → make hermes-build-context → make hermes-push-l2) → ⎋ exit
# region MODULE_CONTRACT
## @purpose  Scheduled weekly hermes rebuild (D-134-L4, DevPlan 145 W4): единый L2-образ
##           (L1→L2 коллапс DevPlan 002) сборка + push в ghcr.io после S8-детекции
##           (security_posture.py). Автопересборка закрывает gap между детекцией уязвимости
##           (S8 в security_posture) и её исправлением (rebuild с patched upstream).
## @scope    Scheduled workflow (cron). НЕ триггерится на push/PR — только schedule + manual dispatch.
##           CONTEXT должен быть задан (default: tronyx — продакшен-контекст оператора).
## @invariants
##   - Cron: weekly (Sunday 03:00 MSK — низкая нагрузка, перед началом рабочей недели)
##   - CONTEXT env обязателен (default tronyx); CI_DEPLOY_KEY / GHCR_PUSH_TOKEN — из secrets
##   - hermes-build-context → единый L2 образ (base-стадия cached) → push ghcr.io
##   - node-update НЕ запускается автоматически (требует SSH к ноде) — только артефакт-обновление
##   - Failure → issue creation (operator action required)
## @rationale D-134-L4: S8-детекция (security_posture.py --json) реализована, но автопересборка
##            после обнаружения CVE отсутствовала. Weekly cron обеспечивает регулярное обновление
##            даже без явного trigger от S8. Manual dispatch — для ad-hoc пересборки.
##            node-update остаётся ручным (SSH + state.json + converge — операционное окно).
## @changes 2026-08-11 | DevPlan 145 W4 D-134-L4 — Created (weekly cron rebuild + push)
## @changes 2026-08-16 | DevPlan 002 W4 T4.5 — комментарии L1→L2 → «единый L2-образ» (таргеты не меняются)
# endregion MODULE_CONTRACT

name: hermes-nightly

on:
  schedule:
    # Weekly: Saturday 20:00 UTC = Saturday 23:00 MSK (Europe/Moscow)
    # T1.10 (аудит 2026-08-22): комментарий согласован с фактическим cron
    # (прежний «Sunday 03:00 MSK» — неверная арифметика UTC+3; окно cron НЕ менялось).
    - cron: '0 20 * * 6'
  workflow_dispatch:
    inputs:
      context:
        description: 'Context for L2 build (default: tronyx)'
        required: false
        default: 'tronyx'

permissions:
  contents: read

jobs:
  nightly-rebuild:
    name: Weekly L1→L2 rebuild + push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CONTEXT: ${{ github.event.inputs.context || 'tronyx' }}

    steps:
      # ─── Step 1: Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─── Step 2: Setup Docker (Buildx for multi-stage) ────────────────
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ─── Step 3: Login to ghcr.io (L1 pull + L2 push) ─────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Step 4: Build единый L2 context image ───────────────────────────
      # hermes-build-context: единый образ (base-стадия cached из BuildKit, final = context overlay).
      # CONTEXT определяет overlay (context_deployer.py ensure_context_repo).
      - name: Build L2 context image (CONTEXT=${{ env.CONTEXT }})
        run: make hermes-build-context CONTEXT=${{ env.CONTEXT }}

      # ─── Step 5: Push L2 to ghcr.io ───────────────────────────────────
      - name: Push L2 to ghcr.io
        run: make hermes-push-l2 CONTEXT=${{ env.CONTEXT }}

      # ─── Step 6: Summary (manual node-update reminder) ────────────────
      # node-update НЕ запускается автоматически — требует SSH + state.json + converge.
      # Operator выполняет `make node-update NODE=<node>` в операционном окне.
      - name: Summary (manual node-update required)
        if: always()
        run: |
          echo "## Hermes Nightly Rebuild Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Context: \`${{ env.CONTEXT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- L2 image: pushed to ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Manual action required" >> $GITHUB_STEP_SUMMARY
          echo "Run \`make node-update NODE=<node>\` on each node to pull the new L2 image." >> $GITHUB_STEP_SUMMARY

      # ─── Failure notification (DevPlan 003 A1) ─────────────────────────
      # Build-fail → warning severity (сборка L2 не критична в моменте, но должна быть видима)
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id-critical: ${{ secrets.TELEGRAM_CHAT_ID_CRITICAL }}
          chat-id-warning: ${{ secrets.TELEGRAM_CHAT_ID_WARNING }}
          severity: warning
          context: hermes-nightly
          event: ci.build_failed
          message: "hermes-nightly build FAILED (CONTEXT=${{ env.CONTEXT }}, run ${{ github.run_id }})"
          link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          action: "Check build logs and retry"
