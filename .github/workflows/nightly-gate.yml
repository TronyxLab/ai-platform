# GREP_SUMMARY: nightly-gate scheduled-audit full-gate integration gitleaks-composite alert-only
# STRUCTURE: on:schedule(cron:0 3 * * *) → nightly-gate(pre-commit+full-gate+integration) → ⎋ alert-on-failure
# region MODULE_CONTRACT
## @purpose — Scheduled nightly audit workflow: full gate + integration tests.
##            Does not block deploy — alerts (Slack/email/webhook) on failure.
## @scope — Runs nightly at 03:00 UTC via cron schedule
## @invariants
##   - make pre-commit-run: validate all files against doc headers
##   - make gate MODE=full: complete gate pipeline
##   - make test MARKER=integration: integration tests with live mode
##   - Non-blocking: failures trigger alerts, not deploy blocks
##   - Gitleaks uses composite action setup-gitleaks (single source of truth)
## @rationale — Catches regressions that only manifest during non-peak hours.
## @changes — 2026-07-15 | Inline gitleaks install → composite action setup-gitleaks
# endregion MODULE_CONTRACT

name: nightly-gate

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly-audit:
    name: Nightly Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      INTEGRATION_MODE: live

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup gitleaks (composite action)
        uses: ./.github/actions/setup-gitleaks

      - name: Fetch origin/main for inventory baseline
        run: git fetch origin main:refs/remotes/origin/main --depth=1 || true

      - name: Setup Python venv
        uses: ./.github/actions/setup-python-venv
        with:
          install-pre-commit: 'true'

      # ── Stage 1: Pre-commit hooks (all files) ─────────────────────────
      - name: Run pre-commit hooks (all files)
        id: pre-commit-hooks
        run: make pre-commit-run
        continue-on-error: true
        env:
          SKIP: "no-commit-to-branch"

      # ── Stage 2: Provision environment + Full gate ────────────────────
      # Single Source of Truth: networks + volumes + env vars from platform-env.yaml
      - name: Provision environment (networks + volumes + CI env defaults)
        uses: ./.github/actions/provisioner-call
        with:
          scope: all

      - name: Run full gate (MODE=full)
        id: full_gate
        run: make gate MODE=full

      # ── Stage 3: Integration tests ────────────────────────────────────
      - name: Integration tests — error-path
        id: integration_error_path
        run: |
          INTEGRATION_MODE=error-path make test MARKER=integration && rc=0 || rc=$?
          if [ $rc -eq 5 ]; then
            echo "[integration] No tests collected — exit 5 is OK"
            exit 0
          fi
          exit $rc

      - name: Integration tests — live mode
        id: integration_live
        run: |
          make test MARKER=integration && rc=0 || rc=$?
          if [ $rc -eq 5 ]; then
            echo "[integration] No tests collected — exit 5 is OK"
            exit 0
          fi
          exit $rc

      # ── Stage 4: Alert on failure ─────────────────────────────────────
      - name: Alert on test failures
        if: failure()
        run: |
          echo "::warning::[nightly-gate] One or more stages FAILED — investigate"
          echo "::warning::[nightly-gate] Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ── Stage 5: Cleanup Docker resources ──────────────────────────
      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "::group::Cleanup Docker Compose stacks"
          for compose_file in \
            core/modules/backup-cron/docker-compose.base.yml \
            core/modules/clickhouse/docker-compose.base.yml \
            core/modules/hermes-agent/docker-compose.base.yml \
            core/modules/infra-metrics/docker-compose.base.yml \
            core/modules/langfuse/docker-compose.base.yml \
            core/modules/litellm/docker-compose.base.yml \
            core/modules/logging/docker-compose.base.yml \
            core/modules/minio/docker-compose.base.yml \
            core/modules/monitoring/docker-compose.base.yml \
            core/modules/nginx/docker-compose.base.yml \
            core/modules/postgres/docker-compose.base.yml \
            core/modules/redis/docker-compose.base.yml; do
            if [ -f "$compose_file" ]; then
              docker compose -f "$compose_file" -p ai-platform-test down --timeout 5 --remove-orphans 2>/dev/null || true
              docker compose -f "$compose_file" -p ai-platform-integration-test down --timeout 5 --remove-orphans 2>/dev/null || true
            fi
          done
          echo "::endgroup::"

      # ── Stage 6: Summary ─────────────────────────────────────────────
      - name: Generate Nightly Audit Summary
        if: always()
        run: |
          {
            echo "## 🌙 Nightly Audit Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Pre-commit Hooks | ${{ steps.pre-commit-hooks.outcome }} |"
            echo "| Full Gate | ${{ steps.full_gate.outcome }} |"
            echo "| Integration (error-path) | ${{ steps.integration_error_path.outcome }} |"
            echo "| Integration (live) | ${{ steps.integration_live.outcome }} |"
            echo ""
            echo "### Links"
            echo "- [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
