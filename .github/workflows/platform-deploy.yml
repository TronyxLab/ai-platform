# GREP_SUMMARY: reusable-workflow platform-deploy ci-deploy SSH authorized-keys staging environment-input NODE_HOST NODE_CI_KEY
# STRUCTURE: on:workflow_call(inputs:environment) → SSH ci-deploy → platform-deploy <project> <ref> <environment>
# region MODULE_CONTRACT
## @purpose  Reusable GitHub Actions workflow: thin CI/CD that calls platform-deploy on node via SSH
## @scope    Called from all template deploy.yml files; no business logic — delegates to platform-deploy.sh on node
## @invariants
##   - One SSH command only: platform-deploy.sh <project> <ref> <environment>
##   - Rollback is on-node; CI/CD does NOT implement rollback (04 §7, AR11)
##   - Secrets: NODE_<NAME>_HOST, NODE_<NAME>_CI_KEY (NAME = target_node UPPERCASE)
##   - Environment routing via `inputs.environment` — staging or production
##   - `inputs.environment == 'staging'` → STAGING=true env var passed to SSH action
##   - `inputs.environment == 'production'` → no STAGING var, production environment gate
##   - ci-deploy has NO shell; authorized_keys forces platform-deploy.sh (00 §4)
## @rationale
##   Thin CI/CD: no business logic in Actions; rollback on node for fast response without network roundtrip.
##   Staging as an environment choice (not git ref) decouples deploy routing from branch strategy.
##   The caller (template deploy.yml) decides which environment to target based on branch or workflow_dispatch.
##   STAGING=true env var informs platform-deploy.sh to use staging compose project + ports + networks.
# endregion MODULE_CONTRACT

name: platform-deploy (reusable)

on:
  workflow_call:
    inputs:
      project_name:
        description: "Project name (from ai-platform.yaml .name)"
        required: true
        type: string
      project_yaml_path:
        description: "Path to ai-platform.yaml relative to repo root"
        required: false
        type: string
        default: "ai-platform.yaml"
      image_registry:
        description: "Container image registry (e.g. ghcr.io)"
        required: false
        type: string
        default: "ghcr.io"
      environment:
        description: "Deploy target environment: production | staging"
        required: false
        type: string
        default: "production"
    secrets:
      # Caller must pass: NODE_<NAME>_HOST and NODE_<NAME>_CI_KEY
      # where NAME is the target_node value in UPPERCASE from ai-platform.yaml
      SSH_HOST:
        description: "SSH host for target node (value of NODE_<NAME>_HOST secret)"
        required: true
      SSH_KEY:
        description: "SSH private key for ci-deploy user (value of NODE_<NAME>_CI_KEY secret)"
        required: true
      DOCKER_HUB_USERNAME:
        description: "Docker Hub username for authenticated pulls"
        required: false
      DOCKER_HUB_TOKEN:
        description: "Docker Hub personal access token (dckr_pat_...)"
        required: false

concurrency:
  group: ${{ inputs.environment }}-deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Permissions audit 2026-07-07 (C2): All jobs inherit repo-default (read).
  # GITHUB_TOKEN is NOT used by any step — SSH key provides deploy access.
  # No explicit permissions block needed — repo-default is already read-only.

  # ─── Deploy to staging (environment input = staging) ─────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # [IMP:9][deploy][staging-gate] Triggered when caller passes environment: staging
    if: inputs.environment == 'staging' && inputs.project_name != ''
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform
        uses: ./.github/actions/setup-platform
        with:
          python-version: ''
          install-gitleaks: 'false'
          run-provisioner: 'false'

      - name: Read ai-platform.yaml
        id: project
        run: |
          # [IMP:8][deploy][read-yaml] Parse ai-platform.yaml for target_node and staging flag
          STAGING=$(python3 -c "
          import yaml, sys
          with open('${{ inputs.project_yaml_path }}') as f:
              d = yaml.safe_load(f)
          envs = d.get('environments', {})
          print('true' if envs.get('staging', False) else 'false')
          " 2>/dev/null || echo "false")
          echo "staging=${STAGING}" >> "$GITHUB_OUTPUT"

      - name: Set Docker Hub env
        run: |
          # [IMP:7][deploy][docker-env] Export Docker Hub credentials for SSH action
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME || '' }}" >> $GITHUB_ENV
          echo "DOCKER_HUB_TOKEN=${{ secrets.DOCKER_HUB_TOKEN || '' }}" >> $GITHUB_ENV

      - name: Set STAGING env var
        # [IMP:9][deploy][staging-env] Inform platform-deploy.sh that this is a staging deploy
        if: steps.project.outputs.staging == 'true'
        run: echo "STAGING=true" >> $GITHUB_ENV

      - name: Deploy to staging via SSH
        if: steps.project.outputs.staging == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ci-deploy
          key: ${{ secrets.SSH_KEY }}
          # [IMP:10][deploy][ssh] SINGLE whitelisted command — no shell, restrict enforced by authorized_keys (00 §4)
          # authorized_keys on node: command="/opt/platform/core/internal/deploy/deploy-project.sh",restrict,...
          # The SSH server runs deploy-project.sh regardless of what we send as command.
          # We pass project + ref + environment as the forced command arguments via SSH command field.
          script: ${{ inputs.project_name }} ${{ github.sha }} ${{ inputs.environment }}
          envs: DOCKER_HUB_USERNAME,DOCKER_HUB_TOKEN,STAGING
          # Note: ci-deploy authorized_keys ignores the script and runs deploy-project.sh <project> <sha> <environment>
          # because command="..." in authorized_keys overrides any client-provided command.

  # ─── Deploy to production (environment input = production) ───────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.environment == 'production' && inputs.project_name != ''
    # [IMP:9][deploy][prod-gate] Owner confirmation required for production (04 §4)
    environment:
      name: production
      # GitHub environment protection rules: required reviewer = owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform
        uses: ./.github/actions/setup-platform
        with:
          python-version: ''
          install-gitleaks: 'false'
          run-provisioner: 'false'

      - name: Set Docker Hub env
        run: |
          # [IMP:7][deploy][docker-env] Export Docker Hub credentials for SSH action
          echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME || '' }}" >> $GITHUB_ENV
          echo "DOCKER_HUB_TOKEN=${{ secrets.DOCKER_HUB_TOKEN || '' }}" >> $GITHUB_ENV

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ci-deploy
          key: ${{ secrets.SSH_KEY }}
          # [IMP:10][deploy][ssh] Pass project + sha + environment (production) to platform-deploy.sh
          script: ${{ inputs.project_name }} ${{ github.sha }} ${{ inputs.environment }}
          envs: DOCKER_HUB_USERNAME,DOCKER_HUB_TOKEN

  # ─── E2E smoke tests after production deploy (Wave 4) ────────────────────────
  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: inputs.environment == 'production'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform
        uses: ./.github/actions/setup-platform
        with:
          python-version: ''
          install-gitleaks: 'false'
          run-provisioner: 'false'
      - name: Smoke test — health endpoint
        run: curl --fail --retry 3 --retry-delay 5 --max-time 10 '${{ secrets.E2E_BASE_URL }}/health'
      - name: Smoke test — Grafana
        run: curl --fail --retry 3 --retry-delay 5 --max-time 10 '${{ secrets.E2E_GRAFANA_URL }}/api/health'
    timeout-minutes: 5

  # ⚠️ deploy-dev-direct REMOVED 2026-07-06: caused race condition with deploy-production
  # Both jobs had identical `if: inputs.environment == 'production'` without `needs:`,
  # resulting in two parallel SSH deploys to the same node. Production deploy always
  # goes through deploy-production (with environment gate). If staging bypass is needed,
  # create a separate production-direct environment in GitHub, not a parallel job.
  # See TRAP[DECISION] above for deployment strategy rationale.
