# GREP_SUMMARY: platform-gate-fast fast-gate push-main gitleaks make-gate-fast workflow-trigger downstream-decoupling D2
# STRUCTURE: on:push(main)+workflow_dispatch → job(fast-gate: checkout → setup-platform+gitleaks → compose-profiles → make gate MODE=fast) → ⎋ downstream (core-deploy/build-platform/mirror) триггерятся workflow_run
# region MODULE_CONTRACT
## @purpose  Лёгкий gate-workflow (D2, DevPlan 116 B11 T4, U-57): развязка downstream
##           (core-deploy/build-platform/mirror) от полного platform-test (~20 мин + integration/docker).
##           Триггерится на push в main (и workflow_dispatch), выполняет gitleaks + `make gate MODE=fast`
##           (~2-3 мин). Downstream workflows слушают workflow_run этого workflow.
## @scope    Push-гейт для main-ветки. НЕ заменяет platform-test (PR-валидация + full-gate остаются).
## @invariants
##   - Имя workflow ТОЧНО "platform-gate-fast" (workflow_run ищет по имени — опечатка = тихий отказ)
##   - gitleaks через композитный setup-platform (install-gitleaks: 'true') — единый SoT
##   - concurrency-группа по SHA (паттерн platform-test) — защита от двойного запуска push+dispatch
##   - COMPOSE_PROFILES экспортируется из platform-env.yaml (compose-profiles action)
##   - Никаких Docker/integration-степов — flaky-изоляция downstream (D2)
## @rationale U-57: downstream ждали 20-минутный full-gate + integration — хрупкая цепочка.
##            Отдельный лёгкий gate-workflow (fast-gate) — единственный триггер downstream.
## @changes 2026-08-01 | DevPlan 116 B11 T4 (D2, U-57) — Created
# endregion MODULE_CONTRACT

name: platform-gate-fast

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast Gate (gitleaks + make gate MODE=fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Test Honesty R4 (DevPlan 117 Brief F + DevPlan 119 A3): CI-раннеры ИМЕЮТ Docker →
    # REQUIRE_HONESTY_MODE=fail (отсутствие сервиса = FAIL, не skip — R4 compliant).
    # Локальная dev-машина остаётся marker: переменная не задана → default "marker"
    # (tests/_conftest/honesty.py _honesty_mode()).
    env:
      REQUIRE_HONESTY_MODE: fail

    steps:
      # ─── Step 1: Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─── Step 2: Setup platform + gitleaks (composite SoT) ────────────
      - name: Setup platform (composite — python + gitleaks)
        uses: ./.github/actions/setup-platform
        with:
          python-version: '3.14'
          # D67 (DevPlan 117): pre-commit НЕОБХОДИМ — make gate MODE=fast Step 1 = pre-commit-run.
          # install-pre-commit: 'false' → cache-miss = command not found (K3). Вариант A: true + cache.
          install-pre-commit: 'true'
          install-gitleaks: 'true'
          run-provisioner: 'false'

      # ─── Step 2b: Cache pre-commit venv (D67 — mirror platform-test.yml) ──
      # DevPlan 123 T2 (P-14): ключ включает pyproject.toml hash (ruff-версия) —
      # прежний ключ только по .pre-commit-config.yaml давал cache-hit со старым venv.
      - name: Cache pre-commit venv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ hashFiles('pyproject.toml') }}

      # ─── Step 3: Export COMPOSE_PROFILES (SoT platform-env.yaml) ──────
      - name: Export COMPOSE_PROFILES from platform-env.yaml
        uses: ./.github/actions/compose-profiles

      # ─── Step 4: Fast gate (syntax + JSON + gates + static + predeploy) ──
      - name: Run fast gate (syntax + JSON + gates + static + predeploy — no Docker)
        run: make gate MODE=fast

      # ─── Step 4b: Диагностика state_machine фейлов (временный, RC-121) ──
      - name: Diagnose state_machine CI failures (temporary)
        if: always()
        run: .venv/bin/python3 -m pytest tests/unit/test_state_machine.py::test_init_flow_all_phases tests/unit/test_state_machine.py::test_tor_conditional_runs -s --log-cli-level=INFO --no-header 2>&1 | tail -70

      # ─── Step 5: Manifest generation contract (G1-G6 + G4-root glossary) ──
      - name: Check generated manifests up to date
        run: make check-manifests

      # ─── Step 6: Диагностические junit-артефакты (временный, RC-121) ──
      - name: Upload junit artifacts (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: tests/report*.xml
          if-no-files-found: ignore
