# GREP_SUMMARY: push-gate quick-gate any-branch pre-commit gitleaks-composite provisioner no-fast-gate-duplication
# STRUCTURE: on:push(branches-ignore:main) → quick-gate(pre-commit only) → teardown(docker-network-cleanup)
# region MODULE_CONTRACT
## @purpose — Lightweight CI gate on push to any branch (except main): pre-commit hooks only (gitleaks + code quality).
##            НЕ запускает `make gate MODE=fast` — полный fast-gate гарантирован локальным pre-push hook
##            (pre-push-gate.sh, blocking; V2 superposition 2026-08-05) — CI-дубль устранён.
## @scope — Runs on every git push to non-main branches; cancelled on new pushes to same branch.
##            PR-валидация (полный gate + Docker/integration) = platform-test.yml;
##            main-branch gate + R4-honesty (REQUIRE_HONESTY_MODE=fail) = platform-gate-fast.yml.
## @invariants
##   - No Docker compose stacks are started — only Docker networks for provisioner
##   - Pre-commit run includes: gitleaks, check-yaml, trailing-whitespace, end-of-file-fixer
##   - NO `make gate MODE=fast` step — дубль локального pre-push (V2, DevPlan-superposition 2026-08-05)
##   - Timeout: 5 minutes (pre-commit ~30-60s; запас на холодный pre-commit venv cache)
##   - Docker networks created via provision-environment.sh (Plan 1 foundation)
##   - Gitleaks uses composite action setup-gitleaks (single source of truth)
##   - Cleanup runs unconditionally — removes Docker networks created by provisioner
## @rationale — Fast feedback for every push. Catches gitleaks leaks, malformed YAML/JSON/Python,
##   config schema violations before PR is opened — БЕЗ дублирования локального pre-push fast-gate
##   (экономия ~3 min CI-минут на каждый push; локальный pre-push — обязательный шлагбаум).
##   Main-branch gate uses platform-gate-fast.yml; PR full gate uses platform-test.yml.
## @changes — 2026-07-15 | Inline docker network create → provision-environment.sh --scope networks
## @changes — 2026-07-15 | Inline gitleaks install → composite action setup-gitleaks
## @changes — 2026-08-05 | V2 (superposition): removed `make gate MODE=fast` step — точный дубль локального
##   pre-push hook (pre-push-gate.sh, blocking). Остаётся только make pre-commit-run (лёгкая страховка среды).
# endregion MODULE_CONTRACT

name: push-gate

on:
  push:
    branches-ignore: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-gate:
    name: Quick Gate (pre-commit hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    # COMPOSE_PROFILES — exported by compose-profiles composite action (DevPlan 064 S1).
    # Reads from platform-env.yaml (authoritative source). Replaces hardcoded string.
    # Required for ${VAR:?error} enforcement (DevPlan 033 W3-E3 Option A).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform (composite — python + gitleaks + provisioner)
        uses: ./.github/actions/setup-platform
        with:
          python-version: '3.14'
          install-pre-commit: 'true'
          install-gitleaks: 'true'
          run-provisioner: 'true'
          provisioner-scope: 'networks'

      # Pre-commit cache — separate from .venv cache (different key: .pre-commit-config.yaml)
      - name: Export COMPOSE_PROFILES from platform-env.yaml
        uses: ./.github/actions/compose-profiles

      - name: Cache pre-commit venv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks (gitleaks + code quality)
        run: make pre-commit-run
        # V2 (2026-08-05): fast-gate шаг УДАЛЁН — `make gate MODE=fast` дублирует локальный
        # pre-push hook (pre-push-gate.sh, blocking). Локальный pre-push — обязательный шлагбаум:
        # пуш без зелёного fast gate физически не проходит. Полный fast-gate в CI остаётся
        # только в platform-gate-fast.yml (main, REQUIRE_HONESTY_MODE=fail) и platform-test.yml (PR, Docker).

      - name: Cleanup Docker networks
        if: always()
        run: |
          docker network rm proxy-net shared-db-net hermes-agent-net backup-net shared-cache-net observability-net 2>/dev/null || true
