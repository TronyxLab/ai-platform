# GREP_SUMMARY: push-gate full-gate all-branches make-gate-fast gitleaks-composite provisioner ci-compensation D4 ruff-sarif basedpyright-json junit-artifacts DevPlan-163
# STRUCTURE: on:push(branches:'**') → gate(make gate MODE=fast — все ветки) → artifacts(ruff SARIF + basedpyright JSON + junit, if: always) → teardown(docker-network-cleanup)
# region MODULE_CONTRACT
## @purpose — CI-гейт на push в ЛЮБУЮ ветку (включая main): ПОЛНЫЙ `make gate MODE=fast`
##            (gitleaks + pre-commit + gates + static + predeploy). Компенсация гибридного
##            локального pre-push hook'а (DevPlan 160 W6 T6.2 D4): feature-ветки локально
##            гоняют БЫСТРЫЙ чек (pre-commit + ruff + check-diff), полный fast-gate для них
##            гарантирует этот CI-workflow.
## @scope — Runs on every git push to ANY branch (including main); cancelled on new pushes to same branch.
##            main-branch gate + R4-honesty (REQUIRE_HONESTY_MODE=fail) = platform-gate-fast.yml
##            (downstream workflow_run-триггеры остаются на нём — НЕ меняется).
##            PR-валидация (полный gate + Docker/integration) = platform-test.yml.
## @invariants
##   - No Docker compose stacks are started — only Docker networks for provisioner
##   - Pre-commit run includes: gitleaks, check-yaml, trailing-whitespace, end-of-file-fixer
##   - FULL `make gate MODE=fast` step (V3, D4 — CI-компенсация гибридного hook'а)
##   - Timeout: 25 minutes (fast-gate 5-15 мин + холодный pre-commit venv cache + xdist)
##   - Docker networks created via provision-environment.sh (Plan 1 foundation)
##   - Gitleaks uses composite action setup-gitleaks (single source of truth)
##   - Cleanup runs unconditionally — removes Docker networks created by provisioner
## @rationale — DevPlan 160 W6 T6.2 (D4): гибридный pre-push hook — main/release → полный
##   fast-gate локально, feature → быстрый чек. Чтобы feature-ветки не теряли полный гейт,
##   push-gate.yml (V3) выполняет ПОЛНЫЙ `make gate MODE=fast` для ВСЕХ веток (включая main) —
##   это CI-компенсация, а не дубль локального hook'а (локальный hook для feature намеренно
##   быстрый). На main происходит задвоение с platform-gate-fast.yml — принято by design (D4):
##   platform-gate-fast нельзя менять (downstream workflow_run core-deploy/mirror
##   зависят от него, тесты test_gate_ci_trigger_strength/test_gate_ci_coverage).
## @changes — 2026-07-15 | Inline docker network create → provision-environment.sh --scope networks
## @changes — 2026-07-15 | Inline gitleaks install → composite action setup-gitleaks
## @changes — 2026-08-05 | V2 (superposition): removed `make gate MODE=fast` step — точный дубль локального
##   pre-push hook (pre-push-gate.sh, blocking). Остаётся только make pre-commit-run (лёгкая страховка среды).
## @changes — 2026-08-13 | V3 (DevPlan 160 W6 T6.2 D4): ВОЗВРАЩЁН ПОЛНЫЙ `make gate MODE=fast`
##   для ВСЕХ веток (branches: ['**']), timeout 5 → 25 мин. V2-обоснование «дубль устранён»
##   устарело: локальный pre-push hook стал ГИБРИДНЫМ (feature → быстрый чек), поэтому полный
##   CI-гейт обязателен для feature-веток.
## @changes — 2026-08-13 | DevPlan 163 W-A A4: +диагностические артефакты (ruff SARIF,
##   basedpyright --outputjson, pytest junit tests/report-*.xml) — upload-artifact, if: always,
##   НЕ гейты (гейт — шаг make gate MODE=fast). basedpyright exit маскируется (514 errors
##   recommended до W-B «pyright-clean»); ruff не маскируется (clean-at-ship M3).
## @changes — 2026-08-22 | T2.15: блок артефактов извлечён в ./.github/actions/static-artifacts (единый SoT)
## @changes — 2026-08-24 | REF-0012 (meta-refactoring W0): external actions → full commit SHA
##           (checkout, cache).
# endregion MODULE_CONTRACT

name: push-gate

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (make gate MODE=fast — all branches)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    # COMPOSE_PROFILES — exported by compose-profiles composite action (DevPlan 064 S1).
    # Reads from platform-env.yaml (authoritative source). Replaces hardcoded string.
    # Required for ${VAR:?error} enforcement (DevPlan 033 W3-E3 Option A).
    #
    # Test Honesty R4 (DevPlan 117 Brief F + DevPlan 119 A3): CI-раннеры ИМЕЮТ Docker →
    # REQUIRE_HONESTY_MODE=fail (отсутствие сервиса = FAIL, не skip — R4 compliant).
    # Паритет platform-gate-fast.yml.
    env:
      REQUIRE_HONESTY_MODE: fail

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # DevPlan 16 T1.G (P0-4): гейту нужна ПОЛНАЯ git-история — freshness sha-pins
          # использует git log/merge-base; shallow checkout (depth=1) резолвит last-touch
          # в граничный коммит → ложный stale-pin RED на следующем пуше
          fetch-depth: 0

      - name: Setup platform (composite — python + gitleaks + provisioner)
        uses: ./.github/actions/setup-platform
        with:
          python-version: '3.14'
          install-pre-commit: 'true'
          install-gitleaks: 'true'
          run-provisioner: 'true'
          provisioner-scope: 'networks'

      # Pre-commit cache — separate from .venv cache (different key: .pre-commit-config.yaml)
      - name: Export COMPOSE_PROFILES from platform-env.yaml
        uses: ./.github/actions/compose-profiles

      - name: Cache pre-commit venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          # T1.3 (аудит 2026-08-22): +hashFiles(pyproject.toml) — паритет platform-gate-fast/
          # platform-test (класс бага P-14: без него смена pyproject не инвалидирует кэш,
          # pre-commit гоняет протухшие hook-окружения).
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ hashFiles('pyproject.toml') }}

      - name: Run full gate (syntax + JSON + gates + static + predeploy — no Docker)
        run: make gate MODE=fast
        # V3 (2026-08-13, DevPlan 160 W6 T6.2 D4): ПОЛНЫЙ fast-gate для ВСЕХ веток —
        # CI-компенсация гибридного pre-push hook (feature → быстрый локальный чек).
        # V2-комментарий «дубль устранён» переписан: локальный hook больше НЕ всегда
        # гоняет полный gate, поэтому CI обязан его гарантировать.

      # ─── DevPlan 163 W-A A4: диагностические артефакты статики (аддитивно; гейт — шаг выше) ──
      # SARIF/outputjson/junit — артефакты для агента/человека (download-artifact), НЕ гейты.
      # Блокирующее решение — `make gate MODE=fast` (pre-commit ruff-check + gates). Шаги
      # генерируют артефакты ДАЖЕ при падении гейта (if: always) — полезно для дебага.
      # ruff НЕ маскируется (0 violations — жёсткий инвариант clean-at-ship M3, DevPlan 163);
      # basedpyright exit маскируется shell'ом: до W-B «pyright-clean» recommended даёт 514
      # ошибок (fact-base §1) — сигнал здесь НЕ exit-код, а сам JSON-артефакт (гейт-статус
      # basedpyright в pre-commit stages: [manual]; блокировка — после handoff W-B).
      # T2.15: генерация + upload извлечены в composite action (единый SoT обеих копий).
      - name: Collect static artifacts (ruff SARIF + basedpyright JSON + junit)
        if: always()
        uses: ./.github/actions/static-artifacts

      - name: Cleanup Docker networks
        if: always()
        run: |
          docker network rm proxy-net shared-db-net hermes-agent-net backup-net shared-cache-net observability-net 2>/dev/null || true

      # ─── Failure notification (DevPlan 003 A1) ─────────────────────────
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id-critical: ${{ secrets.TELEGRAM_CHAT_ID_CRITICAL }}
          chat-id-warning: ${{ secrets.TELEGRAM_CHAT_ID_WARNING }}
          severity: critical
          context: push-gate
          event: ci.failure
          message: "push-gate FAILED (branch ${{ github.ref_name }}, run ${{ github.run_id }})"
          link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          action: "Investigate the failed gate and fix forward"
