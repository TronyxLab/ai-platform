# GREP_SUMMARY: stage-deploy staging-ci workflow_dispatch appleboy ssh staging-smoke healthcheck ci-deploy
# STRUCTURE: workflow_dispatch(project,image_tag,ssh_host) → deploy-staging(appleboy/ssh-action) → smoke-staging(curl health)
# region MODULE_CONTRACT
## @purpose  Standalone CI workflow for staging deployment: SSH deploy via appleboy + smoke test health check
## @scope    Triggered manually (workflow_dispatch) or reused via workflow_call; no build step — expects pre-built image_tag
## @invariants
##   - ssh_host is provided as input (not resolved from node-configs — caller is responsible)
##   - appleboy/ssh-action uses ci-deploy user; authorized_keys on node forces platform-deploy.sh (00 §4, AR09)
##   - ci-deploy has NO shell; forced-command ignores client-provided script (security: single whitelisted command)
##   - Smoke test is NON-FATAL — deployment succeeds even if health check fails (WARN logged)
##   - Secrets: CI_DEPLOY_KEY (SSH private key), DOCKER_HUB_USERNAME, DOCKER_HUB_TOKEN
## @rationale
##   Separate staging workflow (not mixed into platform-deploy.yml) for:
##   (1) manual staging deploy from any branch/ref without triggering production,
##   (2) external consumers who want staging-only pipeline without the full reusable workflow.
##   smoke-staging as separate job (not a step) allows parallel execution in future and
##   independent timeout (5min) without blocking deploy.
##   Non-fatal smoke test: staging may have transient health blips; don't block the deploy pipeline.
##
## 🧐 TRAP[DECISION] · 2026-07-03 · — · staging_url as optional input for smoke test
## ·   Rejected: hardcoded URL or SSH-based URL construction only
## ·   Reason: different projects expose health at different paths/ports;
## ·   caller knows the correct URL, workflow should not guess or hardcode
## ·   Rev: if all projects standardize on /health at root, make default: http://{ssh_host}/health
# endregion MODULE_CONTRACT

name: Stage Deploy

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project name (from ai-platform.yaml .name)'
        required: true
        type: string
      project_yaml_path:
        description: 'Path to ai-platform.yaml relative to repo root'
        required: false
        default: 'ai-platform.yaml'
        type: string
      image_tag:
        description: 'Docker image tag (sha commit)'
        required: true
        type: string
      ssh_host:
        description: 'SSH host for target node (IP or FQDN)'
        required: true
        type: string
      staging_url:
        description: 'Staging service URL for health check (defaults to http://{ssh_host})'
        required: false
        type: string
  workflow_call:
    inputs:
      project_name:
        description: 'Project name'
        required: true
        type: string
      project_yaml_path:
        description: 'Path to ai-platform.yaml'
        required: false
        default: 'ai-platform.yaml'
        type: string
      image_tag:
        description: 'Docker image tag (sha)'
        required: true
        type: string
      ssh_host:
        description: 'SSH host for target node'
        required: true
        type: string
      staging_url:
        description: 'Staging service URL for health check'
        required: false
        type: string

concurrency:
  group: stage-deploy-${{ inputs.ssh_host }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Permissions audit 2026-07-07 (C2): All jobs inherit repo-default (read).
  # GITHUB_TOKEN is NOT used by any step — SSH key provides deploy access.
  # No explicit permissions block needed — repo-default is already read-only.

  # ─── Job: Deploy to staging via SSH forced-command ─────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup platform (composite — python only)
        uses: ./.github/actions/setup-platform
        with:
          # python-version intentionally left '' — thin SSH wrapper: no local Python
          # execution (SSH forced-command + curl smoke test only). Pinning would create
          # a .venv + install test deps for zero benefit. Step is effectively a no-op.
          python-version: ''
          install-gitleaks: 'false'
          run-provisioner: 'false'

      # ═══════════════════════════════════════════════════════════════════
      # DevPlan 065 P1+P3+P5: setup-ssh composite action — единый source of truth
      # ═══════════════════════════════════════════════════════════════════
      - name: Setup SSH for staging
        uses: ./.github/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}
          ssh-host: ${{ inputs.ssh_host }}
          ssh-user: ci-deploy

      # [IMP:9][stage-deploy][staging-env] Inform platform-deploy.sh that this is a staging deploy
      - name: Set STAGING env var
        run: echo "STAGING=true" >> $GITHUB_ENV

      # [IMP:9][stage-deploy][ssh] SSH forced-command: authorized_keys runs platform-deploy.sh regardless of script content
      - name: Deploy via SSH to staging
        run: |
          ssh -o ConnectTimeout=10 ci-deploy@${{ inputs.ssh_host }} \
            "${{ inputs.project_name }} ${{ inputs.image_tag }} staging"

  # ─── Job: Smoke test — verify staging health endpoint ─────────────────────
  smoke-staging:
    name: Smoke test — staging health
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 5
    steps:
      - name: Check health endpoint
        env:
          STAGING_URL: ${{ inputs.staging_url }}
          SSH_HOST: ${{ inputs.ssh_host }}
        run: |
          # [IMP:8][stage-deploy][smoke] Non-fatal health check — log warning on failure, do not block pipeline
          URL="${STAGING_URL:-http://${SSH_HOST}}"
          echo "--- Checking staging health at: ${URL}/health ---"
          curl --fail --retry 3 --retry-delay 5 --max-time 10 "${URL}/health" || echo "[WARN] Staging health check failed — non-fatal smoke test"
          echo "[IMP:9][stage-deploy][health] Staging health check PASSED"
