  signature: make fix-executable-bit [DRY_RUN=1]
  operation_ru: Исправление executable bit на .sh файлах
  description: 'Sets +x on staged/tracked .sh files outside core/lib/. Two-pass: staged
    via git add --chmod=+x, tracked via git update-index --chmod=+x (xargs -0). Safe,
    idempotent, DRY_RUN=1.'
  repairs_gates:
  - gate_id: test_executable_bit_outside_lib
    repair_id: executable-bit
    repair_command: make fix-gate
    repair_description: Sets executable bit (+x) on all .sh files outside core/lib/
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: fix-ruff
  visibility: internal
  mechanism: ruff
  delegates_to: ruff check --fix + ruff format
  signature: make fix-ruff [SCOPE=diff|staged|all] [DRY_RUN=1]
  operation_ru: Форматирование Python файлов через ruff
  description: 'Ruff check --fix + format for changed Python files. SCOPE=diff (default):
    staged + unstaged. Safe, idempotent, DRY_RUN=1.'
  repairs_gates:
  - gate_id: ruff-format
    gate_kind: make-target-gate
    repair_id: ruff-format
    repair_command: make fix-ruff
    repair_description: Formats changed Python files with ruff (check --fix + format)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: fix-pycache
  visibility: public
  mechanism: shell-cleanup
  delegates_to: find core tests -type d -name __pycache__ -exec rm -rf (build-каталоги исключены)
  signature: make fix-pycache [DRY_RUN=1]
  operation_ru: Очистка __pycache__ рабочего дерева
  description: 'Removes __pycache__ directories from core/ and tests/ working tree
    (DevPlan 172 W1.5). Build-payload .pyc inside tracked build/ dirs untouched. Safe,
    idempotent, DRY_RUN=1.'
- make_target: fix-gate
  visibility: public
  mechanism: composite
  delegates_to: fix-executable-bit + fix-ruff + fix-pycache + generate-manifests
  signature: make fix-gate [DRY_RUN=1]
  operation_ru: Композитное исправление gate-ошибок
  description: Composite target — runs fix-executable-bit + fix-ruff + fix-pycache + generate-manifests.
    ONLY gate-blocking L1 errors. Not expandable without review.
  repairs_gates:
  - gate_id: check-manifests
    gate_kind: make-target-gate
    repair_id: manifest-sync
    repair_command: make fix-gate
    repair_description: Regenerates all derived manifests (secrets-manifest.yaml,
      platform-env.yaml, etc.)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_sot_matches_discovered_modules
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml + .env.example from SoT (COMPOSE_PROFILES)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_generated_files_match_sot
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml + .env.example from SoT (COMPOSE_PROFILES)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_make_get_all_profiles_matches_sot
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml from SoT (COMPOSE_PROFILES)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_no_hardcoded_profiles_outside_allowlist
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Replaces hardcoded COMPOSE_PROFILES copies with runtime-read
      (yaml_query)
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_platform_domain_single_sot
    repair_id: domain-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml + .env.example from SoT (PLATFORM_DOMAIN)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_no_test_local_in_production_chain
    repair_id: domain-parity
    repair_command: make generate-manifests
    repair_description: Regenerates generated files (тестовые домен-артефакты удалены
      из SoT)
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_env_defaults_generated_has_no_domain
    repair_id: domain-parity
    repair_command: make generate-manifests
    repair_description: Regenerates env_defaults_generated.py (PLATFORM_DOMAIN не
      секрет)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: check
  visibility: public
  mechanism: python-script
  delegates_to: python3 -m core.internal.check_suite run (SoT core/check-suite.yaml)
  signature: make check [WORKERS=6] [JSON=1] [SKIP_FIX=1] [VERBOSE=1] [CHECK_CACHE=0]
    [MARKER=<suite>] [TEST_FILE=<path>]
  operation_ru: Диагностика — все проверки из core/check-suite.yaml
  description: 'Диагностический executor на SoT-манифесте (DevPlan 120): fix-фаза
    → fingerprint-кэш (replay зелёного прогона) → static параллельно + pytest последовательно
    с xdist → единый отчёт. НЕ заменяет gate — канонический арбитр. DevPlan 165: ЕДИНАЯ
    тестовая команда агента — MARKER=<suite> (один чек по id, включая diagnostic:false
    как integration) и TEST_FILE=<path> (один файл, compact); каждый прогон пишется
    в журнал .ai/logs/runs.jsonl.'
- make_target: check-diff
  visibility: public
  mechanism: python-script
  delegates_to: python3 -m core.internal.check_suite run --mode diff
  signature: make check-diff
  operation_ru: Узкая диагностика по изменённым файлам
  description: 'Diff-скоуп (DevPlan 120 §3.5): pre-commit --files + ruff по diff +
    pytest изменённых test-файлов; без кэша; пустой diff → exit 0.'
- make_target: templates-check
  visibility: internal
  mechanism: template-engine
  delegates_to: core/internal/template_engine.py check (template-manifest coverage)
  signature: make templates-check
  operation_ru: Проверка покрытия и разрешимости шаблонов
  description: 'Verifies all templates in template-manifest resolve. Repair: register
    missing templates in core/templates/template-manifest.yaml.'
  repairs_gates:
  - gate_id: test_all_template_files_registered
    repair_id: template-coverage
    repair_command: make templates-check
    repair_description: Register missing *.template files in core/templates/template-manifest.yaml
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_nginx_template_volume_sources_registered
    repair_id: template-coverage
    repair_command: make templates-check
    repair_description: Register nginx /etc/nginx/templates volume sources in template-manifest
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
lifecycle:
- make_target: converge
  visibility: public
  mechanism: ssh+script
  delegates_to: core/entrypoints/converge.sh → core/internal/bootstrap/converge.sh
  signature: make converge NODE=<name>
  operation_ru: Реконсиляция ноды
  description: Idempotent reconcile with 9 R-units (R1-R9) and --units filter — конвергирует
    ноду с desired state из node.yaml; standalone или из node-lifecycle
- make_target: check-security
  visibility: public
  mechanism: ssh+script
  delegates_to: core/entrypoints/check-security.sh → core/internal/bootstrap/check_security_cli.py
    → remote_executor.py execute-check-security → core/internal/bootstrap/security_posture.py
    (S1-S9, DevPlan 134 L2 + 136 W10)
  signature: make check-security NODE=<name>
  operation_ru: Проверка security-постурa ноды
  description: Security posture check (S1-S9) — unattended-upgrades активность, pending
    security-апдейты, ufw, sshd -T (13 директив + MaxStartups), docker live-restore/iptables/
    API-порты, world-writable файлы и права секретов (вкл. критичные пути), forced-command
    целостность ci-deploy ключа (per-line + perms), image freshness (digest drift),
    real-LISTEN docker-proxy (внутренние порты ≠ 0.0.0.0). Exit — 0=healthy 1=warnings
    2=errors
- make_target: healthcheck
  visibility: public
  mechanism: shell-script
  delegates_to: core/entrypoints/healthcheck.sh → core/internal/healthcheck/modules_healthcheck.py
    → Module healthcheck.sh scripts (via shared/module_interface)
  signature: make healthcheck [NODE=...]
  operation_ru: Проверка здоровья
  description: Health check of platform (local compose or remote node via SSH)
- make_target: up
  visibility: public
  mechanism: preflight + provisioner + docker-compose
  delegates_to: core/internal/bootstrap/deploy/compose_preflight.py → core/internal/provision-environment.sh
    → docker compose up (MODULES filter)
  signature: make up [MODULES=<comma-list>] [SKIP_PREFLIGHT=1]
  operation_ru: Запуск compose-стека
  description: Preflight secret validation (compose_preflight.py, SKIP_PREFLIGHT=1 —
    обход) → provision environment (networks, volumes, CI env) from platform-env.yaml
    → start local compose lifecycle. MODULES — фильтр profile'ов (без аргумента —
    все). План 175 W4.2 — up-safe слит в up.
- make_target: down
  visibility: public
  mechanism: docker-compose
  delegates_to: docker compose down
  signature: make down
  operation_ru: Остановка compose-стека
  description: Stop local compose lifecycle (data preserved — volumes remain). Destructive
    teardown — make down-volumes
- make_target: down-volumes
  visibility: public
  mechanism: docker-compose
  delegates_to: docker compose down -v
  signature: make down-volumes
  operation_ru: Остановка compose-стека и удаление volumes
  description: Stop and remove compose volumes (destructive — data loss)
- make_target: restart
  visibility: public
  mechanism: docker-compose
  delegates_to: docker compose stop && docker compose start
  signature: make restart
  operation_ru: Мягкий перезапуск compose-стека
  description: Soft restart local compose services (stop + start)
- make_target: status
  visibility: public
  mechanism: docker-compose
  delegates_to: docker compose ps
  signature: make status
  operation_ru: Статус compose-стека
  description: Show status of local compose services
- make_target: backup
  visibility: public
  mechanism: shell-script
  delegates_to: backup-cron module make backup
  signature: make backup
  operation_ru: Резервное копирование
  description: Run backup for platform services. Stateful-модули (postgres, backup-cron,
    hermes-agent); остальные модули НЕ объявляют backup/restore (контракт сужен, DevPlan
    116 D1)
- make_target: restore
  visibility: public
  mechanism: shell-script
  delegates_to: backup-cron module make restore DUMP_FILE=<path>
  signature: make restore DUMP_FILE=<path>
  operation_ru: Восстановление из бэкапа
  description: Restore from backup. Stateful-модули (postgres, backup-cron, hermes-agent);
    остальные модули НЕ объявляют backup/restore (контракт сужен, DevPlan 116 D1).
    DUMP_FILE обязателен — без него exit 1 «DUMP_FILE not set»
- make_target: node-update
  visibility: public
  mechanism: ssh+rsync
  delegates_to: core/entrypoints/node-update.sh → core/internal/bootstrap/node-lifecycle.sh
    --mode update → core/internal/bootstrap/lifecycle/cli.py → core/internal/bootstrap/lifecycle/state_machine.py
    (B9 state machine — UPDATE mode — 5 фаз — φ9 secrets_update · φ10 node_config_update
    · φ11 registry_update → provision · llm-keys · healthcheck · φ12 deploy_update
    → core/internal/bootstrap/issue_cert.py → core/internal/bootstrap/deploy-modules.sh
    · φ13 converge_update)
  signature: make node-update NODE=<name>
  operation_ru: Обновление provisioned ноды
  description: Regular CI update of an already-provisioned node (not INIT)
- make_target: verify-domains
  visibility: public
  mechanism: shell-script
  delegates_to: core/entrypoints/verify.sh → core/internal/verify/domain_verifier.py
  signature: make verify-domains NODE=<node> [PROJECT=<name>]
  operation_ru: HTTPS-верификация доменов
  description: Post-deploy HTTPS verification — curl expose:true domains from node.yaml,
    exit 0 if all HTTP 200; PROJECT=<name> (DevPlan 125 T1, P-22) — verify per-project
    (только домен деплоящегося проекта). Переименован из verify (План 175 W4.3);
    отличен от e2e-verify (sweep endpoints) и от VPS-verb verify (forced-command).
provision:
- make_target: provision
  visibility: public
  mechanism: shell-script
  delegates_to: core/internal/provision-environment.sh → core/internal/provisioner.py
  signature: make provision [SCOPE=...]
  operation_ru: Provision окружения
  description: Idempotent environment provisioner — reads platform-env.yaml and creates
    Docker networks, volume directories, and CI env vars
- make_target: provision-llm
  visibility: public
  mechanism: shell-facade
  delegates_to: core/entrypoints/provision-llm.sh → core/internal/llm/key_provisioner.py
  signature: make provision-llm
  operation_ru: Provision LiteLLM virtual keys
  description: 'Provision LiteLLM virtual keys for all LLM consumers (projects + platform
    services) from policy.yaml profiles. Idempotent: existing keys with matching config
    are skipped.'
dev:
- make_target: discover-modules
  visibility: internal
  mechanism: python-script
  delegates_to: core/internal/bootstrap/discover_modules.py
  signature: make discover-modules
  operation_ru: Авто-обнаружение модулей
  description: Auto-discover modules and regenerate docker-compose.yml include section
- make_target: dev-certs
  visibility: public
  mechanism: python-script
  delegates_to: core/modules/nginx/dev_cert_generator.py
  signature: make dev-certs [CERT_BACKEND=...]
  operation_ru: Генерация dev SSL-сертификатов
  description: Idempotent generation of self-signed dev SSL certificates for nginx
    (hybrid mkcert→openssl)
- make_target: dev-metrics
  visibility: public
  mechanism: python-script
  delegates_to: core/internal/healthcheck/platform_export_metrics.py + core/internal/bootstrap/lifecycle/secrets_manager.py
    (htpasswd CLI)
  signature: make dev-metrics
  operation_ru: Генерация dev status-metrics.json + htpasswd
  description: Dev-локали без нодового cron metrics — генерирует status-metrics.json
    (тот же экспортёр, что cron на ноде) + .htpasswd-platform (secrets_manager htpasswd)
    из .env-путей (STATUS_METRICS_JSON/HTPASSWD_FILE). Идемпотентен (D-12, DevPlan
    130 W1).
- make_target: dev-hosts
  visibility: public
  mechanism: python-script
  delegates_to: core/internal/dev_hosts.py
  signature: make dev-hosts [APPLY=1]
  operation_ru: Управление /etc/hosts dev-блоком
  description: Идемпотентное управление /etc/hosts для локальной dev-схемы (DevPlan
    136 W4) — server_names vhost_renderer (dev-mode <project>.<suffix>) + base-домены
    из SAN dev-сертификатов в маркер-блоке BEGIN/END ai-platform dev-hosts. Default
    --dry-run (exit 1 при diff), APPLY=1 → --apply (sudo, атомарно tmp+mv). Чужие
    строки /etc/hosts не трогаются.
- make_target: render-monitoring
  visibility: public
  mechanism: python-script
  delegates_to: python3 core/internal/monitoring/config_renderer.py
  signature: make render-monitoring PROJECT_DIR=<dir> PROJECT=<name> [NODE=<node>]
  operation_ru: Рендер конфигурации мониторинга после деплоя проекта
  description: 'Post-deploy monitoring reconfiguration (Prometheus targets, Grafana
    dashboards, Loki retention, Langfuse projects, alert rules). Registered make-target
    (U-65, DevPlan 116 B7 T7). Волна 118 B8: module-hook on-project-deploy.sh удалён
    — runtime-путь = make render-monitoring (operator) + DeployOrchestrator deploy-hooks.'
- make_target: age-key-backup
  visibility: public
  mechanism: python-module
  delegates_to: python3 -m core.internal.deploy.age_key_backup (node_detect AGE-ключ
    → sops encrypt --age AGE_RECIPIENT → S3 private ACL → sha256 verify; секция «DR
    мастер-ключа AGE» core/AGENTS.md)
  signature: make age-key-backup [AGE_RECIPIENT=<pubkey>] [DRY_RUN=1|NO_UPLOAD=1|OUTPUT_ENC=<path>|S3_KEY=<key>]
  operation_ru: Off-node encrypted backup AGE мастер-ключа (DR, секция «DR мастер-ключа
    AGE» core/AGENTS.md)
  description: 'Автоматизация DR-процедуры (DevPlan 147 W2, S-13): локальный ключ
    по env-цепочке node_detect → sops encrypt для age-реципиента → выгрузка в приватный
    S3 bucket (ACL private) → sha256-сверка загруженного с локальным. --dry-run =
    0 мутаций; 0 секретов в stdout/stderr (маскирование ключа, паттерн node_detect).'
module_hooks:
- script: nginx_reload_hook.sh
  path: core/modules/nginx/nginx_reload_hook.sh
  signature: (module hook)
  operation_ru: Reload nginx после деплоя
  description: Nginx config validation and reload after project deploy — called via
    module.yaml hooks.on_project_deploy
