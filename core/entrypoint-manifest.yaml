lib:
- script: ssh.sh
  path: core/lib/ssh.sh
  signature: (sourced library)
  operation_ru: SSH facade with timeout
  type: sourced
  consumers:
  - core/internal/bootstrap/scp-deliver.sh
  - core/internal/bootstrap/remote-cmd.sh
  - core/internal/scaffold/remove-project.sh
  - core/internal/scaffold/project-list.sh
  - core/lib/vps-readiness.sh
  - core/internal/deploy/reconcile-projects.sh
  description: SSH facade with timeout wrapper — single source of truth for all remote
    operations (W2-E1)
- script: audit_logging.sh
  path: core/lib/audit_logging.sh
  signature: (sourced library)
  operation_ru: Audit logging library
  type: sourced
  consumers:
  - core/internal/deploy/deploy-project.sh
  - core/entrypoints/context-promote.sh
  - core/internal/scaffold/remove-project.sh
  - core/internal/provision-environment.sh
  - core/entrypoints/build.sh
  - core/internal/secrets/decrypt-secrets.sh
  - core/internal/bootstrap/node-lifecycle.sh (update-mode)
  description: Audit logging + audit_step wrapper — dual-write audit trail for state-modifying
    entrypoints (W2-E3)
