# core/entrypoint-manifest.yaml
# GREP_SUMMARY: entrypoint-manifest, yaml, canonical-targets, operations-registry, forbidden
# STRUCTURE: ┌Makefile targets┐ → ◇ map target→script→delegation → ⊕ CI gates verify parity with AGENTS.md triad
# region MODULE_CONTRACT
## @purpose  Canonical operations registry consumed by CI gates (no-unregistered-entrypoint, manifest-integrity).
## @scope    Lists all canonical make targets, CI gates, forbidden scripts/directories/verbs, and allowed_verbs dictionary
## @invariants
##   - Every Makefile .PHONY target must have a corresponding entry in this manifest
##   - Every entry here must have a corresponding entry in core/AGENTS.md
##   - allowed_verbs list must match Makefile canonical targets
##   - Forbidden lists are explicit deny — no additions without Architect approval
## @rationale Machine-readable registry enables CI gates to validate the Makefile/AGENTS.md/filesystem triad
# endregion MODULE_CONTRACT

bootstrap:
- make_target: bootstrap-node
  mechanism: ssh+rsync
  delegates_to: core/entrypoints/bootstrap.sh → core/internal/bootstrap/preflight.py
    → core/internal/bootstrap/node-lifecycle.sh --mode init → core/internal/bootstrap/docker_registry_auth.py
    + core/internal/bootstrap/firewall.sh + core/internal/bootstrap/install-docker.sh
    + core/internal/bootstrap/install-tor-proxy.sh + core/internal/bootstrap/setup-node.sh
    + core/internal/bootstrap/install-acme.sh + core/internal/bootstrap/secrets-init.sh
    + core/internal/bootstrap/deploy-modules.sh + core/internal/bootstrap/cert_orchestrator.py
    + core/internal/bootstrap/deploy/context_deployer.py
  signature: make bootstrap-node NODE=<name>
  operation_ru: Идемпотентный bootstrap ноды
  description: Idempotent bootstrap of a new node to FULL readiness (infra + context
    projects + certs + Docker Hub auth) (DevPlan 047)
- make_target: deploy-context
  mechanism: ssh+python
  delegates_to: core/entrypoints/deploy-context.sh → core/internal/bootstrap/deploy/context_deployer.py
  signature: make deploy-context NODE=<n> [CONTEXT=<ctx>]
  operation_ru: Деплой проектов контекста на ноде
  description: 'Deploy all projects of a context on a bootstrapped node (standalone
    or post-bootstrap). Idempotent: ghcr.io pull primary, build-on-node fallback (DevPlan
    047)'
deploy:
- make_target: deploy
  mechanism: git-push
  delegates_to: git push → CI → core/entrypoints/deploy.sh (VPS forced-command) →
    core/internal/deploy/deploy-project.sh → core/internal/notify/notify-hook.sh +
    core/internal/catalog/generate-catalog.sh
  signature: make deploy PROJECT=<dir>
  operation_ru: Деплой проекта
  description: Deploy a project via git push → CI → SSH forced-command on VPS
- make_target: deploy-project
  mechanism: ssh+tar
  delegates_to: core/entrypoints/deploy-project.sh → ssh platform-deliver + ssh deploy.sh
    → core/internal/deploy/deploy-project.sh
  signature: make deploy-project PROJECT=<dir> NODE=<node>
  operation_ru: Прямой деплой минуя CI
  description: Direct project deploy bypassing CI (emergency fallback) — tar+ssh deliver,
    deploy with DEPLOY-DIRECT audit, optional post-deploy verify
- make_target: context-promote
  mechanism: git-push-context
  delegates_to: core/entrypoints/context-promote.sh → copy to <context>/ai-platform
    → CI
  signature: make context-promote CONTEXT=<context>
  operation_ru: Промоут платформы в контекст
  description: Promote platform to a context org (copy + CI + auto-deploy)
build:
- make_target: hermes-build-platform
  mechanism: docker-build
  delegates_to: core/entrypoints/build.sh → core/internal/build/hermes-images.sh build-platform
  signature: make hermes-build-platform
  operation_ru: Сборка L1 образа
  description: Build L1 (hermes-agent-base) locally + push to ghcr.io as backup
- make_target: hermes-build-context
  mechanism: docker-build
  delegates_to: core/entrypoints/build.sh → core/internal/build/hermes-images.sh build-context
  signature: make hermes-build-context CONTEXT=<context>
  operation_ru: Сборка L1→L2 образа
  description: Build L1→L2 (hermes-agent-context), optionally push to GHCR
- make_target: hermes-push-l1
  mechanism: docker-push
  delegates_to: docker tag + docker push to ghcr.io
  signature: make hermes-push-l1
  operation_ru: Push L1 в ghcr.io
  description: Push L1 (hermes-agent-base) to ghcr.io as disaster recovery backup
