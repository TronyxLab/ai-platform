# Сценарии двухролевого help (План 175 W1.4): public-глаголы, сгруппированные для человека.
# MANUAL-секция (генератор манифеста сохраняет verbatim); читается generate_help.py.
# Инвариант: каждый public-глагол ровно в одном сценарии; internal-глаголы — вне сценариев.
scenarios:
  stack: [up, down, down-volumes, restart, status, healthcheck, backup, restore]
  deploy: [deploy, deploy-project, deploy-context, context-promote, core-deliver]
  project: [new-project, new-context, adopt-project, remove-project, project-list, project-status, project-check, project-sync-env, project-sync-practices, project-set-practices]
