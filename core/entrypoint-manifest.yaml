test:
- make_target: test-node
  visibility: public
  mechanism: pytest
  delegates_to: pytest tests/e2e/ -m requires_node
  signature: make test-node NODE=<name>
  operation_ru: E2E pipeline тесты на test-VPS
  description: Run E2E bootstrap pipeline tests against a recreatable test-VPS (requires_node
    marker, NODE env, SSH, Docker). NOT in make check or make gate. DevPlan 095.
- make_target: e2e-verify
  visibility: public
  mechanism: python-module
  delegates_to: python3 -m core.internal.verify_sweep sweep
  signature: make e2e-verify NODE=<name> [MODE=local|remote] [JSON=1]
  operation_ru: HTTP+TLS sweep-верификация всех endpoints ноды
  description: 'Endpoint sweep verification (DevPlan 136 W5) — collect endpoints (local
    node.yaml projects + overlays/nginx server_names | remote ssh nginx conf.d), sweep
    each with check_http (expected_codes by-design: 200/301/302/401/403/404/444 pass,
    502/504/5xx fail) and check_tls (openssl s_client — chain, wildcard SAN, expiry
    WARN<14d/FAIL). Exit 0 = «всё зелёное» scriptable acceptance. NOT in make check
    or make gate — requires a live node (R4: no node/SSH → FAIL, not skip).'
