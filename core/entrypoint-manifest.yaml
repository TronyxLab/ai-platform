  signature: make project-status NAME=<name>
  operation_ru: Статус проекта
  description: Query live status of project(s) on target node via SSH
- make_target: render-vhosts
  mechanism: shell-script
  delegates_to: core/internal/scaffold/add-vhost.sh --render-all --node <n>
  signature: make render-vhosts NODE=<name>
  operation_ru: Генерация vhost конфигов
  description: Regenerate Nginx vhost configs from node.yaml#projects with domain
    (GENERATED, S1)
secrets:
- make_target: secrets-unlock
  mechanism: shell-script
  delegates_to: core/entrypoints/secrets.sh → core/internal/secrets/decrypt-secrets.sh
  signature: make secrets-unlock [NODE=...]
  operation_ru: Расшифровка секретов
  description: Decrypt SOPS/age secrets (local or remote node)
test/gate:
- make_target: gate
  mechanism: pytest+lint
  delegates_to: make gate [MODE=fast|full]
  signature: make gate [MODE=fast|full]
  operation_ru: Production gate
  description: 'Production gate. MODE=full (default): lint+validate+gates+static+predeploy+smoke+component.
    MODE=fast: syntax+JSON+gates+static+predeploy (no Docker).'
- make_target: check-manifests
  mechanism: python-check
  delegates_to: --check for all 6 generators (G1-G6) — byte-level comparison
  signature: make check-manifests
  operation_ru: Проверка актуальности сгенерированных манифестов
  description: Freshness gate — all generated manifests are in sync with authoritative
    sources. Uses --check of all 6 generators (byte-level, parallel in CI).
- make_target: generate-manifests
  mechanism: python-script
  delegates_to: make generate-manifests
  signature: make generate-manifests
  operation_ru: Генерация всех манифестов
  description: Generate secrets-manifest.yaml, platform-env.yaml, entrypoint-manifest.yaml,
    smoke_env_generated.py, env_defaults_generated.py.
- make_target: generate-secrets-manifest
  mechanism: python-script
  delegates_to: python3 core/internal/scripts/generate_secrets_manifest.py
  signature: make generate-secrets-manifest
  operation_ru: Генерация secrets-manifest.yaml
  description: Generate secrets-manifest.yaml from secret-definitions.yaml + module.yaml
    consumers.
- make_target: generate-platform-env
  mechanism: python-script
  delegates_to: python3 core/internal/scripts/generate_platform_env.py
  signature: make generate-platform-env
  operation_ru: Генерация platform-env.yaml + Python env files
  description: Generate platform-env.yaml, smoke_env_generated.py, env_defaults_generated.py
    from infra + modules + secrets.
- make_target: generate-env-example
  mechanism: python-script
  delegates_to: python3 core/internal/scripts/sync_env_defaults.py → .env.example
  signature: make generate-env-example
  operation_ru: Генерация .env.example
  description: Generate .env.example from platform-env.yaml via sync_env_defaults.py.
- make_target: generate-entrypoint-manifest
  mechanism: python-script
  delegates_to: python3 core/internal/scripts/generate_entrypoint_manifest.py
  signature: make generate-entrypoint-manifest
  operation_ru: Генерация entrypoint-manifest.yaml
  description: Generate entrypoint-manifest.yaml from Makefile .PHONY targets + existing
    manifest.
- make_target: generate-agents-md
  mechanism: python-script
  delegates_to: python3 core/internal/scripts/generate_agents_md.py → core/AGENTS.md
  signature: make generate-agents-md
  operation_ru: Генерация core/AGENTS.md
  description: Generate canonical operations table in core/AGENTS.md from manifest.
- make_target: generate-litellm-config
  mechanism: python-script
  delegates_to: python3 core/internal/llm/config_renderer.py → litellm-config.yml
  signature: make generate-litellm-config
  operation_ru: Генерация litellm-config.yml
  description: Generate LiteLLM config from policy.yaml via config_renderer.py.
- make_target: generate-manifests-atomic
  mechanism: python-script
  delegates_to: mktemp → Chain A+B+C → mv
  signature: make generate-manifests-atomic
  operation_ru: Атомарная генерация всех манифестов
  description: Atomic generation of ALL manifests via staging dir + atomic rename.
- make_target: sync-env-defaults
  mechanism: python-script
  delegates_to: core/internal/scripts/sync_env_defaults.py → .env.example
  signature: make sync-env-defaults
  operation_ru: Генерация .env.example из SoT
  description: Generate .env.example from platform-env.yaml + secret-definitions.yaml.
    Single SoT → auto-generated .env.example — never edit manually.
- make_target: check-env-defaults
  mechanism: python-script
  delegates_to: core/internal/scripts/sync_env_defaults.py --check
  signature: make check-env-defaults
  operation_ru: Проверка актуальности .env.example
  description: 'Drift gate — fail if .env.example diverges from SoT. Repair: make
    sync-env-defaults.'
- script: pre-push-gate.sh
  mechanism: pre-push-hook
  delegates_to: core/entrypoints/pre-push-gate.sh
  signature: (pre-push hook)
  operation_ru: Pre-push gate
  description: Blocking pre-push gate that runs make gate MODE=fast
repair:
- make_target: fix-executable-bit
  mechanism: git-update-index
  delegates_to: git add --chmod=+x + git update-index --chmod=+x
  signature: make fix-executable-bit [DRY_RUN=1]
  operation_ru: Исправление executable bit на .sh файлах
  description: 'Sets +x on staged/tracked .sh files outside core/lib/. Two-pass: staged
    via git add --chmod=+x, tracked via git update-index --chmod=+x (xargs -0). Safe,
    idempotent, DRY_RUN=1.'
  repairs_gates:
  - gate_id: test_executable_bit_outside_lib
    repair_id: executable-bit
    repair_command: make fix-gate
    repair_description: Sets executable bit (+x) on all .sh files outside core/lib/
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: fix-ruff
  mechanism: ruff
  delegates_to: ruff check --fix + ruff format
  signature: make fix-ruff [SCOPE=diff|staged|all] [DRY_RUN=1]
  operation_ru: Форматирование Python файлов через ruff
  description: 'Ruff check --fix + format for changed Python files. SCOPE=diff (default):
    staged + unstaged. Safe, idempotent, DRY_RUN=1.'
  repairs_gates:
  - gate_id: ruff-format
    gate_kind: make-target-gate
    repair_id: ruff-format
    repair_command: make fix-ruff
    repair_description: Formats changed Python files with ruff (check --fix + format)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: fix-gate
  mechanism: composite
  delegates_to: fix-executable-bit + fix-ruff + generate-manifests
  signature: make fix-gate [DRY_RUN=1]
  operation_ru: Композитное исправление gate-ошибок
  description: Composite target — runs fix-executable-bit + fix-ruff + generate-manifests.
    ONLY gate-blocking L1 errors. Not expandable without review.
  repairs_gates:
  - gate_id: check-manifests
    gate_kind: make-target-gate
    repair_id: manifest-sync
    repair_command: make fix-gate
    repair_description: Regenerates all derived manifests (secrets-manifest.yaml,
      platform-env.yaml, etc.)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: preflight
  mechanism: python-script
  delegates_to: python3 -m core.internal.preflight [--skip-fix] [--json] [--workers
    N]
  signature: make preflight [WORKERS=6] [JSON=1] [SKIP_FIX=1] [VERBOSE=1]
  operation_ru: Параллельный preflight (сбор всех ошибок gate за один проход)
  description: 'Agent-oriented preflight — run ALL gate checks in parallel (Phase
    1: fix-gate, Phase 2: pre-commit, Phase 3: 8 checks parallel). Eliminates iterative
    fix→gate→fix→gate cycle. Does NOT replace gate — gate remains authoritative.'
- make_target: check-profiles-parity
  mechanism: pytest-gate
  delegates_to: pytest tests/gates/test_gate_profiles_parity.py (COMPOSE_PROFILES
    SoT parity, DevPlan 116 T9)
  signature: make check-profiles-parity
  operation_ru: Parity-гейт COMPOSE_PROFILES (единый SoT platform-infra.yaml)
  description: 'Verifies SoT == discovered modules, generated parity, make _get_all_profiles,
    and zero hardcoded copies outside allowlist. Repair: regenerate manifests.'
  repairs_gates:
  - gate_id: test_sot_matches_discovered_modules
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml + .env.example from SoT (COMPOSE_PROFILES)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_generated_files_match_sot
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml + .env.example from SoT (COMPOSE_PROFILES)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_make_get_all_profiles_matches_sot
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml from SoT (COMPOSE_PROFILES)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_no_hardcoded_profiles_outside_allowlist
    repair_id: profiles-parity
    repair_command: make generate-manifests
    repair_description: Replaces hardcoded COMPOSE_PROFILES copies with runtime-read
      (yaml_query)
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
- make_target: check-domain-parity
  mechanism: pytest-gate
  delegates_to: pytest tests/gates/test_gate_domain_parity.py (PLATFORM_DOMAIN SoT
    parity, DevPlan 116 T9)
  signature: make check-domain-parity
  operation_ru: Parity-гейт PLATFORM_DOMAIN (единое определение, 0 legacy-доменов)
  description: 'Verifies single SoT definition in platform-infra.yaml, generated parity,
    and zero legacy-тестовых-доменов in production env chain. Repair: regenerate manifests.'
  repairs_gates:
  - gate_id: test_platform_domain_single_sot
    repair_id: domain-parity
    repair_command: make generate-manifests
    repair_description: Regenerates platform-env.yaml + .env.example from SoT (PLATFORM_DOMAIN)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_no_test_local_in_production_chain
    repair_id: domain-parity
    repair_command: make generate-manifests
    repair_description: Regenerates generated files (legacy-домен артефакты удалены
      из SoT)
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_env_defaults_generated_has_no_domain
    repair_id: domain-parity
    repair_command: make generate-manifests
    repair_description: Regenerates env_defaults_generated.py (PLATFORM_DOMAIN не
      секрет)
    repair_safe: true
    repair_idempotent: true
    repair_class: L1
- make_target: templates-check
  mechanism: template-engine
  delegates_to: core/internal/template_engine.py check (template-manifest coverage)
  signature: make templates-check
  operation_ru: Проверка покрытия и разрешимости шаблонов
  description: 'Verifies all templates in template-manifest resolve. Repair: register
    missing templates in core/templates/template-manifest.yaml.'
  repairs_gates:
  - gate_id: test_all_template_files_registered
    repair_id: template-coverage
    repair_command: make templates-check
    repair_description: Register missing *.template files in core/templates/template-manifest.yaml
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
  - gate_id: test_nginx_template_volume_sources_registered
    repair_id: template-coverage
    repair_command: make templates-check
    repair_description: Register nginx /etc/nginx/templates volume sources in template-manifest
    repair_safe: false
    repair_idempotent: true
    repair_class: L1
lifecycle:
- make_target: up-safe
  mechanism: compose-wrapper+preflight
  delegates_to: core/entrypoints/compose-wrapper.sh → core/internal/bootstrap/deploy/compose_preflight.py
    → docker compose up
  signature: make up-safe [MODULES=...]
  operation_ru: Безопасный compose up
  description: Safe docker compose up with preflight secret validation — blocks if
    required secrets missing (DevPlan 049)
- make_target: compose-safe-up
  mechanism: alias
  delegates_to: up-safe (deprecated alias)
  signature: make compose-safe-up (deprecated — use up-safe)
  operation_ru: Deprecated alias for up-safe
  description: Deprecated alias for up-safe. Migrate to `make up-safe`.
- make_target: converge
  mechanism: ssh+script
  delegates_to: core/entrypoints/converge.sh → core/internal/bootstrap/converge.sh
  signature: make converge NODE=<name>
  operation_ru: Реконсиляция ноды
  description: Idempotent reconcile with 9 R-units (R1-R9) and --units filter — конвергирует
    ноду с desired state из node.yaml; standalone или из node-lifecycle
- make_target: healthcheck
  mechanism: shell-script
  delegates_to: core/entrypoints/healthcheck.sh → Module healthcheck.sh scripts +
    core/internal/healthcheck/tor-proxy-healthcheck.sh
  signature: make healthcheck [NODE=...]
  operation_ru: Проверка здоровья
  description: Health check of platform (local compose or remote node via SSH)
- make_target: up
  mechanism: provisioner + docker-compose
  delegates_to: core/internal/provision-environment.sh → docker compose up
  signature: make up [PROJECT=...]
  operation_ru: Запуск compose-стека
  description: Provision environment (networks, volumes, CI env) from platform-env.yaml,
    then start local compose lifecycle
- make_target: down
  mechanism: docker-compose
  delegates_to: docker compose down
  signature: make down
  operation_ru: Остановка compose-стека
  description: Stop local compose lifecycle
- make_target: restart
  mechanism: docker-compose
  delegates_to: docker compose stop && docker compose start
  signature: make restart
  operation_ru: Мягкий перезапуск compose-стека
  description: Soft restart local compose services (stop + start)
- make_target: status
  mechanism: docker-compose
  delegates_to: docker compose ps
  signature: make status
  operation_ru: Статус compose-стека
  description: Show status of local compose services
- make_target: backup
  mechanism: shell-script
  delegates_to: Module backup scripts
  signature: make backup [NODE=...]
  operation_ru: Резервное копирование
  description: Run backup for platform services. Stateful-модули (postgres, backup-cron,
    hermes-agent); остальные модули НЕ объявляют backup/restore (контракт сужен, DevPlan
    116 D1)
- make_target: restore
  mechanism: shell-script
  delegates_to: Module restore scripts
  signature: make restore NODE=<n>
  operation_ru: Восстановление из бэкапа
  description: Restore from backup. Stateful-модули (postgres, backup-cron, hermes-agent);
    остальные модули НЕ объявляют backup/restore (контракт сужен, DevPlan 116 D1)
- make_target: node-update
  mechanism: ssh+rsync
  delegates_to: core/entrypoints/node-update.sh → core/internal/bootstrap/node-lifecycle.sh
    --mode update → core/internal/bootstrap/lifecycle/cli.py → core/internal/bootstrap/lifecycle/state_machine.py
    (B9 state machine — UPDATE mode — 5 фаз — φ9 secrets_update · φ10 node_config_update
    · φ11 registry_update → provision · llm-keys · healthcheck · φ12 deploy_update
    → core/internal/bootstrap/issue-cert.sh → core/internal/bootstrap/deploy-modules.sh
    · φ13 converge_update)
  signature: make node-update NODE=<name>
  operation_ru: Обновление provisioned ноды
  description: Regular CI update of an already-provisioned node (not INIT)
- make_target: verify
  mechanism: shell-script
  delegates_to: core/entrypoints/verify.sh → core/internal/verify/verify-domains.sh
  signature: make verify NODE=<node>
  operation_ru: HTTPS-верификация
  description: Post-deploy HTTPS verification — curl all expose:true domains from
    node.yaml, exit 0 if all HTTP 200
provision:
- make_target: provision
  mechanism: shell-script
  delegates_to: core/internal/provision-environment.sh → core/internal/provisioner.py
  signature: make provision [SCOPE=...]
  operation_ru: Provision окружения
  description: Idempotent environment provisioner — reads platform-env.yaml and creates
    Docker networks, volume directories, and CI env vars
- make_target: provision-llm
  mechanism: shell-facade
  delegates_to: core/entrypoints/provision-llm.sh → core/internal/llm/key_provisioner.py
  signature: make provision-llm
  operation_ru: Provision LiteLLM virtual keys
  description: 'Provision LiteLLM virtual keys for all LLM consumers (projects + platform
    services) from policy.yaml profiles. Idempotent: existing keys with matching config
    are skipped.'
dev:
- make_target: discover-modules
  mechanism: python-script
  delegates_to: core/internal/bootstrap/discover_modules.py
  signature: make discover-modules
  operation_ru: Авто-обнаружение модулей
  description: Auto-discover modules and regenerate docker-compose.yml include section
- make_target: dev-certs
  mechanism: python-script
  delegates_to: core/modules/nginx/dev_cert_generator.py
  signature: make dev-certs [CERT_BACKEND=...]
  operation_ru: Генерация dev SSL-сертификатов
  description: Idempotent generation of self-signed dev SSL certificates for nginx
    (hybrid mkcert→openssl)
- make_target: _get_all_profiles
  mechanism: makefile-echo
  delegates_to: echo
  signature: make _get_all_profiles
  operation_ru: Вывод COMPOSE_PROFILES
  description: Private helper — echo COMPOSE_PROFILES string (all 13 Docker modules
    with profiles). Used by CI and production scripts.
- make_target: render-monitoring
  mechanism: python-script
  delegates_to: python3 core/internal/monitoring_config_renderer.py
  signature: make render-monitoring PROJECT_DIR=<dir> PROJECT=<name> [NODE=<node>]
  operation_ru: Рендер конфигурации мониторинга после деплоя проекта
  description: Post-deploy monitoring reconfiguration (Prometheus targets, Grafana
    dashboards, Loki retention, Langfuse projects, alert rules). Registered make-target
    (U-65, DevPlan 116 B7 T7) — основной runtime-путь остаётся module-hook on-project-deploy.sh.
module_hooks:
- script: nginx_reload_hook.sh
  path: core/modules/nginx/nginx_reload_hook.sh
  signature: (module hook)
  operation_ru: Reload nginx после деплоя
  description: Nginx config validation and reload after project deploy — called via
    module.yaml hooks.on_project_deploy
