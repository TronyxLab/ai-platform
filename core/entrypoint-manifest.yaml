# core/entrypoint-manifest.yaml
# GREP_SUMMARY: entrypoint-manifest, yaml, canonical-targets, operations-registry, forbidden
# STRUCTURE: ┌Makefile targets┐ → ◇ map target→script→delegation → ⊕ CI gates verify parity with AGENTS.md triad
# region MODULE_CONTRACT
## @purpose  Canonical operations registry consumed by CI gates (no-unregistered-entrypoint, manifest-integrity).
## @scope    Lists all canonical make targets, CI gates, forbidden scripts/directories/verbs, and allowed_verbs dictionary
## @invariants
##   - Every Makefile .PHONY target must have a corresponding entry in this manifest
##   - Every entry here must have a corresponding entry in core/AGENTS.md
##   - allowed_verbs list must match Makefile canonical targets
##   - Forbidden lists are explicit deny — no additions without Architect approval
## @rationale Machine-readable registry enables CI gates to validate the Makefile/AGENTS.md/filesystem triad
# endregion MODULE_CONTRACT

bootstrap:
- make_target: bootstrap-node
  mechanism: ssh+rsync
  delegates_to: core/entrypoints/bootstrap.sh → core/internal/bootstrap/preflight.py
    → core/internal/bootstrap/node-lifecycle.sh --mode init → core/internal/bootstrap/lifecycle/cli.py
    → core/internal/bootstrap/lifecycle/state_machine.py (B9 state machine — 14 фаз
    — 9 INIT — φ1 system_bootstrap → core/internal/bootstrap/install-docker.sh → core/internal/bootstrap/install-tor-proxy.sh
    → core/internal/bootstrap/firewall.sh · φ2 user_accounts · φ3 platform_setup →
    core/internal/bootstrap/docker_registry_auth.py → core/internal/bootstrap/setup-node.sh
    · φ4 secrets_provision · φ5 node_configuration · φ6 registry_auth · φ7 certificates
    → core/internal/bootstrap/install-acme.sh · φ8 deploy_services → core/internal/bootstrap/deploy-modules.sh
    → core/internal/bootstrap/cert_orchestrator.py → core/internal/bootstrap/deploy/context_deployer.py
    · φ8.5 converge_services — 5 UPDATE — φ9 secrets_update · φ10 node_config_update
    · φ11 registry_update · φ12 deploy_update · φ13 converge_update)
  signature: make bootstrap-node NODE=<name>
  operation_ru: Идемпотентный bootstrap ноды
  description: Idempotent bootstrap of a new node to FULL readiness (infra + context
    projects + certs + Docker Hub auth) (DevPlan 047)
- make_target: deploy-context
  mechanism: ssh+python
  delegates_to: core/entrypoints/deploy-context.sh → core/internal/bootstrap/deploy/context_deployer.py
  signature: make deploy-context NODE=<n> [CONTEXT=<ctx>]
  operation_ru: Деплой проектов контекста на ноде
  description: 'Deploy all projects of a context on a bootstrapped node (standalone
    or post-bootstrap). Idempotent: ghcr.io pull primary, build-on-node fallback (DevPlan
    047)'
deploy:
- make_target: deploy
  mechanism: git-push
  delegates_to: git push → CI → .github/workflows/deploy-project.yml (receive verb)
    → orchestrator_cli dispatch receive → core/internal/deploy/orchestrator.py DeployOrchestrator.receive()
    → core/internal/notify/notify-hook.sh + core/internal/catalog/generate-catalog.sh
    (post-deploy, D4) → legacy-local-entrypoint → core/entrypoints/deploy.sh (DevPlan
    116 B1 T7)
  signature: make deploy PROJECT=<dir>
  operation_ru: Деплой проекта
  description: Deploy a project via git push → CI → SSH forced-command dispatch (receive
    verb) on VPS
- make_target: deploy-project
  mechanism: ssh+tar
  delegates_to: core/internal/deploy/orchestrator_cli.py deliver (ForcedCommandChannel
    receive <project> <version>) → orchestrator_cli dispatch receive → DeployOrchestrator.receive()
  signature: make deploy-project PROJECT=<dir> NODE=<node>
  operation_ru: Прямой деплой минуя CI (DeployOrchestrator deliver)
  description: Direct project deploy via orchestrator_cli deliver (ForcedCommandChannel
    receive) — bypassing CI for emergency fallback (NODE→host через extract_node_host)
- make_target: context-promote
  mechanism: git-push-context
  delegates_to: core/entrypoints/context-promote.sh → core/internal/deploy/context_promoter.py
  signature: make context-promote CONTEXT=<context>
  operation_ru: Промоут платформы в контекст
  description: Promote platform to a context org (copy + CI + auto-deploy)
build:
- make_target: hermes-build-platform
  mechanism: docker-build
  delegates_to: core/entrypoints/build.sh → core/internal/build/hermes-images.sh build-platform
  signature: make hermes-build-platform
  operation_ru: Сборка L1 образа
  description: Build L1 (hermes-agent-base) locally + push to ghcr.io as backup
- make_target: hermes-build-context
  mechanism: docker-build
  delegates_to: core/entrypoints/build.sh → core/internal/build/hermes-images.sh build-context
  signature: make hermes-build-context CONTEXT=<context>
  operation_ru: Сборка L1→L2 образа
  description: Build L1→L2 (hermes-agent-context), optionally push to GHCR
- make_target: hermes-push-l1
  mechanism: docker-push
  delegates_to: docker tag + docker push to ghcr.io
  signature: make hermes-push-l1
  operation_ru: Push L1 в ghcr.io
  description: Push L1 (hermes-agent-base) to ghcr.io as disaster recovery backup
- make_target: hermes-push-l2
  mechanism: docker-push
  delegates_to: docker tag + docker push to ghcr.io
  signature: make hermes-push-l2 CONTEXT=<org>
  operation_ru: Push L2 в ghcr.io
  description: Push L2 (hermes-agent-context) to ghcr.io for a specific context/org
validate:
- make_target: templates-render
  mechanism: python-script
  delegates_to: core/internal/template_engine.py render-all
  signature: make templates-render
  operation_ru: Рендер шаблонов
  description: Render all templates from manifest to output paths
- make_target: validate-modules
  mechanism: python-script
  delegates_to: core/internal/scripts/validate_module_yaml.py --all
  signature: make validate-modules
  operation_ru: Валидация module.yaml
  description: D5 module.yaml contract validator (typed env_requires, restart-drift,
    secret-presence)
- make_target: validate
  mechanism: shell-script
  delegates_to: core/entrypoints/validate.sh → core/internal/validate/validate.sh
    → core/internal/validate/validate_orchestrator.py
  signature: make validate [FILES=...]
  operation_ru: Schema-валидация
  description: Schema validation of project files
- make_target: lint
  mechanism: shell-script
  delegates_to: core/entrypoints/validate.sh --lint → core/internal/validate/validate.sh
    → core/internal/validate/validate_orchestrator.py
  signature: make lint
  operation_ru: Линтинг
  description: shellcheck + yamllint + pytest-lint
- make_target: check-file-lines
  mechanism: shell-script
  delegates_to: core/entrypoints/check-file-lines.sh
  signature: make check-file-lines [MAX_LINES=500]
  operation_ru: Проверка длины файлов
  description: Scan files exceeding line limit (default 500) — non-blocking warning
- make_target: scripts-audit
  mechanism: shell-script
  delegates_to: core/internal/scripts-audit.sh
  signature: make scripts-audit
  operation_ru: Аудит регистрации скриптов
  description: Audit shebang script registration in manifest or exceptions
- make_target: check-dead-code
  mechanism: shell-script
  delegates_to: core/entrypoints/check-dead-code.sh
  signature: make check-dead-code
  operation_ru: Проверка мёртвого кода
  description: CI gate — detect DEPRECATED markers older than 30 days (Dead Code Sweep
    084)
- make_target: check-exception-patterns
  mechanism: grep-gate
  delegates_to: grep -rEn 'except Exception' core/internal/ --include='*.py' (bare
    except only in __main__ or
  signature: make check-exception-patterns
  operation_ru: Проверка паттернов исключений
  description: 'CI gate (DevPlan 118 G2): bare except Exception only in __main__ or
    # noqa: EXC-marked. Регистрация loophole-таргета: вызывается gate-конвейером (Step
    2c/8) но отсутствовал в .PHONY/allowed_verbs/глоссарии.'
- make_target: doxygen-check
  mechanism: ci-gate
  delegates_to: doxygen Doxyfile (zero-warnings invariant, DevPlan 097)
  signature: make doxygen-check
  operation_ru: Doxygen zero-warnings проверка
  description: CI gate — doxygen Doxyfile must produce zero warnings (DevPlan 097
    zero-warnings invariant). Fails on warning count > 0 or doxygen exit != 0. Skips
    gracefully when doxygen binary is absent.
lint:
- script: lint.sh
  mechanism: pre-commit-hook
  delegates_to: core/entrypoints/lint.sh → core/internal/lint/grepsummary_validator.py
    (grepsummary) + core/internal/lint/doc_header_validator.py (namelint)
  signature: (pre-commit hook)
  operation_ru: Pre-commit hook — линтинг
  description: Pre-commit hook runner for GREP_SUMMARY validation + target name check
- script: check-doc-headers.sh
  mechanism: pre-commit-hook
  delegates_to: core/entrypoints/check-doc-headers.sh → core/internal/lint/doc_header_validator.py
  signature: (pre-commit hook)
  operation_ru: Pre-commit hook — проверка документ-хедеров
  description: Validates GREP_SUMMARY, MODULE_CONTRACT, STRUCTURE, regions in source
    files
- script: check_commit_msg.py
  mechanism: commit-msg-hook
  delegates_to: core/entrypoints/check_commit_msg.py
  signature: (commit-msg hook)
  operation_ru: Commit-msg hook — проверка коммит-сообщений
  description: Conventional Commits message validation (commit-msg hook)
test:
- make_target: test
  mechanism: pytest
  delegates_to: make test [MARKER=static|smoke|component|integration|predeploy|contract|e2e|all]
  signature: make test [MARKER=...]
  operation_ru: Запуск тестов
  description: Run tests with MARKER filter. MARKER=all (default) runs full suite.
- make_target: test-summary
  mechanism: python-wrapper
  delegates_to: core/internal/test_runner.py --marker <MARKER>
  signature: make test-summary [MARKER=static_audit|smoke|component|integration|predeploy|contract|e2e|static|all]
    [TIMEOUT=1800]
  operation_ru: Запуск тестов (агент-ориентированная обёртка)
  description: Run tests via compact agent-oriented wrapper (pytest → JUnit XML →
    compact summary <100 lines). MARKER=static_audit (default).
- make_target: test-inventory-sync
  mechanism: pytest-collect
  delegates_to: tests/tools/sync_inventory.py
  signature: make test-inventory-sync
  operation_ru: Синхронизация test inventory
  description: Regenerate tests/test_inventory.yaml from pytest --collect-only
- make_target: test-node
  mechanism: pytest
  delegates_to: pytest tests/e2e/ -m requires_node
  signature: make test-node NODE=<name>
  operation_ru: E2E pipeline тесты на test-VPS
  description: Run E2E bootstrap pipeline tests against a recreatable test-VPS (requires_node
    marker, NODE env, SSH, Docker). NOT in make test MARKER=all or make gate. DevPlan
    095.
