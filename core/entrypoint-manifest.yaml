# core/entrypoint-manifest.yaml
# GREP_SUMMARY: entrypoint-manifest, yaml, canonical-targets, operations-registry
# STRUCTURE: ┌Makefile targets┐ → ◇ map target→script→delegation → ⊕ CI gates verify parity with AGENTS.md triad
# region MODULE_CONTRACT
## @purpose  Canonical operations registry consumed by CI gates (no-unregistered-entrypoint, manifest-integrity).
## @scope    Lists all canonical make targets, CI gates, and allowed_verbs dictionary.
## @invariants
##   - Every Makefile .PHONY target must have a corresponding entry in this manifest
##   - Every entry here must have a corresponding entry in core/AGENTS.md
##   - allowed_verbs list must match Makefile canonical targets
## @rationale Machine-readable registry enables CI gates to validate the Makefile/AGENTS.md/filesystem triad
# endregion MODULE_CONTRACT
#
# ⚠️ СИСТЕМНЫЕ ИСКЛЮЧЕНИЯ .PHONY (DevPlan 119 G2, by-design отклонение от @invariants;
#   DevPlan 171 W3.6 — перечень заменён категорийным правилом):
#   Категории вне allowed_verbs/глоссария: стандартные служебные таргеты make
#   (help/venv), префиксы (test-/gate-/pre-commit- — name_linter.system_prefixes),
#   `_`-префиксные имена. Валидатор: core/internal/lint/doc_header_validator.py
#   (STANDARD_MAKE_SERVICE_TARGETS); документация: core/AGENTS.md
#   «Системные исключения .PHONY».
#
# Гибридная граница (DevPlan 171 W4.5):
#   ### MANUAL — всё выше маркера GENERATED SECTION START; правится руками, переносится
#     генератором байт-в-байт (никогда не пере-дамплится).
#   ### GENERATED — блок allowed_verbs + gates между маркерами START/END;
#     единственный регион, который перезаписывает `make generate-entrypoint-manifest`.

bootstrap:
- make_target: bootstrap-node
  visibility: public
  mechanism: ssh+rsync
  delegates_to: core/entrypoints/bootstrap.sh → core/internal/bootstrap/preflight.py
    → core/internal/bootstrap/node-lifecycle.sh --mode init → core/internal/bootstrap/lifecycle/cli.py
    → core/internal/bootstrap/lifecycle/state_machine.py (B9 state machine — 14 фаз
    — 9 INIT — φ1 system_bootstrap → core/internal/bootstrap/install-docker.sh → core/internal/bootstrap/install-tor-proxy.sh
    → core/internal/bootstrap/firewall.sh · φ2 user_accounts · φ3 platform_setup →
    core/internal/bootstrap/docker_registry_auth.py → core/internal/bootstrap/setup-node.sh
    · φ4 secrets_provision · φ5 node_configuration · φ6 registry_auth · φ7 certificates
    → core/internal/bootstrap/install-acme.sh · φ8 deploy_services → core/internal/bootstrap/deploy-modules.sh
    → core/internal/bootstrap/cert_orchestrator.py → core/internal/bootstrap/deploy/context_deployer.py
    · φ8.5 converge_services — 5 UPDATE — φ9 secrets_update · φ10 node_config_update
    · φ11 registry_update · φ12 deploy_update · φ13 converge_update)
  signature: make bootstrap-node NODE=<name>
  operation_ru: Идемпотентный bootstrap ноды
  description: Idempotent bootstrap of a new node to FULL readiness (infra + context
    projects + certs + Docker Hub auth) (DevPlan 047)
- make_target: deploy-context
  visibility: public
  mechanism: ssh+python
  delegates_to: core/entrypoints/deploy-context.sh → core/internal/bootstrap/deploy/deploy_context_cli.py
    → core/internal/bootstrap/deploy/context_deployer.py
  signature: make deploy-context NODE=<n> [CONTEXT=<ctx>]
  operation_ru: Деплой проектов контекста на ноде
  description: 'Deploy all projects of a context on a bootstrapped node (standalone
    or post-bootstrap). Idempotent: ghcr.io pull primary, build-on-node fallback (DevPlan
    047)'
- make_target: core-deliver
  visibility: public
  mechanism: ssh+rsync
  delegates_to: core/entrypoints/core-deliver.sh → rsync core/+scripts/+makefiles/+platform-env.yaml
    → ssh make provision SCOPE=networks,volumes → ssh make node-update NODE=<n>
  signature: make core-deliver NODE=<n> [AGE_SECRET_KEY_FILE=<f>] [DRY_RUN=1]
  operation_ru: DR-канал локального оператора (тот же core_deliverer.py)
  description: 'DR-канал деплоя core локальным оператором (164 W3-3): тот же core_deliverer.py,
    что у CI core-deploy — два актора одного канала, не переходный период. Использование:
    GitHub Actions недоступны (Major Outage) / ручной деплой core. Guard''ы rsync
    как в workflow (TRAP[BUG] 125 T4); AGE_SECRET_KEY — локальная цепочка node_detect
    (env-only, W4 DevPlan 140). Rev: если локальная доставка не используется 3 квартала
    подряд — удалить core-deliver'
deploy:
- make_target: deploy
  visibility: public
  mechanism: git-push
  delegates_to: git push → CI → .github/workflows/deploy-project.yml (receive verb)
    → orchestrator_cli dispatch receive → core/internal/deploy/orchestrator.py DeployOrchestrator.receive()
    → core/internal/notify/notify-hook.sh + core/internal/catalog/generate-catalog.sh
    (post-deploy, D4)
  signature: make deploy PROJECT=<dir> [NODE=<node>] [LAUNCH=1]
  operation_ru: Деплой проекта
  description: Deploy a project via git push → CI → SSH forced-command dispatch (receive
    verb) on VPS; NODE triggers VPS pre-flight readiness check (W1); LAUNCH=1 delivers
    directly via orchestrator_cli (W6, DevPlan 116 B1 T5)
- make_target: deploy-project
  visibility: public
  mechanism: ssh+tar
  delegates_to: core/internal/deploy/orchestrator_cli.py deliver (ForcedCommandChannel
    receive <project> <version>) → orchestrator_cli dispatch receive → DeployOrchestrator.receive()
  signature: make deploy-project PROJECT=<dir> NODE=<node>
  operation_ru: Прямой деплой минуя CI (DeployOrchestrator deliver)
  description: Direct project deploy via orchestrator_cli deliver (ForcedCommandChannel
    receive) — bypassing CI for emergency fallback (NODE→host через extract_node_host)
- make_target: context-promote
  visibility: public
  mechanism: git-push-context
  delegates_to: core/entrypoints/context-promote.sh → core/internal/deploy/context_promoter.py
  signature: make context-promote CONTEXT=<context>
  operation_ru: Промоут платформы в контекст
  description: Promote platform to a context org (copy + CI + auto-deploy + auto org-secrets provisioning via org_secrets_provisioner.py)
- make_target: parity-db
  visibility: public
  mechanism: ssh+psql
  delegates_to: core/entrypoints/parity-db.sh → python3 -m core.internal.deploy.parity_db
    (ssh root@<node> → docker exec postgres psql -U postgres; привилегированный путь,
    DevPlan 019 TASK-6)
  signature: make parity-db ACTION=<create|drop> PROJECT=<name> NODE=<node>
  operation_ru: Create/drop temporary parity database via privileged path (Plan 019 TASK-6, AC5)
  description: 'Temporary parity-БД для PG-parity прогонов ai-project: create/drop БД
    "parity_<project>" + роли "parity_<project>_user" через привилегированный путь
    (docker exec postgres psql на НОДЕ) — проектные роли БЕЗ CREATEDB (изоляция канона,
    TRAP[BUSINESS] 019). create: stdout = одна DSN-строка
    (postgresql://parity_<project>_user:<pw>@pgbouncer:6432/parity_<project>), idempotent
    (повторный create → ALTER ROLE + DSN re-print); drop: DROP DATABASE IF EXISTS ...
    WITH (FORCE) + DROP ROLE IF EXISTS (отсутствие — не ошибка)'
