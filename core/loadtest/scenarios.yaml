# GREP_SUMMARY: loadtest scenarios SoT rps thresholds endpoints ports
# STRUCTURE: ┌defaults┐ → ◇ per-scenario (endpoint, method, headers, body, target_rps, users, thresholds, optional)
# region MODULE_CONTRACT
## @purpose  Единый Source of Truth сценариев нагрузочных тестов (DevPlan 146) — endpoint,
##           метод, headers, body-шаблон, target_rps, users, пороги FAIL/safety-stop,
##           стартовый RPS capacity. Читается core/internal/loadtest/config.py; locust-файлы
##           НЕ содержат хардкодов (инвариант 2) — получают всё через env LT_* при старте.
## @scope    core/loadtest/ — только SoT. Правки путей/порогов/RPS — здесь, НЕ в .py сценариях.
## @invariants
##   1. users = РАЗМЕР ПУЛА (users = target_rps × 2), НЕ контроль RPS — точный RPS задаёт
##      locust --max-rps (RPS = users/latency, users ≠ rps, DevPlan 146 инвариант 11).
##   2. Плейсхолдеры endpoint/headers/body: {domain} → node.yaml domain (platform_domain,
##      пустой → fallback на host — тестовые ноды без домена), {host} → node.host,
##      {model} → model сценария, {ANY_VAR} → одноимённая переменная окружения.
##   3. optional-сценарии (db, s3) по умолчанию ВЫКЛЮЧЕНЫ; включение: LOAD_SCENARIO_<NAME>=1.
##   4. Пороги: max_p95/max_p99 — секунды; max_error — доля (0.05 = 5%);
##      baseline_delta_p95 — множитель регрессии; baseline_delta_error_pp — процентные пункты.
##   5. Длительности согласованы со scrape_interval Prometheus (30s global, 60s
##      cadvisor/node-exporter): smoke ≥ 90s (≥3 сэмпла 30s-метрик, ≥2 по 60s, инвариант 10).
## @rationale SoT отдельно от кода — воспроизводимость прогонов и правки путей/порогов
##            без изменения Python (DevPlan 146 §3.1, инвариант 2).
## @changes  2026-08-11 | DevPlan 146 W1 — Created
# endregion MODULE_CONTRACT

defaults:
  ssl_verify: false                  # тестовые ноды: самоподписанные серты (CA-путь — extension)
  run_time: 300                      # s — regression
  smoke_duration: 90                 # s — smoke (≥90: ≥3 сэмпла 30s-метрик, ≥2 по 60s)
  capacity_step_duration: 60         # s — шаг capacity (стабилизация)
  max_error: 0.05                    # 5% — safety-stop capacity / FAIL-критерий
  max_p99: 3.0                       # s — safety-stop capacity
  max_p95: 1.0                       # s — FAIL-критерий smoke/regression
  baseline_delta_p95: 1.5            # множитель регрессии (p95 <= 1.5×prev)
  baseline_delta_error_pp: 2.0       # процентных пункта (error <= prev + 2pp)

scenarios:
  web:
    description: "nginx front: главная, status-page"
    endpoint: "https://{domain}/"
    paths: ["/", "/status"]
    method: GET
    users: 20
    target_rps: 10
  llm:
    description: "litellm /chat/completions non-stream (mock-модель mock-echo)"
    endpoint: "http://{host}:4000"
    path: "/chat/completions"
    method: POST
    model: "mock-echo"
    body_template:
      model: "{model}"
      messages:
        - role: user
          content: "ping"
    users: 40
    target_rps: 20
    capacity_start_rps: 2
  llm_stream:
    description: "litellm /chat/completions SSE (stream=true, chunk-timeout 10s)"
    endpoint: "http://{host}:4000"
    path: "/chat/completions"
    method: POST
    stream: true
    model: "mock-echo"
    body_template:
      model: "{model}"
      stream: true
      messages:
        - role: user
          content: "ping"
    users: 20
    target_rps: 5
    chunk_timeout: 10
  langfuse_ingest:
    description: "langfuse /api/public/traces (публичный ключ из секретов ноды)"
    endpoint: "https://n.{domain}"
    path: "/api/public/traces"
    method: POST
    headers:
      Authorization: "Bearer {LANGFUSE_PUBLIC_KEY}"
    body_template:
      name: "loadtest-trace"
      timestamp: "2026-01-01T00:00:00.000Z"
      observations: []
    users: 10
    target_rps: 5
  db:
    description: "pg read через pgbouncer — OPTIONAL: HTTP-пути нет, прогон только с LOAD_SCENARIO_DB=1 и рабочим HTTP-endpoint"
    optional: true
    endpoint: "http://{host}:5432"
    paths: ["/"]
    users: 10
    target_rps: 5
  s3:
    description: "minio PUT/GET через HTTP API (SigV4 presigned, без boto3 — его нет в locust-образе)"
    optional: true
    endpoint: "http://{host}:9000"
    users: 10
    target_rps: 5
