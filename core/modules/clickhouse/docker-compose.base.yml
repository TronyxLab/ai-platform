# @purpose  Base compose definition for clickhouse — official clickhouse/clickhouse-server:24.12 image with config.d overrides
# GREP_SUMMARY: clickhouse docker-compose clickhouse-24.12 observability-net hermes-agent-net ulimits nofile SYS_NICE healthcheck wget-ping
# STRUCTURE: ▶ clickhouse:24.12 → observability-net + hermes-agent-net → config.d/*.xml → wget /ping → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for clickhouse — official clickhouse/clickhouse-server:24.12 LTS image
## @scope    Part of observability stack: no separate network, no host ports in base, config.d overrides
## @invariants
##   - Image: clickhouse/clickhouse-server:24.12 (pinned LTS version — no :latest policy)
##   - ports через ${SERVICE_BIND_HOST:-127.0.0.1} (DevPlan 010 T2.2): HTTP 8123 (scrape/UI)
##     + native peer HOST ${CLICKHOUSE_NATIVE_PEER_PORT:-19000} → container 9000. Host-порт
##     native = 19000, НЕ 9000: коллизия с minio API 9000 на общей data-ноде (TRAP §3 плана;
##     прецедент host≠container — langfuse 3001/3000). Потребители (langfuse) кросс-нодово
##     получают CLICKHOUSE_NATIVE_PORT=19000 из provision; локально ходят по Docker DNS :9000.
##     Peer-доступ режет ufw (T2.3); loopback-bind — дефолт single-node (байт-идентично).
##   - restart: unless-stopped — Docker policy
##   - stop_grace_period: 60s — allows merge queue flush and clean shutdown
##   - deploy.resources: limits memory 3G, cpus 1.0; reservations memory 256M (DevPlan 144 W3: 1G → 2G; v1.0.1: 2G → 3G — merge MEMORY_LIMIT_EXCEEDED restart-петля)
##   - Network: observability-net (external:true) — part of observability stack, not shared infra
##   - ulimits: nofile soft/hard 262144 — ClickHouse standard recommendation
##   - cap_add: SYS_NICE — allows thread priority management by ClickHouse
##   - Healthcheck: wget --spider /ping — HTTP endpoint liveness check
##   - Config: config.d/*.xml fragments (not full config.xml replacement) — follows ClickHouse best practice
##   - Users: per-file ro mount config/users.d/10-users.xml — only users.xml is bind-mounted;
##     NOT the entire users.d/ directory, so default-user.xml (generated by entrypoint from
##     CLICKHOUSE_PASSWORD env) stays container-local and password rotation converges automatically
##   - Environment: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 — enables SQL-driven user management
##   - Container name: clickhouse
## @rationale ClickHouse is part of the observability stack (Prometheus scrapes :9363, Grafana queries :8123),
##   hence observability-net without a separate network. Config.d fragments override only needed settings
##   without replacing the entire config.xml (upgrade-safe). Resource limits per AR3: 2G/1.0 CPU with
##   256M reservation prevents OOM while leaving headroom for other services (DevPlan 144 W3: 1G → 2G —
##   cAdvisor usage 91.5% at 1G incl. page cache; v1.0.1: 2G → 3G — merge-буфер, TRAP[BUG] Фазы 5).
##   No ports in base.yml — follows the same pattern as postgres and redis (ports in root compose only).
##   Per-file ro mount for users.d/10-users.xml (not dir bind): prevents default-user.xml runtime artifact
##   from leaking to host filesystem and being rsync'd to VPS (langfuse auth outage 2026-07-17, P1).
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  clickhouse:
    # 🧐 TRAP[DECISION] · 2026-07-12 · — · ClickHouse: no separate network, no ports in base, AR3
    # ·   NO separate clickhouse-net — ClickHouse is part of observability stack, not shared
    # ·   infrastructure (like postgres/redis). Prometheus must scrape :9363, Grafana queries :8123,
    # ·   Rev: if ClickHouse interferes with other services, add CPU reservation (not limit)
    # ·   both on observability-net. Separate network would require extra network connections
    # ·   for Prometheus and Grafana — unnecessary complexity.
    # ·   NO ports in base.yml — follows same pattern as postgres and redis. Host port
    # ·   bindings (127.0.0.1 only) defined in root docker-compose.yml.
    # ·   AR3 (no resource limits beyond memory) — ClickHouse manages its own memory via
    # ·   max_server_memory_usage_to_ram_ratio (0.80). Hard CPU limits would degrade query
    # ·   performance on bursty analytical workloads. ulimits and SYS_NICE sufficient for
    # ·   production operation.
    # ·   Rev: if ClickHouse interferes with other services, add CPU reservation (not limit)
    # ·   Rejected: separate clickhouse-net — ClickHouse is observability component, not shared infra
    # ·   Rejected: ports in base.yml — centralized port management in root compose
    # ·   Rejected: hard CPU limits — ClickHouse needs burst CPU for analytical queries
    # ·   Rev: if ClickHouse interferes with other services, add CPU reservation (not limit)
    image: clickhouse/clickhouse-server:26.7.3.19@sha256:5b3133d49750626b9ef48cf07f720b288fc4ee26e9bf54efcd89cb4e8769d2bb
    container_name: clickhouse
    profiles: [clickhouse]
    restart: unless-stopped
    stop_grace_period: 60s

    deploy:
      resources:
        limits:
          # DevPlan 144 W3 (D2): 1G → 2G — cAdvisor usage 91.5% (вкл. page cache), docker stats
          # 639MiB (62%); 2G даёт 32% запас при page cache и >50% по working set.
          # v1.0.1 (TRAP[BUG] Фаза 5): 2G → 3G — merge-задача требовала 1.57 GiB при максимуме
          # 1.48 GiB → MEMORY_LIMIT_EXCEEDED на старте → restart-петля (17 рестартов, healthcheck
          # «Cannot fork» — cgroup-лимит). 3G покрывает merge-буфер + серверный кэш.
          memory: 3G
          cpus: "1.0"
          # v1.0.1 TRAP[BUG] (Фаза 6, tronyx-vps): pids 256 исчерпывался (current=251 при
          # 8GB RAM — мержи/партиции) → healthcheck exec «procReady not received» → unhealthy.
          # 512 — потолок под нагрузку мержей; мониторинг pids — cAdvisor container_threads.
          pids: 512
        reservations:
          memory: 256M
    logging: *default-logging

    # [IMP:8][clickhouse-compose] DevPlan 010 T2.2: HTTP 8123 + native peer host 19000→9000
    # (см. инвариант MODULE_CONTRACT выше — коллизия с minio:9000, TRAP §3)
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_PEER_PORT:-19000}:9000"

    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CH_PASSWORD_REQUIRED}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/users.d/10-users.xml:/etc/clickhouse-server/users.d/10-users.xml:ro
    # 🧐 TRAP[DECISION] · 2026-07-17 · — · Per-file ro mount instead of dir bind for users.d/
    # · Rejected: directory bind mount ./config/users.d:/etc/clickhouse-server/users.d
    # · Reason: ClickHouse entrypoint writes default-user.xml from CLICKHOUSE_PASSWORD env
    # ·   on every container start. If users.d/ is bind-mounted as a directory, the generated
    # ·   file leaks to the host filesystem (and later to rsync → VPS, causing auth outage P1).
    # ·   Per-file ro mount keeps the runtime artifact container-local — password rotation
    # ·   converges automatically without manual cleanup.
    # · Rev: if additional user config files need bind-mounting, add them explicitly as per-file ro mounts
    # · See: DevPlan 001 T1, langfuse auth outage 2026-07-17 (stale testpass file rsync'd over ch-test-2026)

    # [IMP:8][clickhouse-compose] ulimits: nofile 262144 — ClickHouse opens many files (parts, marks, dictionaries)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    # [IMP:8][clickhouse-compose] SYS_NICE — allows ClickHouse to manage thread priorities
    cap_add:
      - SYS_NICE

    networks:
      observability-net:
        aliases:
          - clickhouse
      # [IMP:9][clickhouse-compose] REF-0017: SoT placement (platform-infra.yaml
      # provides.clickhouse.networks) — hermes-agent tenants достигают analytics по
      # agent-сети. Аддитивный attach; observability-net (scrape) не убран.
      hermes-agent-net:
        aliases:
          - clickhouse

    # [IMP:9][clickhouse-compose] HTTP /ping healthcheck — wget --spider (no output, non-zero on failure)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s  # 20→15s: standardized per DevPlan 083 (DB default)

networks:
  # @changes 2026-08-13 (164 W1-5): 24.12→26.7.3.19 (MAJOR; configs совместимы — changelog-review)
  observability-net:
    external: true
    name: observability-net
  # REF-0017: аддитивное членство (SoT placement); сеть pre-created deploy-modules.sh
  hermes-agent-net:
    external: true
    name: hermes-agent-net
