# GREP_SUMMARY: clickhouse module docker observability-net analytical-db liveness wget-ping
# STRUCTURE: ▶ module:clickhouse → observability-net → config.d/xml → wget /ping → ┐
# region MODULE_CONTRACT
## @purpose  ClickHouse analytical DB — telemetry storage, metrics aggregation, high-cardinality event queries
## @scope    Single-node; part of observability stack; HTTP/Native access via observability-net
## @invariants
##   - install_type: docker — managed by compose, NOT systemd
##   - depends_on: [] — standalone service, no platform dependencies
##   - Network: observability-net (shared with Prometheus/Grafana) — no separate clickhouse-net
##   - ClickHouse is part of observability stack, not shared infrastructure — hence shared network
##   - No ports exposed to host beyond 127.0.0.1 bindings (internal Docker network only)
##   - restart: unless-stopped — Docker policy
##   - stop_grace_period: 60s — allows merge queue flush and clean shutdown
##   - Resource limits: 2G memory, 1.0 CPU (no overhead policy) — DevPlan 144 W3: 512M→2G
##     (compose 1G→2G; факт. потребление 639MiB по docker stats, cAdvisor usage 91.5% при 1G)
##   - Version pinned: 24.12 LTS (not latest — platform policy)
##   - Users: per-file ro mount config/users.d/10-users.xml (NOT dir mount) — default-user.xml
##     stays container-local so password rotation converges automatically
## @rationale ClickHouse is an analytical DB serving the observability stack, not a shared infrastructure
##   service — hence no separate network, no depends_on. Observability-net shared with Prometheus/Grafana
##   for native scrape and dashboard access without extra network hops.
##   Per-file ro mount for users.d/10-users.xml prevents default-user.xml runtime artifact from
##   leaking to host filesystem and being rsync'd to VPS (langfuse auth outage 2026-07-17, P1).
# endregion MODULE_CONTRACT

name: clickhouse
install_type: docker
description: >
  ClickHouse 24.12 analytical columnar DB for telemetry storage,
  metrics aggregation, and high-cardinality event queries.
  Part of observability stack in observability-net.

depends_on: []

# D5 (118 G4): severity — analytical DB, non-critical
severity: normal

# restart: unless-stopped — согласовано с docker-compose.base.yml (DevPlan 116 B7 T8)
restart: unless-stopped

interfaces:
  - healthcheck

spool_dir: /var/lib/platform/clickhouse-data
spool_volume: clickhouse-data

resources:
  # Синхронизировано с docker-compose.base.yml (DevPlan 144 W3): лимит единственного сервиса
  # clickhouse 2G (было 1G; module.yaml был 512M — рассинхрон, исправлен до 2G).
  limits:
    memory: 2G
  reservations:
    memory: 256M

env_requires:
  - CLICKHOUSE_PASSWORD
