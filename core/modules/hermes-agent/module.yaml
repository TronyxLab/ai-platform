# GREP_SUMMARY: hermes-agent module docker agent-net proxy-net readiness liveness restart-always
# STRUCTURE: ▶ module:hermes-agent → proxy-net + agent-net → /health + /ready → skills → ┐
# region MODULE_CONTRACT
## @purpose  AI agent module (hermes-agent) providing monitoring, alerting, and self-update capabilities
## @scope    Phase 04 base-layer: agent HTTP API (/health, /ready, /), skill loading at startup
## @invariants
##   - install_type: docker — managed by compose, multi-stage base+overlay build
##   - Networks: proxy-net + <project>-net (both external:true, pre-created by bootstrap)
##   - restart: always — agent must survive container crashes and host reboots
##   - stop_grace_period: 30s — time to complete active tasks and send final notifications (06 §13)
##   - Readiness: /ready endpoint — agent has loaded all skills and is ready to serve
##   - Liveness: /health endpoint — process is responding (Docker healthcheck interval)
##   - Deploy key read-only: mounted via volumes, agent never writes to deployed config
##   - NO ports — agent accessed via nginx proxy-net only
##   - Skills loaded at startup, no hot-reload (07 §4.4)
  ##   - Resource limits: memory 1G (соответствует compose)
## @rationale Separate image from base skills allows overlay-based customization per context (06 §5.4)
## @changes 2026-08-15 | DevPlan 172 W4.6 — документированы «лишние» элементы модуля
##   (структура НЕ трогается — осознанное keep-решение):
##   - overlays/ — .gitkeep-каталог для контекстных overlay-кастомизаций L1-образа
##     (плейсхолдер, заполняется в контекстных org — см. core/internal/build/hermes-images.sh)
##   - healthcheck_deps.py — deps-режим healthcheck.sh (DevPlan 119 D6; required PG+LiteLLM,
##     optional Redis) — живёт рядом с healthcheck.sh, а не в internal/: модульный код
##     не может импортировать core/internal (cross-layer gate #8)
##   - .env.example / .gitignore / build/ — L1 build payload (ghcr.io hermes-agent-base,
##     DevPlan 116 B3 D1); .env — gitignored, per-developer
# endregion MODULE_CONTRACT

name: hermes-agent
install_type: docker
description: "AI DevOps agent with HTTP API, skill management, Telegram notifications, and LiteLLM integration."

depends_on:
  - nginx
  - postgres
  - redis
  - litellm

# D5 (118 G4): severity — AI agent, non-critical (деградация, не блокирует node-update)
severity: normal

interfaces:
  - healthcheck

# restart: unless-stopped — согласовано с docker-compose.base.yml (per Hermes recommendation,
# not always — allows controlled stop; DevPlan 116 B7 T8: consumer-scan, compose говорит иначе)
restart: unless-stopped

spool_dir: /var/lib/platform/hermes-agent/data
spool_volume: hermes-data

# Синхронизировано с docker-compose.base.yml: только limits.memory: 1G
resources:
  limits:
    memory: 1G

env_shared:
  NO_PROXY: "${NO_PROXY}"
  HTTP_PROXY: "${HTTP_PROXY}"
  HTTPS_PROXY: "${HTTPS_PROXY}"

env_requires:
  - HERMES_DASHBOARD_PASSWORD
