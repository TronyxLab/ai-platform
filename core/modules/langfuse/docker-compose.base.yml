# @purpose  Base compose definition for langfuse module — LLM Tracing
# GREP_SUMMARY: langfuse docker-compose langfuse llm-tracing profiles x-logging observability-net shared-db-net postgres clickhouse
# STRUCTURE: ▶ langfuse:3.212.0 [profiles:langfuse] → observability-net + shared-db-net → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for langfuse Docker module
## @scope    Merged with root docker-compose.yml via include:
## @invariants
##   - profiles: [langfuse] — pluggability: only included when COMPOSE_PROFILES contains langfuse
##   - 1.5GB memory limit for cold-start (423 Prisma + ClickHouse migrations)
##   - NODE_OPTIONS max-old-space-size=1024 to prevent OOM
##   - Headless initialization via LANGFUSE_INIT_* vars
##   - Healthcheck via /api/public/health on eth0 IP
##   - Networks declared as external: true — pre-created by deploy-modules.sh
## @rationale Profiles enable selective startup via `make up MODULES=langfuse`
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ── Langfuse (LLM Tracing) ───────────────────────────────────────────────
  # region service:langfuse
  langfuse:
    image: langfuse/langfuse:3.212.0@sha256:35461119756177199bf4412ceed03e0f637ca5c4a6b8b85d9e31c35e515e670d
    container_name: langfuse
    profiles: [langfuse]
    stop_signal: SIGTERM
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    logging: *default-logging

    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"

    environment:
      # Node.js heap limit — prevents OOM in Docker with cgroup memory limits
      NODE_OPTIONS: "--max-old-space-size=1024"

      # Listen on all interfaces (Langfuse v3 docs: HOSTNAME=0.0.0.0 for container access)
      HOSTNAME: "0.0.0.0"

      # Database — shared PostgreSQL
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:6432/langfuse?sslmode=disable"

      # Auth — must be set in .env
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://langfuse:3000}"
      SALT: "${SALT}"

      # Headless initialization
      LANGFUSE_INIT_ORG_ID: "${LANGFUSE_INIT_ORG_ID:-}"
      LANGFUSE_INIT_ORG_NAME: "AI-Platform"
      LANGFUSE_INIT_PROJECT_ID: "${LANGFUSE_INIT_PROJECT_ID:-}"
      LANGFUSE_INIT_PROJECT_NAME: "Default"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL:-admin@ai-platform.local}"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"

      # ClickHouse
      CLICKHOUSE_URL: "${CLICKHOUSE_URL:-http://clickhouse:8123}"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD}@clickhouse:9000"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # S3 event upload — Local MinIO for dev, override via SOPS for production
      # S3 event upload — Local MinIO for dev, override via SOPS for production
      # 🧐 TRAP[DECISION] · 2026-07-15 · — · S3 env chains via ${S3_*} vars
      # · Dev: MinIO container (minio:9000), bucket names via compose-interpolation
      # · Rev: if S3 provider changes or MinIO is removed, review all 6 chain variables
      #   (${S3_BUCKET:-platform-backups}/${LANGFUSE_S3_BUCKET:-langfuse-events}).
      #   Creds from ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-dummy}} chain.
      # · Prod: override via SOPS with Timeweb S3 endpoint — ALL 6 vars overridable
      #   because every value is a ${VAR:-default} chain.
      # · Rejected: literals (lrm SOPS-override, QAImplReport 010 QF-2)
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "${LANGFUSE_S3_BUCKET:-${S3_BUCKET:-local-dev}}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "${S3_ENDPOINT_URL:-}"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-dummy}}"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-dummy}}"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "${S3_REGION:-ru-1}"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "${LANGFUSE_S3_FORCE_PATH_STYLE:-true}"

      # Redis — event queue for ingestion pipeline (dedicated sidecar)
      REDIS_CONNECTION_STRING: "redis://langfuse-redis:6379"

      # Disable telemetry
      TELEMETRY_ENABLED: "false"

    networks:
      shared-db-net:
        aliases:
          - langfuse
      observability-net:
        aliases:
          - langfuse

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://$$(ip addr show eth0 | grep 'inet ' | awk '{print $$2}' | cut -d/ -f1):3000/api/public/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s
  # endregion service:langfuse

  # ── Langfuse Redis (event queue) ──────────────────────────────────────────
  # region service:langfuse-redis
  langfuse-redis:
    # 🧐 TRAP[DECISION] · 2026-07-16 · — · redis digest дублируется с core/modules/redis
    # · Rejected: вынос в platform-env.yaml env_defaults
    # · Reason: deferred, компенсируется gate'ом TASK-5 (discovery-based digest check)
    # · Rev: третья копия образа — пересмотреть вынос в единый источник
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: langfuse-redis
    profiles: [langfuse]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging: *default-logging
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      shared-db-net:
        aliases:
          - langfuse-redis
    volumes:
      - langfuse-redis-data:/data
  # endregion service:langfuse-redis

networks:
  observability-net:
    external: true
  shared-db-net:
    external: true

volumes:
  langfuse-redis-data:
    driver: local
