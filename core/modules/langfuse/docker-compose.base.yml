# @purpose  Base compose definition for langfuse module — LLM Tracing
# GREP_SUMMARY: langfuse docker-compose langfuse-worker llm-tracing profiles x-logging observability-net shared-db-net hermes-agent-net postgres clickhouse v4 encryption-key langfuse-redis noeviction redis-exporter queue
# STRUCTURE: ▶ langfuse:4.10.0 [profiles:langfuse] + langfuse-worker (v4: очереди) + langfuse-redis (noeviction) + langfuse-redis-exporter → observability-net + shared-db-net + hermes-agent-net → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for langfuse Docker module
## @scope    Merged with root docker-compose.yml via include:
## @invariants
##   - profiles: [langfuse] — pluggability: only included when COMPOSE_PROFILES contains langfuse
##   - 1.5GB memory limit for cold-start (423 Prisma + ClickHouse migrations)
##   - NODE_OPTIONS max-old-space-size=1024 to prevent OOM
##   - Headless initialization via LANGFUSE_INIT_* vars
##   - Healthcheck via /api/public/health on eth0 IP
##   - Networks declared as external: true — pre-created by deploy-modules.sh
##   - v4 (164 W1-5): web + worker — отдельные образы (langfuse/langfuse + langfuse-worker);
##     общий env-блок через YAML-якорь x-langfuse-env; ENCRYPTION_KEY — required (64 hex)
##   - Cross-node DSN (DevPlan 010 T2.7): DATABASE_URL @${POSTGRES_HOST:-pgbouncer}:6432,
##     CLICKHOUSE_MIGRATION_URL @${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_NATIVE_PORT:-9000};
##     single-node дефолты = Docker DNS (байт-идентично прежнему), worker наследует якорь
##   - REF-0010 (2026-08-24): langfuse-redis — ЕДИНСТВЕННАЯ реальная очередь платформы
##     (web→redis→worker) → noeviction (backlog НЕ выбрасывается молча; переполнение =
##     громкая ошибка записи, не тихая потеря трейсов); maxmemory 96mb при лимите 128M
##     (headroom ~25% на overhead/AOF-буфер, FAIL-0202: maxmemory != cgroup-лимит)
##   - REF-0010: langfuse-redis-exporter (второй redis_exporter instance) — очередь видима
##     Prometheus'у (redis_up/evicted_keys/memory), alert-rules в platform-alerts.yml
##   - REF-0017 (2026-08-25): hermes-agent-net членство web-сервиса — SoT placement
##     (platform-infra.yaml#provides.langfuse.networks) отражён в рантайме; аддитивный
##     attach, существующие сети не убраны (parity-гейт test_gate_provides_networks_parity)
## @rationale Profiles enable selective startup via `make up MODULES=langfuse`
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Общий env-контракт web + worker (v4: оба контейнера требуют идентичный набор переменных;
# YAML-якорь — единственный compose-нативный механизм дедупликации env-блоков).
# Cross-node DSN (DevPlan 010 T2.7): single-node — дефолты ниже (Docker DNS) = байт-идентично
# прежнему поведению; multi-node — provision/emission подставляет host data-ноды и CH native
# peer 19000 (S3: 10.8.0.11:19000 — сценарий S3 «data/agent/apps+obs», платформа-константа
# platform_ports.CLICKHOUSE_NATIVE_PEER; локальный CH native остаётся 9000).
x-langfuse-env: &langfuse-env
  # Node.js heap limit — prevents OOM in Docker with cgroup memory limits
  NODE_OPTIONS: "--max-old-space-size=1024"

  # Listen on all interfaces (Langfuse docs: HOSTNAME=0.0.0.0 for container access)
  HOSTNAME: "0.0.0.0"

  # Database — shared PostgreSQL
  # Cross-node: host параметризуется — single-node дефолт pgbouncer (Docker DNS),
  # multi-node provision подставляет host data-ноды.
  DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?PG_PASSWORD_REQUIRED}@${POSTGRES_HOST:-pgbouncer}:6432/langfuse?sslmode=disable"
  POSTGRES_HOST: "${POSTGRES_HOST:-pgbouncer}"

  # Auth — must be set in .env/SOPS
  NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
  NEXTAUTH_URL: "${NEXTAUTH_URL:-http://langfuse:3000}"
  SALT: "${SALT}"
  # v4 required: 64 hex (openssl rand -hex 32)
  ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY_REQUIRED}"

  # Headless initialization (web-контейнер)
  LANGFUSE_INIT_ORG_ID: "${LANGFUSE_INIT_ORG_ID:-}"
  LANGFUSE_INIT_ORG_NAME: "AI-Platform"
  LANGFUSE_INIT_PROJECT_ID: "${LANGFUSE_INIT_PROJECT_ID:-}"
  LANGFUSE_INIT_PROJECT_NAME: "Default"
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
  LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL:-admin@${PLATFORM_DOMAIN:-ai-platform.local}}"
  LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"

  # ClickHouse
  CLICKHOUSE_URL: "${CLICKHOUSE_URL:-http://clickhouse:8123}"
  # Cross-node CH native (DevPlan 010 T2.7 + TRAP §3): single-node — Docker DNS clickhouse:9000;
  # multi-node — provision подставляет host data-ноды и native peer 19000
  # (platform_ports.CLICKHOUSE_NATIVE_PEER; локальный native остаётся 9000).
  CLICKHOUSE_MIGRATION_URL: "clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:?CH_PASSWORD_REQUIRED}@${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_NATIVE_PORT:-9000}"
  CLICKHOUSE_HOST: "${CLICKHOUSE_HOST:-clickhouse}"
  CLICKHOUSE_NATIVE_PORT: "${CLICKHOUSE_NATIVE_PORT:-9000}"
  CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CH_PASSWORD_REQUIRED}"
  CLICKHOUSE_CLUSTER_ENABLED: "false"

  # S3 event upload — Local MinIO for dev, override via SOPS for production
  # Правило (дистилляция TRAP 2026-07-15, Rev сработал — MinIO выключен на нодах, 164 W0-3.5):
  # все 6 S3-переменных — ${VAR:-default} цепочки; каждая переопределима SOPS-ом.
  # Prod (minio disabled): SOPS ставит S3_ACCESS_KEY/S3_SECRET_KEY (Timeweb S3 endpoint),
  #   цепочка ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-dummy}} резолвится в SOPS-креды.
  # Dev (local stack, minio enabled): MINIO_ROOT_USER/MINIO_ROOT_PASSWORD.
  # Без SOPS-кредов и без minio → dummy-креды (загрузка событий деградирует, стек жив).
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "${LANGFUSE_S3_BUCKET:-${S3_BUCKET:-test-bucket}}"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "${S3_ENDPOINT_URL:-https://s3.timeweb.cloud}"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-dummy}}"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-dummy}}"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "${S3_REGION:-ru-1}"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "${LANGFUSE_S3_FORCE_PATH_STYLE:-true}"

  # Redis — event queue for ingestion pipeline (dedicated sidecar)
  REDIS_CONNECTION_STRING: "redis://langfuse-redis:6379"

  # Disable telemetry
  TELEMETRY_ENABLED: "false"

  # Security: disable public signup (audit 013 C1)
  AUTH_DISABLE_SIGNUP: "true"

services:

  # ── Langfuse web (LLM Tracing) ────────────────────────────────────────────
  # region service:langfuse
  langfuse:
    image: langfuse/langfuse:4.10.0@sha256:dd40428f7b13acaa17a194ae8c40638554fd497ad41ddc5f944775f83d4d4482
    container_name: langfuse
    profiles: [langfuse]
    stop_signal: SIGTERM
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
          pids: 256
    logging: *default-logging

    ports:
      # DevPlan 010 T2.2 (фасадные порты, §8 S3 «agent-1 → 3001 для IP apps-1»):
      # host ${LANGFUSE_PORT:-3001} → container 3000; peer-доступ режет ufw T2.3.
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${LANGFUSE_PORT:-3001}:3000"

    environment: *langfuse-env

    networks:
      shared-db-net:
        aliases:
          - langfuse
      observability-net:
        aliases:
          - langfuse
      # [IMP:9][langfuse-compose] REF-0017: SoT placement (platform-infra.yaml
      # provides.langfuse.networks) — hermes-agent tenants достигают tracing API по
      # выделенной agent-сети. Аддитивный attach; существующие сети НЕ убраны
      # (зависимости shared-db/observability согласуются отдельно).
      hermes-agent-net:
        aliases:
          - langfuse

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://$$(ip addr show eth0 | grep 'inet ' | awk '{print $$2}' | cut -d/ -f1):3000/api/public/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s  # 40→15s: Langfuse starts in 5-10s (standardized per DevPlan 083)
  # endregion service:langfuse

  # ── Langfuse Worker (v4: владеет очередями ingestion, отдельный образ) ─────
  # region service:langfuse-worker
  langfuse-worker:
    image: langfuse/langfuse-worker:4.10.0@sha256:efff982092fd301deb00d0014170d9602c89670bbb727014e9c1df9c6ed8bb3a
    container_name: langfuse-worker
    profiles: [langfuse]
    stop_signal: SIGTERM
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
          pids: 256
    logging: *default-logging

    environment: *langfuse-env

    networks:
      shared-db-net:
      observability-net:

    depends_on:
      langfuse:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3030/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
  # endregion service:langfuse-worker

  # ── Langfuse Redis (event queue) ──────────────────────────────────────────
  # region service:langfuse-redis
  langfuse-redis:
    # 🧐 TRAP[DECISION] · 2026-07-16 · — · redis digest дублируется с core/modules/redis
    # · Rejected: вынос в platform-env.yaml env_defaults
    # · Reason: deferred, компенсируется gate'ом TASK-5 (discovery-based digest check)
    # · Rev: третья копия образа — пересмотреть вынос в единый источник
    image: redis:8.8.1-alpine@sha256:465aff338d817971674ff1ec3c0d59182e2b687018e87bf94b6e1491d0bb79e2
    container_name: langfuse-redis
    profiles: [langfuse]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 256
        reservations:
          memory: 64M
    logging: *default-logging
    # [IMP:9][langfuse-compose] REF-0010 (FAIL-0200, 3-way eviction): единственная реальная
    # очередь платформы (web→redis→worker). allkeys-lru молча выбрасывал backlog при
    # 200-OK ingestion → потеря трейсов без сигнала. noeviction: переполнение = ОШИБКА
    # записи (громкий сигнал в worker-логах + алерт LangfuseQueueMemoryPressure),
    # НЕ тихая потеря данных. maxmemory 96mb при cgroup 128M — headroom на overhead.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 96mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s  # 10→15s: standardized per DevPlan 083 (default)
    networks:
      shared-db-net:
        aliases:
          - langfuse-redis
    volumes:
      - langfuse-redis-data:/data
  # endregion service:langfuse-redis

  # ── Langfuse Redis Exporter (REF-0010: очередь видима Prometheus'у) ────────
  # region service:langfuse-redis-exporter
  langfuse-redis-exporter:
    # Второй instance redis_exporter (первый — core/modules/service-exporters, cache).
    # Co-location с langfuse-redis (DevPlan 010 §3: exporter живёт со своим сервисом,
    # Docker DNS локален; multi-node S3: agent-1 с langfuse получает exporter автоматически).
    image: oliver006/redis_exporter:v1.88.0@sha256:ead15fa913b45314068b9237bb5eff1e97bcb41d63fbe6267befe34667b5f856
    container_name: langfuse-redis-exporter
    profiles: [langfuse]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Паритет с redis-exporter в service-exporters (164 W1-5): --version healthcheck-форк
          # = полный Go-процесс ~40M RSS → 64M мало в пике
          memory: 128M
          pids: 256
        reservations:
          memory: 64M
    logging: *default-logging

    # [IMP:8][langfuse-compose] REF-0010: langfuse-redis БЕЗ requirepass (внутренняя сеть
    # shared-db-net, flat-trust модель) — credentialed-env не требуется
    environment:
      REDIS_ADDR: "redis://langfuse-redis:6379"

    ports:
      # Host 9122 → container 9121 (9121 занят основным redis-exporter на общей ноде;
      # peer-scrape центральным Prometheus — T2.2/T2.4)
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${LANGFUSE_REDIS_EXPORTER_PORT:-9122}:9121"

    networks:
      observability-net:
        aliases:
          - langfuse-redis-exporter
      shared-db-net:
        aliases:
          - langfuse-redis-exporter

    # Liveness-only канон (--version; readiness внешний через up{} + alert-rules)
    # interval 15s — классификация гейта test_gate_healthcheck_intervals (redis-exporter класс)
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  # endregion service:langfuse-redis-exporter

networks:
  observability-net:
    external: true
    name: observability-net
  shared-db-net:
    external: true
    name: shared-db-net
  # REF-0017: аддитивное членство web-сервиса (SoT placement); сеть pre-created deploy-modules.sh
  hermes-agent-net:
    external: true
    name: hermes-agent-net
