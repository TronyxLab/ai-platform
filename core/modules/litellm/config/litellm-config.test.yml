# GREP_SUMMARY: litellm test config minimal no-model-list
# STRUCTURE: ▶ minimal-config → no-model-list → PostgreSQL → /health:200 → test-ready → ┘
# region MODULE_CONTRACT
## @purpose  Minimal LiteLLM config for tests — no model_list (avoids model provider validation)
## @scope    Overrides litellm-config.yml during component test runs on ALL platforms
##           (Linux CI + macOS Docker Desktop). Mounted via docker-compose.test.yml.
## @invariants
##   - No model_list — LiteLLM starts without model router (avoids BadRequestError)
##   - disable_auth_for_health_check: true works for internal Docker healthchecks only
##   - External /health requests require Authorization: Bearer {master_key}
## @rationale The production litellm-config.yml uses deepseek/deepseek-v4-pro which
##            litellm v1.91.2 rejects with BadRequestError. This test config has no
##            model_list so litellm starts without loading any model router.
##            /health returns 200 without models — sufficient for component tests.
# endregion MODULE_CONTRACT
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # PostgreSQL DATABASE_URL — spend_logs persistence via pgbouncer
  # The actual DSN is injected via DATABASE_URL env var in docker-compose.test.yml
  database_url: os.environ/DATABASE_URL
  json_logs: true
  debug: false
  # disable_auth_for_health_check — works only for internal Docker healthchecks (127.0.0.1 inside container)
  # External HTTP requests to /health require Authorization: Bearer {master_key}
  disable_auth_for_health_check: true

router_settings:
  num_retries: 3

litellm_settings:
  json_logs: true
  drop_params: true
  require_auth_for_metrics_endpoint: false
  disable_auth_for_health_check: true
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
