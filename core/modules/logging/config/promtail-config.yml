# GREP_SUMMARY: promtail config docker_sd_config journald journal-scrape structured_metadata nginx_match host-label backup-logs file-scrape compose_service log_file
# STRUCTURE: ▶ 3-scrape-configs ┌ docker_sd:container-logs → json→match(nginx:status/host)→labels→structured_metadata ┐ ┌ journal:journald→host-label→drop-debug ┐ ┌ backup-logs:static_config→file-glob→compose_service+log_file-labels ┐ → loki:3100 → ┘
# region MODULE_CONTRACT
## @purpose  Promtail configuration: Docker container log scraping (docker_sd) + host journald
##           scraping (journal) + backup-logs file scrape — закрывает 126 D-1 (journald → Loki)
##           и DevPlan 143 W1A (backup-logs file scrape → Loki stream {compose_service="backup-cron"}).
## @scope    Mounted as /etc/promtail/promtail-config.yml in promtail container
## @invariants
##   - Docker socket scrape: docker_sd_config — auto-discovers all local containers
##   - Journal scrape (DevPlan 132 W3, 126 D-1): journal {path: /var/log/journal, max_age: 24h};
##     host-лейбл из __journal__hostname; drop debug level (перф, max_age 24h)
##   - Backup-logs file scrape (DevPlan 143 W1A): static_config glob
##     /var/log/platform/backup/*.log → Loki stream {compose_service="backup-cron"}.
##     Маркер [IMP:9] BACKUP COMPLETE из файлов (cron `>> postgres.log`) попадает в Loki →
##     существующее alert-выражение BackupFreshness начинает работать БЕЗ изменений
##     (file-scrape несёт тот же лейбл compose_service="backup-cron"). Файлы остаются
##     персистентным следом (D-7, 142); promtail читает с offsets (positions.yaml).
##   - Nginx logs captured via Docker stdout (official image symlinks access.log → /dev/stdout)
##   - Nginx-specific JSON fields (status, request_method, host) extracted via match stage
##   - pipeline_stages: json → match(nginx,litellm,langfuse) → labels → structured_metadata
##   - session_id/user_id → structured_metadata (NOT labels — high cardinality, D7)
##   - Container labels preserved: container, compose_service, compose_project
##   - All logs sent to loki:3100 on observability-net
## @rationale D7: structured_metadata avoids TSDB index explosion from high-cardinality
##           fields while still enabling LogQL filtering without full JSON scan.
##           D-1 (126): journald (docker daemon, OOM, systemd) не попадал в Loki — добавлен
##           journal-скрейп; Storage=persistent обеспечивает кросс-бут данные (132 W3 D6).
##           143 W1A: архитектурный разрыв — cron пишет маркеры в файлы (crontab `>> *.log`),
##           а promtail скрейпил только docker stdout → BackupFreshness firing вечно.
##           File-scrape backup-logs несёт compose_service="backup-cron" → alert-expr не
##           меняется (D-1 канон переиспользования лейбла).
## @changes 2026-08-08 · DevPlan 143 W1A — добавлен backup-logs static_config file scrape
# endregion MODULE_CONTRACT

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Docker Container Logs (auto-discovery via Docker socket) ─────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: []

    # ⚠️ TRAP[DECISION] · 2026-06-28 · — · relaxed pipeline stages
    # · Complexity: JSON parsing is attempted on ALL container logs, including
    # ·   non-JSON logs (nginx error logs, etc.). Non-JSON lines fail the json
    # ·   Rev: if Promtail adds conditional pipeline stages, replace relaxed JSON parse
    # ·   stage silently (promtail treats parse failure as non-fatal) and pass
    # ·   through without labels/metadata extraction — they're still stored in
    # ·   Loki as plain text.
    # · Performance: parse failure per line adds ~microsecond overhead. At the
    # ·   log volume of this platform (< 100 lines/min), this is negligible.
    # · Rejected: adding a conditional JSON parse stage · Reason: Loki pipeline
    # ·   does NOT support if/else or try/catch. A `match` stage could be added
    # ·   per container label, but that creates 8+ identical config blocks.
    # ·   Single relaxed pipeline = simpler to maintain.
    pipeline_stages:
      # Stage 1: Parse JSON (non-JSON lines silently pass through)
      - json:
          expressions:
            level: level
            session_id: session_id
            user_id: user_id
            event: event
            service: service
            agent: agent
            project: project

      # Drop debug/trace logs from litellm container (TASK-7)
      - match:
          selector: '{compose_service="litellm"}'
          stages:
            - drop:
                source: level
                expression: "(?i)debug|trace"
      # Drop debug/trace logs from langfuse container (TASK-7)
      - match:
          selector: '{compose_service="langfuse"}'
          stages:
            - drop:
                source: level
                expression: "(?i)debug|trace"

      # Extract nginx access log fields from json_combined format (Docker stdout)
      # · nginx official image: /var/log/nginx/access.log → /dev/stdout symlink
      # · Docker json-file driver captures stdout → promtail reads via docker_sd
      # · json_combined log_format → all fields are valid JSON
      # · status/request_method/host → low-cardinality stream labels (~10 values each)
      # · request_time/upstream_addr/upstream_status → parsed but NOT promoted to labels
      # ·   (available as structured data for LogQL | json parser at query time)
      - match:
          selector: '{compose_service="nginx"}'
          stages:
            - json:
                expressions:
                  status: status
                  request_method: request_method
                  host: host
                  request_time: request_time
                  upstream_addr: upstream_addr
                  upstream_status: upstream_status
            - labels:
                status: ""
                request_method: ""
                host: ""

      # Stage 2: Extract low-cardinality fields as stream labels
      - labels:
          level: ""
          service: ""
          agent: ""
          project: ""

      # Stage 3: Extract high-cardinality fields as structured metadata (D7)
      #   structured_metadata is supported in Loki ≥2.9 — stores in separate index,
      #   does NOT cause cardinality explosion like stream labels would.
      - structured_metadata:
          session_id: ""
          user_id: ""

    # Container labels also copied to Loki labels for identification
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "(.+)"
        target_label: "compose_service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: "(.+)"
        target_label: "compose_project"

  # ── Host journald (docker daemon, OOM, systemd) — 126 D-1 / DevPlan 132 W3 ─────
  # · Скрейпит /var/log/journal (host mount, read-only); требует Storage=persistent
  #   в journald.conf (132 W3 D6 — иначе кросс-бут реконструкция невозможна)
  # · max_age 24h: ограничивает стартовое чтение при рестарте promtail (перф)
  # · host-лейбл из __journal__hostname (журнал хоста, не контейнеров)
  # · drop debug level — снижение объёма (docker-скрейп не трогаем)
  - job_name: journal
    journal:
      path: /var/log/journal
      max_age: 24h
    relabel_configs:
      - source_labels: ["__journal__hostname"]
        target_label: "host"
    pipeline_stages:
      - match:
          selector: '{job="journal"}'
          stages:
            - drop:
                source: level
                expression: "(?i)debug"

  # ── Backup logs file-scrape (DevPlan 143 W1A) ──────────────────────────
  # · Архитектурный разрыв D1 (142 восстановление): cron пишет маркеры
  #   [IMP:9] BACKUP COMPLETE в файлы (crontab `>> /var/log/platform/backup/*.log`),
  #   а promtail скрейпил ТОЛЬКО docker stdout → Loki не видел маркер →
  #   BackupFreshness firing вечно (count_over_time=0).
  # · Fix: static_config glob /var/log/platform/backup/*.log → Loki stream с
  #   labels {compose_service="backup-cron"} — существующее alert-выражение
  #   BackupFreshness (count_over_time({compose_service="backup-cron"} |~ "BACKUP COMPLETE" [26h]))
  #   начинает работать БЕЗ изменений (тот же лейбл).
  # · Том backup-logs монтируется в promtail как named-volume (root docker-compose.yml,
  #   SoT U-49): backup-logs:/var/log/platform/backup:ro.
  # · relabel __path__ → log_file: Loki-лейбл имени файла (postgres.log, app-data.log, ...)
  #   для детализации в LogQL без парсинга строки.
  # · Файлы остаются персистентным следом (D-7, 142) — promtail читает с offsets (positions.yaml).
  - job_name: backup-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: backup-logs
          compose_service: backup-cron
          __path__: /var/log/platform/backup/*.log
    relabel_configs:
      - source_labels: ["__path__"]
        regex: ".*/(.*)"
        target_label: "log_file"

  # ── Nginx access logs — REMOVED (2026-07-25) ──────────────────────────
  # · Was: static_config file scrape of /var/log/nginx/access.log from host
  # · Removed because: nginx official image symlinks access.log → /dev/stdout;
  # ·   Docker json-file driver captures stdout; promtail docker_sd scrape
  # ·   (job_name: docker above) handles nginx logs with compose_service="nginx"
  # ·   match stage extracting status/request_method/host as stream labels.
  # ·   No host-level log files needed — all through Docker logging pipeline.
