# GREP_SUMMARY: logging docker-compose test override container_name-test loki alloy backup-logs-test
# STRUCTURE: base.yml + test.yml → loki + alloy with -test suffix and shifted ports
# region MODULE_CONTRACT
## @purpose  Test override for logging — -test container_name for loki and alloy
## @scope    Only used in test fixtures. Never used in production.
## @invariants
##   - container_name: loki-test, alloy-test
##   - restart: "no" для всех контейнеров (тестовые контейнеры не auto-рестартуются)
##   - Loki port: 127.0.0.1:13100:3100
##   - Promtail no ports exposed (internal collector)
##   - Promtail-test rebind backup-logs → backup-logs-test (канон volume-rename U-62):
##     compose deep-merge не умеет удалять bind-тома → объявляется НОВЫЙ volume с суффиксом
##     -test (docker-managed, cross-platform macOS/CI) и сервис перепривязывается к нему.
## @rationale Стандартный test-overlay контракт (DevPlan 04 DD2).
## @changes  2026-08-08 · DevPlan 143 W1A — promtail-test rebind backup-logs-test (file-scrape)
## @changes  2026-08-13 · DevPlan 164 W1-5 — promtail→Alloy: alloy-test + alloy-data-test + config.alloy
# endregion MODULE_CONTRACT

services:
  loki:
    container_name: loki-test
    networks: !override  # DevPlan 017 W2.5 — test network isolation
      - test-observability-net
    ports: !override  # ⚠️ TRAP[BUG] · 2026-07-18 · HIGH · compose merge склеивает ports base+test → тестовый loki биндит 3100 (F-7) · Fix: !override
      - "127.0.0.1:13100:3100"
    restart: "no"

  alloy:
    container_name: alloy-test
    networks: !override  # DevPlan 017 W2.5 — test network isolation
      - test-observability-net
    # DevPlan 143 W1A: rebind backup-logs → backup-logs-test (канон volume-rename U-62).
    # Volumes перечислены полностью (!override семантика compose для list-values: список
    # заменяется целиком). config.alloy mount оставлен (нужен для работы), docker.sock/
    # journal/machine-id — host-литералы (системные, как в base.yml), backup-logs-test —
    # docker-managed volume (cross-platform, без bind-mount на macOS), alloy-data-test —
    # WAL storage (U-62 rename-канон).
    volumes: !override
      # Проектная директория compose = репо-root (первый -f — root compose): ./ от корня
      # (короткий синтаксис без ./-префикса трактуется как named-volume)
      - ./core/modules/logging/config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - backup-logs-test:/var/log/platform/backup:ro
      - alloy-data-test:/var/lib/alloy/data
    restart: "no"

networks:
  test-observability-net:
    external: true

volumes:
  # DevPlan 143 W1A (канон volume-rename U-62): backup-logs-test — docker-managed volume
  # для alloy-test file-scrape. Если backup-cron test-overlay уже объявил backup-logs-test
  # в этом compose-стеке — deep-merge идемпотентен (driver: local совпадёт).
  backup-logs-test:
    driver: local
  # 164 W1-5: alloy-data-test — WAL storage Alloy (U-62 rename-канон)
  alloy-data-test:
    driver: local
