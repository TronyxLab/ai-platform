# GREP_SUMMARY: logging module loki logs observability-net promtail-eol tenant-auth
# STRUCTURE: ▶ module:logging → loki:3.7.6 (singleton) → observability-net → ┐
# region MODULE_CONTRACT
## @purpose  Loki log storage — singleton-хранилище логов контекста (DevPlan 010 T2.0b/T3.1)
## @scope    Log aggregation (Loki filesystem storage); коллектор Alloy выделен в log-collector
## @invariants
##   - install_type: docker — managed by compose
##   - Loki: scratch image, 3.7.6, filesystem storage with compactor
##   - ⚠️ DevPlan 010 T3.1: Alloy УДАЛЁН из logging (→ core/modules/log-collector, all-nodes);
##     Loki остаётся ЕДИНСТВЕННЫМ сервисом модуля (singleton-хранилище)
##   - Tenant-изоляция (T2.0b): auth_enabled: true в loki-config.yml; tenant из X-Scope-OrgID
##     (LOKI_TENANT от alloy/grafana/vhost; дефолт "platform")
##   - Loki port 3100 on localhost only
## @rationale Split из observability module (Phase 3 D1); выделение log-collector — DevPlan 010 §3:
##            singleton-хранилище (logging) ≠ all-nodes коллектор (log-collector)
## @changes — 2026-08-09 | DevPlan 144 W3 — resources.limits.memory 384M → 640M (loki 256M→512M)
## @changes — 2026-08-13 | DevPlan 164 W1-5 — promtail→Alloy (EOL REPLACE)
## @changes — 2026-08-22 | DevPlan 010 T3.1 — Alloy удалён (→ log-collector): resources 768M→512M
## @changes — 2026-08-22 | DevPlan 010 T2.0b — auth_enabled: true (tenant-изоляция)
# endregion MODULE_CONTRACT

name: logging
install_type: docker
description: "Loki log storage (singleton) — platform logging store (promtail EOL; collector in log-collector)"

depends_on: []

# D5 (118 G4): severity/restart — логи, non-critical; restart согласован с base.yml (loki unless-stopped)
severity: normal
restart: unless-stopped

interfaces:
  - healthcheck

spool_dir: /var/lib/platform/loki-data
spool_volume: loki-data

resources:
  # Синхронизировано с docker-compose.base.yml (DevPlan 144 W3; 010 T3.1: alloy ушёл):
  # единственный сервис модуля — loki 512M (256M→512M, факт. потребление 216MiB — 91.3% лимита).
  limits:
    memory: 512M
  reservations:
    memory: 128M

env_requires: []
