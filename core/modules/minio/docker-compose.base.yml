# @purpose  Base compose definition for minio — official minio/minio image, loopback-only ports
# GREP_SUMMARY: minio docker-compose local-s3 backup-net shared-db-net observability-net hermes-agent-net loopback-127001 one-shot-createbuckets prometheus-anonymous-metrics
# STRUCTURE: ▶ minio:RELEASE → backup-net + shared-db-net + observability-net (metrics) + hermes-agent-net → healthcheck /dev/tcp:9000 → one-shot mc createbuckets → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for minio — official minio/minio RELEASE image, loopback-only ports
## @scope    Local S3 for backup-cron (backup-net) and langfuse (shared-db-net); two services: minio + minio-createbuckets
## @invariants
##   - Ports: 127.0.0.1:${MINIO_PORT:-9000}:9000 (S3 API) + 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001 — loopback ONLY
##   - Networks: backup-net + shared-db-net + observability-net (REF-0010: scrape-доступ
##     центрального Prometheus к /minio/v2/metrics/cluster; аддитивный attach — external:true)
##   - Networks: hermes-agent-net (REF-0017: SoT placement provides.minio.networks —
##     agent-plane фасад S3; аддитивный attach, существующие сети не убраны)
##   - MINIO_PROMETHEUS_ANONYMOUS_ACCESS=on (REF-0010): метрики без bearer-токена — плоская
##     внутренняя сеть, flat-trust модель (P3 п.16); секрет в prometheus.yml.tmpl потребовал бы
##     расширения envsubst-канала config-init (вне скоупа REF-0010)
##   - restart: unless-stopped (minio), restart: "no" (minio-createbuckets — one-shot)
##   - Healthcheck (minio): bash /dev/tcp to port 9000
##   - Healthcheck (minio-createbuckets): disable: true — one-shot exits after work
##   - Container name: minio
##   - Profiles: [minio] on both services
## @rationale MinIO serves as local S3 for backup-cron and langfuse event upload.
##   REF-0010: observability-net членство делает minio job в prometheus.yml.tmpl
##   резолвимым (иначе static/file_sd target молча down).
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  minio:
    # 🧐 TRAP[DECISION] · 2026-07-15 · HI · Pinned RELEASE tag (verified 2026-07-15 via Docker Hub API)
    # · Rejected: :latest (platform pinning policy); @sha256 digest (project convention: tag-pin only)
    # · Old tag RELEASE.2025-02-07T23-41-23Z confirmed 404 (community releases stopped 2025-09)
    # · Pin digest == :latest digest at pin time → zero runtime change
    # · Rev: pin to a semver or RELEASE tag if MinIO publishes stable tagged versions.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: minio
    profiles: [minio]
    restart: unless-stopped
    ports:
      # DevPlan 010 T2.2: API 9000 — кросс-нодово пирам (SERVICE_BIND_HOST); console 9001 —
      # только loopback (админ-UI не публикуется даже в multi-node)
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      backup-net:
        aliases:
          - minio
      shared-db-net:
        aliases:
          - minio
      # [IMP:8][minio-compose] REF-0010: scrape-доступ центрального Prometheus (job "minio",
      # file_sd nodes/minio.json); аддитивный attach — external:true, ничего не убираем
      observability-net:
        aliases:
          - minio
      # [IMP:9][minio-compose] REF-0017: SoT placement (platform-infra.yaml
      # provides.minio.networks) — agent-plane фасад S3. Аддитивный attach; текущие сети
      # НЕ убраны (миграция потребителей с shared-db-net — отдельное согласование).
      hermes-agent-net:
        aliases:
          - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_BROWSER: "on"
      # [IMP:9][minio-compose] REF-0010 (FAIL-1002): метрики кластера анонимно — иначе
      # scrape требует bearer-токен (mc admin prometheus generate), которого в
      # prometheus-config-init envsubst-канале нет → job молча down. Внутренние сети,
      # flat-trust (P3 п.16); порт 9000 наружу не публикуется сверх T2.2-биндинга.
      MINIO_PROMETHEUS_ANONYMOUS_ACCESS: "on"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Канон 164 W1-4: start_period 30s — документированное исключение (верхняя граница
      # канона; minio поднимает server + heals данные перед здоровым состоянием)
      start_period: 30s
    volumes:
      - minio-data:/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
        reservations:
          memory: 256M

  minio-createbuckets:
    # 🧐 TRAP[DECISION] · 2026-07-15 · HI · mc pinned RELEASE tag — same policy as minio/minio
    # · Tag RELEASE.2025-08-13T08-35-41Z verified via Docker Hub API 2026-07-15
    # · digest == :latest at pin time
    # · Rev: pin to a semver or RELEASE tag if MinIO publishes stable tagged versions
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [minio]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 256
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      S3_BUCKET: "${S3_BUCKET:-test-bucket}"
      LANGFUSE_S3_BUCKET: "${LANGFUSE_S3_BUCKET:-langfuse-events}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && \
        mc mb --ignore-existing local/$${S3_BUCKET} && \
        mc mb --ignore-existing local/$${LANGFUSE_S3_BUCKET}
    networks:
      - backup-net
      - shared-db-net
    logging: *default-logging

networks:
  backup-net:
    external: true
    name: backup-net
  shared-db-net:
    external: true
    name: shared-db-net
  # REF-0010: аддитивное членство (scrape-доступ Prometheus); сеть pre-created deploy-modules.sh
  observability-net:
    external: true
    name: observability-net
  # REF-0017: аддитивное членство (SoT placement agent-plane фасад); pre-created deploy-modules.sh
  hermes-agent-net:
    external: true
    name: hermes-agent-net
