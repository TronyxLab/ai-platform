# GREP_SUMMARY: prometheus alert rules ServiceDown HighMemoryUsage HighCPUUsage
# STRUCTURE: ▶ global:rules → per-project template → $PROJECT substitution → /opt/prometheus/rules/ → ┘
# region MODULE_CONTRACT
## @purpose  Prometheus native alerting rules for per-project monitoring
## @scope    Generated per-project post-deploy (receive verb → monitoring_config_renderer.py)
##           $PROJECT placeholder is substituted at generation time
## @invariants
##   - Three base rules: ServiceDown, HighMemoryUsage, HighCPUUsage
##   - All rules label alerts with project=$PROJECT for routing
##   - Rules use PromQL expressions compatible with cAdvisor + node_exporter metrics
## @rationale Native Prometheus rules (not Grafana) enable alerting even when Grafana is down.
##           Rules are generated per-project so each project's alerts are independent.
##           Grafana alerting (in config/alerting/) is the secondary path for dashboard-facing alerts.
# endregion MODULE_CONTRACT
# ⚠️ TRAP[DECISION] · 2026-07-02 · — · Per-project rule files vs single consolidated file
# ·   Chose per-project rule files (/opt/prometheus/rules/<project>-alerts.yml) for:
# ·   - Independent lifecycle per project (add/remove without touching other rules)
# ·   - Clear ownership — each project knows its own alert rules
# ·   - Simpler template substitution (single $PROJECT variable)
# ·   Rev: if project count exceeds 100, reconsider single vs per-project rule files
# ·   Rejected: single consolidated file — merge conflicts when adding/removing projects
# ·   Rejected: relabel-based routing from one rule set — doesn't scale with 10+ projects

groups:
  - name: "${PROJECT}-alerts"
    interval: 30s
    rules:
      # ── ServiceDown ──────────────────────────────────────────────────────────
      # 🔴 Triggers when a project's metrics target disappears for >2 minutes
      - alert: "${PROJECT}ServiceDown"
        expr: "up{project=\"${PROJECT}\"} == 0"
        for: "2m"
        labels:
          severity: "critical"
          project: "${PROJECT}"
        annotations:
          summary: "Service {{ $labels.job }} is down (project: ${PROJECT})"
          description: "Prometheus target {{ $labels.instance }} for project ${PROJECT} has been unreachable for over 2 minutes."

      # ── HighMemoryUsage ──────────────────────────────────────────────────────
      # 🟡 Triggers when a container in this project exceeds 90% memory limit for >5 minutes
      - alert: "${PROJECT}HighMemoryUsage"
        expr: "container_memory_usage_bytes{compose_project=\"${PROJECT}\"} / container_spec_memory_limit_bytes{compose_project=\"${PROJECT}\"} > 0.9"
        for: "5m"
        labels:
          severity: "warning"
          project: "${PROJECT}"
        annotations:
          summary: "Container {{ $labels.container }} memory > 90% (project: ${PROJECT})"
          description: "Memory usage for container {{ $labels.container }} in project ${PROJECT} exceeds 90% for more than 5 minutes."

      # ── HighCPUUsage ─────────────────────────────────────────────────────────
      # 🟡 Triggers when a container in this project exceeds 0.9 CPU cores for >5 minutes
      - alert: "${PROJECT}HighCPUUsage"
        expr: "rate(container_cpu_usage_seconds_total{compose_project=\"${PROJECT}\"}[5m]) > 0.9"
        for: "5m"
        labels:
          severity: "warning"
          project: "${PROJECT}"
        annotations:
          summary: "Container {{ $labels.container }} CPU usage > 0.9 (project: ${PROJECT})"
          description: "CPU usage for container {{ $labels.container }} in project ${PROJECT} exceeds 0.9 cores for more than 5 minutes."
