# Grafana Dashboard vhost — proxy_pass to Docker-DNS service (grafana:3000)
# GREP_SUMMARY: nginx grafana vhost proxy_pass websocket tls wildcard-cert subdomain docker-dns
# STRUCTURE: HTTP(redirect) → HTTPS(ssl + set $upstream_grafana + proxy_pass $upstream_grafana + WS upgrade)
# region MODULE_CONTRACT
## @purpose  Expose Grafana at https://grafana.${PLATFORM_DOMAIN}/ via nginx reverse proxy
## @scope    Deployed conditionally when observability module is enabled in node.yaml;
##           uses same wildcard TLS certificate as main platform vhost;
##           forwards to Grafana HTTP API on grafana:3000 via Docker-DNS (auth handled by Grafana built-in).
## @invariants
##   - Only deployed when observability module is enabled in node.yaml
##   - Uses ${PLATFORM_DOMAIN} placeholder — substituted by sed at deploy time
##   - SSL settings identical to platform-default.conf (inline, no external includes)
##   - WebSocket upgrade headers forwarded for live dashboard updates
##   - Does NOT add Basic Auth — Grafana provides its own auth layer (D4)
##   - proxy_buffering off — Grafana UI sends SSE (Server-Sent Events) for live updates
## @rationale Grafana has mature built-in authentication (D4); Nginx Basic Auth would duplicate
##           and complicate credential management. Unified via GF_SECURITY_ADMIN_USER/PASSWORD.
# endregion MODULE_CONTRACT

# ⚠️ TRAP[BUG] · 2026-07-16 · HI · НЕ заменять ${PLATFORM_DOMAIN} на $host (D12: nginx не интерполирует переменные в server_name — vhost-роутинг ломается)
# · Рендер плейсхолдера: Docker — envsubst-templates (/etc/nginx/templates/*.conf.template, см. docker-compose.base.yml), system — sed в install.sh

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grafana.${PLATFORM_DOMAIN};

    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge (DNS-01 handled by acme.sh; HTTP-01 for verification)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
}

# ── HTTPS: Grafana reverse proxy ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.${PLATFORM_DOMAIN};

    # ── SSL configuration ───────────────────────────────────────────────────
    include /etc/nginx/conf.d/ssl-params.conf;

    # ── Proxy headers ──────────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # ── WebSocket upgrade support (for live dashboard updates) ─────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";

    # ── SSE support — disable buffering for live-updating panels ───────────
    proxy_buffering off;
    proxy_cache off;

    # ── Proxy timeouts ─────────────────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    # SSE cap 300s (REF-0015): 3600s держал worker-слот 1 час на каждый открытый дашборд —
    # дешёвый connection-exhaustion вектор; Grafana live-reconnect переподнимает поток сам.
    proxy_read_timeout    300s;

    # ── Security headers ───────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ── Rate limiting (dynamic zone: 10 r/s, burst 20) ─────────────────────
    limit_req zone=dynamic burst=20 nodelay;
    limit_req_status 429;

    # ── Main location: proxy to Grafana (docker-dns: grafana:3000) ─────────
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · loopback→Docker-DNS (см. config/nginx.conf)
    location / {
        set $upstream_grafana ${UPSTREAM_GRAFANA};
        proxy_pass http://$upstream_grafana;
    }
}
