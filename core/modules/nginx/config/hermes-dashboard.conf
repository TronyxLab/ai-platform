# Hermes Dashboard vhost — proxy_pass to Docker-DNS service (hermes-agent:9119)
# GREP_SUMMARY: nginx hermes dashboard vhost proxy_pass websocket tls wildcard-cert subdomain docker-dns
# STRUCTURE: HTTP(redirect) → HTTPS(ssl + set $upstream_hermes + proxy_pass $upstream_hermes + WS upgrade)
# region MODULE_CONTRACT
## @purpose  Expose Hermes Agent dashboard at https://hermes.${PLATFORM_DOMAIN}/ via nginx reverse proxy
## @scope    Deployed conditionally (PLATFORM_HERMES_ENABLED) during nginx/install.sh;
##           uses same wildcard TLS certificate as main platform vhost;
##           forwards to Hermes Agent HTTP API on hermes-agent:9119 via Docker-DNS (Basic Auth handled by backend).
## @invariants
##   - Only deployed when hermes-agent module is enabled in node.yaml
##   - Uses ${PLATFORM_DOMAIN} placeholder — substituted by sed at deploy time
##   - SSL settings identical to platform-default.conf (inline, no external includes)
##   - WebSocket upgrade headers forwarded for potential dashboard HMR/WS
##   - Does NOT add Basic Auth — Hermes Agent provides its own auth layer
## @rationale Hermes Agent dashboard should not be publicly exposed without TLS;
##           wildcard certificate *.${PLATFORM_DOMAIN} already covers hermes subdomain.
# endregion MODULE_CONTRACT

# ── Conditional WebSocket upgrade — only set Connection: upgrade when client requests upgrade ──
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ⚠️ TRAP[BUG] · 2026-07-16 · HI · НЕ заменять ${PLATFORM_DOMAIN} на $host (D12: nginx не интерполирует переменные в server_name — vhost-роутинг ломается)
# · Рендер плейсхолдера: Docker — envsubst-templates (/etc/nginx/templates/*.conf.template, см. docker-compose.base.yml), system — sed в install.sh

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hermes.${PLATFORM_DOMAIN};

    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge (DNS-01 handled by acme.sh; HTTP-01 for verification)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
}

# ── HTTPS: Hermes Dashboard reverse proxy ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hermes.${PLATFORM_DOMAIN};

    # ── SSL configuration ───────────────────────────────────────────────────
    include /etc/nginx/conf.d/ssl-params.conf;

    # ── Proxy headers ──────────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # ── WebSocket upgrade support (for dashboard HMR/WS) ───────────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    # ── Proxy timeouts ─────────────────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Security headers ───────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ── Rate limiting (dynamic zone: 10 r/s, burst 20) ─────────────────────
    limit_req zone=dynamic burst=20 nodelay;
    limit_req_status 429;

    # ── Main location: proxy to Hermes Dashboard (docker-dns: hermes-agent:9119) ──
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · loopback→Docker-DNS (см. config/nginx.conf)
    location / {
        set $upstream_hermes hermes-agent:9119;
        proxy_pass http://$upstream_hermes;
    }

    # ── Auth login fallback: ensure ?provider=basic is set ─────────────────
    # ⚠️ TRAP[BUG] · 2026-07-18 · MED · Audit 013 M3: /auth/login 422 without ?provider
    # · Symptom: GET / (unauthenticated) → 302 /auth/login (no provider) → 422
    # · Root: Upstream dashboard config has dashboard.oauth.client_id: '' (empty string,
    # ·   not absent). Upstream interprets this as "OAuth configured" → ≥2 providers detected
    # ·   → redirect omits ?provider= (relies on login page to choose). But /auth/login
    # ·   FastAPI endpoint requires provider query param → 422.
    # · Fix: nginx intercept for exact /auth/login with empty args → 302 with ?provider=basic.
    # ·   Non-empty args proxy through to upstream normally.
    # · Rev: when upstream dashboard properly handles empty-strings-as-disabled config
    # ·   or PR #60978 fully resolves provider detection — remove this intercept.
    location = /auth/login {
        if ($args = '') {
            return 302 https://$host/auth/login?provider=basic;
        }
        set $upstream_hermes hermes-agent:9119;
        proxy_pass http://$upstream_hermes;
    }
}
