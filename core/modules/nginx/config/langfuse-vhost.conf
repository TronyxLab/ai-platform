# Langfuse LLM Tracing vhost — proxy_pass to Docker-DNS service (langfuse:3000)
# GREP_SUMMARY: nginx langfuse vhost proxy_pass websocket tls wildcard-cert subdomain llm-tracing docker-dns
# STRUCTURE: HTTP(redirect) → HTTPS(ssl + set $upstream_langfuse + proxy_pass $upstream_langfuse + WS upgrade)
# region MODULE_CONTRACT
## @purpose  Expose Langfuse at https://langfuse.${PLATFORM_DOMAIN}/ via nginx reverse proxy
## @scope    Deployed conditionally when observability module (langfuse service) is enabled;
##           uses same wildcard TLS certificate as main platform vhost;
##           forwards to Langfuse HTTP API on langfuse:3000 via Docker-DNS (auth handled by Langfuse built-in).
## @invariants
##   - Only deployed when observability module is enabled in node.yaml
##   - Uses ${PLATFORM_DOMAIN} placeholder — substituted by sed at deploy time
##   - SSL settings identical to platform-default.conf (inline, no external includes)
##   - WebSocket upgrade headers forwarded
##   - Does NOT add Basic Auth — Langfuse provides its own auth layer
##   - proxy_buffering off — Langfuse UI may use SSE
## @rationale Langfuse has built-in authentication; Nginx Basic Auth would duplicate
##           and complicate credential management. Unified credentials set via
##           LANGFUSE_INIT_USER_PASSWORD (first run) or DB update (migration).
# endregion MODULE_CONTRACT

# ⚠️ TRAP[BUG] · 2026-07-16 · HI · НЕ заменять ${PLATFORM_DOMAIN} на $host (D12: nginx не интерполирует переменные в server_name — vhost-роутинг ломается)
# · Рендер плейсхолдера: Docker — envsubst-templates (/etc/nginx/templates/*.conf.template, см. docker-compose.base.yml), system — sed в install.sh

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name langfuse.${PLATFORM_DOMAIN};

    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge (DNS-01 handled by acme.sh; HTTP-01 for verification)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
}

# ── HTTPS: Langfuse reverse proxy ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name langfuse.${PLATFORM_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${PLATFORM_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PLATFORM_DOMAIN}/privkey.pem;

    # ── SSL configuration (inline — matches platform-default.conf) ──────────
    ssl_session_cache    shared:le_nginx_SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ── Proxy headers ──────────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # ── WebSocket upgrade support ───────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";

    # ── SSE support — disable buffering for live-updating panels ───────────
    proxy_buffering off;
    proxy_cache off;

    # ── Proxy timeouts ─────────────────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    3600s;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN always;

    # ── Main location: proxy to Langfuse (docker-dns: langfuse:3000) ────────
    # ⚠️ container port 3000 ← host publishes 3001→3000; Docker-DNS target MUST be :3000
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · loopback→Docker-DNS (см. config/nginx.conf)
    location / {
        set $upstream_langfuse langfuse:3000;
        proxy_pass http://$upstream_langfuse;
    }
}
