# Loki vhost — proxy_pass to Docker-DNS service (loki:3100) with HTTP Basic Auth
# GREP_SUMMARY: nginx loki vhost proxy_pass tls wildcard-cert subdomain basic-auth monitoring docker-dns
# STRUCTURE: HTTP(redirect) → HTTPS(ssl + auth_basic + set $upstream_loki + proxy_pass $upstream_loki)
# region MODULE_CONTRACT
## @purpose  Expose Loki at https://loki.${PLATFORM_DOMAIN}/ via nginx reverse proxy
## @scope    Deployed conditionally when observability module is enabled in node.yaml;
##           uses same wildcard TLS certificate as main platform vhost;
##           forwards to Loki HTTP API on loki:3100 via Docker-DNS.
## @invariants
##   - Only deployed when observability module is enabled in node.yaml
##   - Uses ${PLATFORM_DOMAIN} placeholder — substituted by sed at deploy time
##   - SSL settings identical to platform-default.conf (inline, no external includes)
##   - HTTP Basic Auth required — Loki has no built-in auth layer
##   - .htpasswd-platform file managed by secrets.sh (_ensure_htpasswd_generated), shared with Prometheus
##   - No WebSocket upgrade (Loki HTTP API is REST-based)
##   - Standard proxy buffering (no SSE) — standard buffering is fine
## @rationale Loki does not provide built-in authentication; HTTP Basic Auth
##           at the nginx layer is the simplest secure access control. The same
##           .htpasswd-platform file can be shared with Prometheus and status-page for unified
##           credential management via PLATFORM_MASTER_EMAIL/PASSWORD.
# endregion MODULE_CONTRACT

# ⚠️ TRAP[BUG] · 2026-07-16 · HI · НЕ заменять ${PLATFORM_DOMAIN} на $host (D12: nginx не интерполирует переменные в server_name — vhost-роутинг ломается)
# · Рендер плейсхолдера: Docker — envsubst-templates (/etc/nginx/templates/*.conf.template, см. docker-compose.base.yml), system — sed в install.sh

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name loki.${PLATFORM_DOMAIN};

    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge (DNS-01 handled by acme.sh; HTTP-01 for verification)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
}

# ── HTTPS: Loki reverse proxy ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loki.${PLATFORM_DOMAIN};

    # ── SSL configuration ───────────────────────────────────────────────────
    include /etc/nginx/conf.d/ssl-params.conf;

    # ── Proxy headers ──────────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    # [IMP:8][nginx-loki] DevPlan 010 T2.0b: Loki auth_enabled:true — каждый запрос
    # обязан нести tenant header; значение рендерится envsubst из compose env
    # LOKI_TENANT (дефолт "platform" единый по стеку).
    proxy_set_header X-Scope-OrgID      ${LOKI_TENANT};

    # ── Proxy timeouts (standard) ──────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Security headers ───────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ── Rate limiting (dynamic zone: 10 r/s, burst 20) ─────────────────────
    limit_req zone=dynamic burst=20 nodelay;
    limit_req_status 429;

    # ── Main location: Basic Auth + proxy to Loki (docker-dns: loki:3100) ──
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · loopback→Docker-DNS (см. config/nginx.conf)
    # ⚠️ TRAP[DECISION] · 2026-07-20 · MED · htpasswd-monitoring → htpasswd-platform (016 master creds unification)
    location / {
        auth_basic "Platform";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-platform;

        set $upstream_loki loki:3100;
        proxy_pass http://$upstream_loki;
    }
}
