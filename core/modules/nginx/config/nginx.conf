# 🧐 TRAP[BUG] · 2026-07-10 · — · nginx:1.27-alpine image uses 'nginx' user, not 'www-data'
# ·   Debian-based nginx images have www-data; Alpine-based have nginx.
# ·   The compose file specifies nginx:1.27-alpine, so config must match.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # ⚠️ TRAP[DECISION] · 2026-07-18 · LOW · Audit 013 L1: `Server: nginx` header remains (only version hidden)
    # · Rejected: ngx_headers_more (`more_clear_headers Server`) — requires forking the digest-pinned official nginx:alpine image
    # · Reason: hiding the product name has negligible security value (behavioral fingerprinting trivially identifies nginx)
    # · Rev: revisit if platform moves to a custom-built nginx image for other reasons
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # JSON log format for structured log ingestion (Promtail → Loki)
    # @purpose Machine-parseable JSON access logs for observability stack.
    #   Used by Promtail static_config file scrape of /var/log/nginx/access.log.
    #   Enables LogQL filtering by status code, upstream, request_time without JSON parsing at query time.
    # @invariants
    #   - All values are quoted JSON strings (safe for any character)
    #   - Includes request_time (float seconds) for latency analysis
    #   - Includes upstream_addr for backend routing diagnostics
    #   - Compatible with promtail-config.yml json pipeline_stage
    # @rationale JSON logs eliminate the need for regex parsing in Promtail pipeline,
    #   reducing CPU overhead on log ingestion and enabling precise latency/location metrics.
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"request_length":$request_length,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host",'
        '"request_method":"$request_method",'
        '"server_protocol":"$server_protocol"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ⚠️ TRAP[DECISION] · 2026-07-18 · HI · Security headers moved from http block to per-vhost include
    # · Root: nginx add_header inheritance — a server block with ANY add_header REPLACES (not merges)
    # ·   all http-level add_header directives. This caused HSTS/CSP/Referrer-Policy loss on infra vhosts
    # ·   (langfuse, grafana, prometheus) that had their own X-Frame-Options (audit 013 M2).
    # · Fix: security-headers.conf included in every server block — consistent policy, no inheritance trap.
    # · Rev: if nginx ever merges add_header across levels, revert to http-level + remove per-vhost includes.

    # ── Rate Limiting (audit 013 H5) ────────────────────────────────────────
    # Two-tier: assets zone for static content (JS/CSS/images), dynamic zone for API/pages.
    # $binary_remote_addr = compact IPv4/IPv6 binary key (4 bytes for IPv4, 16 for IPv6)
    limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=dynamic:10m rate=10r/s;

    # Docker DNS resolver for runtime upstream resolution
    # @rationale nginx resolves upstream hostnames at config load time by default.
    #   In Docker, services may not be ready when nginx starts -> host not found ->
    #   nginx refuses to start. Using resolver 127.0.0.11 (Docker embedded DNS) +
    #   variables in proxy_pass defers resolution to request time.
    #   Ref: dev-config/nginx.conf TRAP[DECISION] 2026-07-12 for the same rationale.
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · 502 on all vhosts — loopback→Docker-DNS
    # · Symptom: 502 on all vhosts (grafana, prometheus, loki, langfuse, hermes-dashboard)
    # · Root: vhosts kept `proxy_pass http://127.0.0.1:*` from the pre-Docker (system apt nginx)
    #   era — loopback inside the container is empty (no service listens there)
    # · Fix: Docker-DNS service names via deferred-resolution variables (set $upstream_X svc:port;
    #   + resolver) — see each vhost for individual replacements
    # · Prevention: tests/test_nginx_upstream_validity.py forbids loopback targets
    #
    # resolver 127.0.0.11 — Docker embedded DNS for runtime upstream resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 📝 TRAP[DEBT] · 2026-07-16 · MED · dual mechanism: config/ и dev-config/ дублируют vhost-топологию
    # · Observed: два набора одного знания (vhost-топология: service name + port mapping)
    # · Suspected: нужен единый envsubst-шаблонный набор (templates → envsubst per-environment)
    # · Impact: дрифт наборов — правка в одном не применяется к другому
    # · When: during 502 vhost fix

    # Include vhosts
    include /etc/nginx/conf.d/*.conf;

    # Overlay includes — mounted from NGINX_OVERLAY_DIR on host
    # @contract Overlay files are plain *.conf (NOT .conf.template), mounted directly
    #   into /etc/nginx/conf.d/overlay/ via docker volume.
    #   - MUST use exact server_name (e.g. server_name tronyx.ru;)
    #   - MUST NOT declare default_server (conflicts with platform-default.conf)
    #   - No envsubst applied — domain is hardcoded by the operator
    #   - Precedence: overlay include AFTER main conf.d include + exact match wins
    #     over default_server fallback in nginx server selection
    include /etc/nginx/conf.d/overlay/*.conf;

    # ── Stub Status (Prometheus nginx-exporter) (DD2) ──
    # @rationale listen 8081 (all interfaces) — nginx-prometheus-exporter uses Docker DNS
    #   to scrape http://nginx:8081/stub_status. The old listen 127.0.0.1:8081 only
    #   worked with host.docker.internal. Now both containers are on observability-net,
    #   so nginx must listen on the container's network IP, not just loopback.
    #   Allow rules: 127.0.0.1 (localhost inside container), ::1, 172.0.0.0/8 (Docker bridge).
    server {
        listen 8081;
        server_name localhost;

        location /stub_status {
            stub_status on;
            allow 127.0.0.1;
            allow ::1;
            allow 172.0.0.0/8;  # Docker bridge
            deny all;
        }

        access_log off;
        error_log /dev/null crit;
    }
}
