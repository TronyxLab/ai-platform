# GREP_SUMMARY: nginx config json-combined-access-log worker-rlimit-nofile log-format proxy-net vhost-includes security-headers
# STRUCTURE: ▶ main ctx (user/worker_processes/rlimit/pid) → events (worker_connections 1024) → http (sendfile/log_format json_combined/access_log/gzip/security-headers include/client-timeouts 10s/10s/30s/15s + limit_conn perip 20) → server blocks (vhost includes, proxy-pass) → ⎋
# region MODULE_CONTRACT
## @purpose  Production nginx main config: JSON access log (json_combined — promtail/Loki 5xx-алерт,
##           DevPlan 162 W6-3), worker_rlimit_nofile 65535 (162 W8-2), vhost-include архитектура
##           (все server-блоки через includes, security-headers.conf в каждом).
## @scope    Монтируется в контейнер nginx (config/nginx.conf); dev-override — dev-config/nginx.conf.
## @invariants
##   - json_combined: "status":$status — число (не строка) → promtail json-парсит в label status
##   - worker_rlimit_nofile 65535 — снимает FD-потолок soft nofile 1024 (W8-2)
##   - user nginx (Alpine-образ, TRAP[BUG] ниже)
## @rationale  Единый production-конфиг; JSON-логи — machine-parseable для observability-стека
##             (Loki-правила nginx_5xx_errors читают status-лейбл).
## @changes  2026-08-13 | DevPlan 162 W8-2 — worker_rlimit_nofile 65535 (потолок соединений)
## @changes  2026-08-25 | REF-0015 (DevPlan 11 В2) — resource guards: client_header/body_timeout
##           10s, send_timeout 30s, keepalive_timeout 15s (slowloris); limit_conn_zone + perip 20
# endregion MODULE_CONTRACT

# 🧐 TRAP[BUG] · 2026-07-10 · — · nginx:1.27-alpine image uses 'nginx' user, not 'www-data'
# ·   Debian-based nginx images have www-data; Alpine-based have nginx.
# ·   The compose file specifies nginx:1.27-alpine, so config must match.
user nginx;
worker_processes auto;
# DevPlan 162 W8-2: worker_rlimit_nofile 65535 — потолок worker_connections 1024 при soft
# nofile 1024 (~1024 соединений); поднятие rlimit снимает FD-потолок на worker.
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # ── Client timeouts (REF-0015, SEC-0045 slowloris-hardening) ────────────────
    # Один nginx на ВСЕ vhosts (worker_connections 1024): медленные клиенты без таймаутов
    # держат слоты часами → 2-4k соединений исчерпывают пул = ALL vhosts down.
    # header/body 10s — заголовки/тело запроса обязаны прийти быстро; send_timeout —
    # пауза между двумя последовательными write'ами к клиенту; keepalive 15s —
    # переиспользование соединения ограничено (65s держал слоты впустую).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    # ⚠️ TRAP[DECISION] · 2026-07-18 · LOW · Audit 013 L1: `Server: nginx` header remains (only version hidden)
    # · Rejected: ngx_headers_more (`more_clear_headers Server`) — requires forking the digest-pinned official nginx:alpine image
    # · Reason: hiding the product name has negligible security value (behavioral fingerprinting trivially identifies nginx)
    # · Rev: revisit if platform moves to a custom-built nginx image for other reasons
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # JSON log format for structured log ingestion (Promtail → Loki)
    # @purpose Machine-parseable JSON access logs for observability stack.
    #   Used by Promtail static_config file scrape of /var/log/nginx/access.log.
    #   Enables LogQL filtering by status code, upstream, request_time without JSON parsing at query time.
    # @invariants
    #   - All values are quoted JSON strings (safe for any character)
    #   - Includes request_time (float seconds) for latency analysis
    #   - Includes upstream_addr for backend routing diagnostics
    #   - Compatible with promtail-config.yml json pipeline_stage
    # @rationale JSON logs eliminate the need for regex parsing in Promtail pipeline,
    #   reducing CPU overhead on log ingestion and enabling precise latency/location metrics.
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"request_length":$request_length,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host",'
        '"request_method":"$request_method",'
        '"server_protocol":"$server_protocol"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ⚠️ TRAP[DECISION] · 2026-07-18 · HI · Security headers moved from http block to per-vhost include
    # · Root: nginx add_header inheritance — a server block with ANY add_header REPLACES (not merges)
    # ·   all http-level add_header directives. This caused HSTS/CSP/Referrer-Policy loss on infra vhosts
    # ·   (langfuse, grafana, prometheus) that had their own X-Frame-Options (audit 013 M2).
    # · Fix: security-headers.conf included in every server block — consistent policy, no inheritance trap.
    # · Rev: if nginx ever merges add_header across levels, revert to http-level + remove per-vhost includes.

    # ── Rate Limiting (audit 013 H5) ────────────────────────────────────────
    # Two-tier: assets zone for static content (JS/CSS/images), dynamic zone for API/pages.
    # $binary_remote_addr = compact IPv4/IPv6 binary key (4 bytes for IPv4, 16 for IPv6)
    limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=dynamic:10m rate=10r/s;

    # ── Connection limiting per IP (REF-0015, SEC-0045) ─────────────────────
    # limit_conn на http-уровне наследуется ВСЕМИ server-блоками (vhosts + project overlays).
    # 🧐 TRAP[DECISION] · 2026-08-25 · — · perip 20 на http-уровне vs per-server директива в каждом vhost ·
    # · Rejected: дублировать limit_conn в каждом vhost-шаблоне/рендере (vhost_renderer.py,
    # ·   add-vhost.sh) — N мест синхронизации, новый vhost без строки = дыра
    # · Reason: http-level наследование покрывает ВСЕ существующие и будущие vhosts одной
    # ·   строкой; SSE/websocket легитимно держит несколько долгих соединений на вкладку —
    # ·   20 на IP достаточно с запасом, при этом slowloris-ферма с одного адреса упирается
    # ·   в потолок задолго до исчерпания worker_connections.
    # · Rev: если появится легитимный клиент >20 параллельных соединений с одного IP
    # ·   (корпоративный NAT) — поднять зону или завести исключение отдельной zone'ой.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 20;

    # Docker DNS resolver for runtime upstream resolution
    # @rationale nginx resolves upstream hostnames at config load time by default.
    #   In Docker, services may not be ready when nginx starts -> host not found ->
    #   nginx refuses to start. Using resolver 127.0.0.11 (Docker embedded DNS) +
    #   variables in proxy_pass defers resolution to request time.
    #   Ref: dev-config/nginx.conf TRAP[DECISION] 2026-07-12 for the same rationale.
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · 502 on all vhosts — loopback→Docker-DNS
    # · Symptom: 502 on all vhosts (grafana, prometheus, loki, langfuse, hermes-dashboard)
    # · Root: vhosts kept `proxy_pass http://127.0.0.1:*` from the pre-Docker (system apt nginx)
    #   era — loopback inside the container is empty (no service listens there)
    # · Fix: Docker-DNS service names via deferred-resolution variables (set $upstream_X svc:port;
    #   + resolver) — see each vhost for individual replacements
    # · Prevention: tests/test_nginx_upstream_validity.py forbids loopback targets
    #
    # resolver 127.0.0.11 — Docker embedded DNS for runtime upstream resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 🧐 TRAP[DECISION] · 2026-07-16 · MED · dual mechanism config/ vs dev-config/ — ЯВНЫЙ KEEP (128 W5)
    # · Observed: два набора vhost-конфигов (config/ — production TLS, dev-config/ — dev HTTP).
    # · Rejected: консолидация в один envsubst-шаблон (dev-config → config параметризация)
    # · Reason: наборы структурно РАЗНЫЕ — production vhost 81-102 LOC (HTTP→HTTPS redirect,
    #   ACME-challenge locations, wildcard/LE cert paths, http2), dev vhost 30 LOC (HTTP only,
    #   self-signed/локальные домены). nginx server-блоки не условны — единый шаблон потребовал
    #   бы ДВА прохода рендера (prod/dev), т.е. те же два файла; экономия ≈ 0 LOC при связывании
    #   prod-серт-путей с dev. Общая топология (service:port) уже governed VHOST_CONTRACT +
    #   vhost_renderer.py (проекты в обоих режимах, DevPlan 121 RC dev-режим).
    # · Rev: когда dev-стек перейдёт на TLS ИЛИ появится единый механизм рендера двух окружений —
    #   консолидировать (решение по объёму: dev-config 295 LOC vs config 803 LOC).
    # Include vhosts
    include /etc/nginx/conf.d/*.conf;

    # Overlay includes — mounted from NGINX_OVERLAY_DIR on host
    # @contract Overlay files are plain *.conf (NOT .conf.template), mounted directly
    #   into /etc/nginx/conf.d/overlay/ via docker volume.
    #   - MUST use exact server_name (e.g. server_name tronyx.ru;)
    #   - MUST NOT declare default_server (conflicts with platform-default.conf)
    #   - No envsubst applied — domain is hardcoded by the operator
    #   - Precedence: overlay include AFTER main conf.d include + exact match wins
    #     over default_server fallback in nginx server selection
    include /etc/nginx/conf.d/overlay/*.conf;

    # ── Stub Status (Prometheus nginx-exporter) (DD2) ──
    # @rationale listen 8081 (all interfaces) — nginx-prometheus-exporter uses Docker DNS
    #   to scrape http://nginx:8081/stub_status. The old listen 127.0.0.1:8081 only
    #   worked with host.docker.internal. Now both containers are on observability-net,
    #   so nginx must listen on the container's network IP, not just loopback.
    #   Allow rules: 127.0.0.1 (localhost inside container), ::1, 172.0.0.0/8 (Docker bridge).
    server {
        listen 8081;
        server_name localhost;

        location /stub_status {
            stub_status on;
            allow 127.0.0.1;
            allow ::1;
            allow 172.0.0.0/8;  # Docker bridge
            deny all;
        }

        access_log off;
        error_log /dev/null crit;
    }
}
