# Platform HTTP-only vhost — used before TLS certificate is issued
# GREP_SUMMARY: nginx http-only pre-cert static-root error-pages
# This file is managed by core; do NOT edit manually.
# Deployed on first bootstrap before acme.sh obtains the TLS certificate.
# After wildcard cert is issued, replaced by platform-default.conf (full HTTPS config).
#
# ⚠️ TRAP[BUG] · 2026-06-07 · HI · HTTPS-блок с ssl_certificate на несуществующий файл вызывает nginx -t FAIL
# · При первом деплое сертификата ещё нет — HTTPS-блок с ssl_certificate на
# · несуществующий файл вызывает nginx -t FAIL. Поэтому сначала деплоим HTTP-only
# · конфиг, получаем сертификат через acme.sh DNS-01, затем заменяем на полный HTTPS-конфиг.

server {
    # 🧐 TRAP[BUG] · 2026-07-10 · — · NOT default_server — platform-default.conf claims port 80 default
    # ·   In Docker Compose context, both files are mounted simultaneously.
    # ·   platform-default.conf has the HTTP→HTTPS redirect as default_server.
    # ·   This file is the fallback when platform-default.conf is not deployed (pre-TLS bootstrap).
    # ·   Only one default_server per port is allowed.
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/platform-default;
    index index.html;

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /var/www/platform-default/error-pages;
        internal;
    }

    location = /50x.html {
        root /var/www/platform-default/error-pages;
        internal;
    }

    # Default catch-all
    location / {
        try_files $uri $uri/ =404;
    }

    # ACME challenge (DNS-01 handled by acme.sh; HTTP-01 for verification)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
}
