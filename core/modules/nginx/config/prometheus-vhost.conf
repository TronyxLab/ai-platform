# Prometheus vhost — proxy_pass to Docker-DNS service (prometheus:9090) with HTTP Basic Auth
# GREP_SUMMARY: nginx prometheus vhost proxy_pass tls wildcard-cert subdomain basic-auth monitoring docker-dns
# STRUCTURE: HTTP(redirect) → HTTPS(ssl + auth_basic + set $upstream_prometheus + proxy_pass $upstream_prometheus)
# region MODULE_CONTRACT
## @purpose  Expose Prometheus at https://prometheus.${PLATFORM_DOMAIN}/ via nginx reverse proxy
## @scope    Deployed conditionally when observability module is enabled in node.yaml;
##           uses same wildcard TLS certificate as main platform vhost;
##           forwards to Prometheus HTTP API on prometheus:9090 via Docker-DNS.
## @invariants
##   - Only deployed when observability module is enabled in node.yaml
##   - Uses ${PLATFORM_DOMAIN} placeholder — substituted by sed at deploy time
##   - SSL settings identical to platform-default.conf (inline, no external includes)
##   - HTTP Basic Auth required — Prometheus has no built-in auth layer
##   - .htpasswd-monitoring file managed externally (htpasswd utility)
##   - No WebSocket upgrade (Prometheus API is HTTP-only)
##   - Standard proxy buffering (no SSE) — standard buffering is fine
## @rationale Prometheus does not provide built-in authentication; HTTP Basic Auth
##           at the nginx layer is the simplest secure access control. The same
##           .htpasswd-monitoring file can be shared with Loki.
# endregion MODULE_CONTRACT

# ⚠️ TRAP[BUG] · 2026-07-16 · HI · НЕ заменять ${PLATFORM_DOMAIN} на $host (D12: nginx не интерполирует переменные в server_name — vhost-роутинг ломается)
# · Рендер плейсхолдера: Docker — envsubst-templates (/etc/nginx/templates/*.conf.template, см. docker-compose.base.yml), system — sed в install.sh

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name prometheus.${PLATFORM_DOMAIN};

    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge (DNS-01 handled by acme.sh; HTTP-01 for verification)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
}

# ── HTTPS: Prometheus reverse proxy ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prometheus.${PLATFORM_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${PLATFORM_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PLATFORM_DOMAIN}/privkey.pem;

    # ── SSL configuration (inline — matches platform-default.conf) ──────────
    ssl_session_cache    shared:le_nginx_SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ── Proxy headers ──────────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # ── Proxy timeouts (standard) ──────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN always;

    # ── Main location: Basic Auth + proxy to Prometheus (docker-dns: prometheus:9090) ──
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · loopback→Docker-DNS (см. config/nginx.conf)
    location / {
        auth_basic "Monitoring";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-monitoring;

        set $upstream_prometheus prometheus:9090;
        proxy_pass http://$upstream_prometheus;
    }
}
