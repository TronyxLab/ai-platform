# Security headers — single policy for all vhosts
# GREP_SUMMARY: nginx security-headers CSP HSTS X-Frame-Options Permissions-Policy Referrer-Policy X-Content-Type-Options
# region SECURITY_HEADERS
## @purpose  Single source of truth for HTTP security headers. Included in every vhost server block.
## @scope    All platform nginx vhosts (config/*.conf, dev-config/*.conf, overlay project vhosts).
## @invariants
##   - MUST be included inside a server block (not http block) due to nginx add_header inheritance
##   - CSP in enforce mode (not Report-Only) — switched from Phase 1 after 7-day monitoring (audit 013 H3)
##   - X-XSS-Protection REMOVED — deprecated since 2019, CSP covers XSS (audit 013 L2)
##   - Permissions-Policy restricts camera/microphone/geolocation by default (audit 013 H4)
##   - X-Frame-Options: DENY (strictest). If a service needs framing, override in its vhost.
## @rationale Centralizing headers eliminates header duplication (audit 013 M2) and the nginx add_header
##           inheritance gotcha: a server block with ANY add_header replaces ALL parent http-level add_header.
##           Including this file in every server block guarantees consistent security posture.
## @changes 2026-07-18 · audit 013 · Initial creation.
# endregion SECURITY_HEADERS

# ── CSP: enforce mode (was Report-Only before audit 013) ──────────────────
# unsafe-inline/unsafe-eval retained for SPA compatibility.
# TODO: migrate to nonce/hash-based CSP after SPA code audit.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# ── HSTS — enforce HTTPS for 1 year, all subdomains, browser preload ──────
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ── Frame protection — prevent clickjacking ───────────────────────────────
add_header X-Frame-Options DENY always;

# ── MIME sniffing protection ──────────────────────────────────────────────
add_header X-Content-Type-Options nosniff always;

# ── Referrer policy — limit referrer leakage to same origin ───────────────
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Permissions-Policy — restrict browser features by default ─────────────
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
