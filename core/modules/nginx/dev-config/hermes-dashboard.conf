# Hermes Dashboard dev vhost — HTTP only, no TLS
# @purpose  Proxy requests to Hermes Agent Dashboard
# TRAP[DECISION] 2026-07-12 — $upstream_hermes variable defers DNS resolution
# Rev: if architecture invalidates this decision
server {
    listen 80;
    listen 443 ssl;
    include /etc/nginx/ssl-dev.conf;
    http2 on;
    server_name ~^hermes\.[a-z0-9-]+\.local$;
    # @rationale Regex покрывает базовый ai-platform.local и любой context.local (DD7 DevPlan 012).
    #   Без envsubst — nginx не расширяет env в conf. Конвергенция в envsubst-шаблоны —
    #   существующий TRAP[DEBT] в config/nginx.conf, расширение scope запрещено.

    # ── Security headers ───────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ── Rate limiting (dynamic zone: 10 r/s, burst 20) ─────────────────────
    limit_req zone=dynamic burst=20 nodelay;
    limit_req_status 429;

    # ── Main location: proxy to Hermes Dashboard (docker-dns: hermes-agent:9119) ──
    location / {
        set $upstream_hermes hermes-agent:9119;
        proxy_pass http://$upstream_hermes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Auth login fallback: ensure ?provider=basic is set ─────────────────
    # ⚠️ TRAP[BUG] · 2026-07-18 · MED · Audit 013 M3: /auth/login 422 without ?provider
    # · Symptom: GET / (unauthenticated) → 302 /auth/login (no provider) → 422
    # · Root: Upstream dashboard config has dashboard.oauth.client_id: '' (empty string,
    # ·   not absent). Upstream interprets this as "OAuth configured" → ≥2 providers
    # ·   → redirect omits ?provider= (login page should choose). But /auth/login
    # ·   FastAPI endpoint requires provider query param → 422.
    # · Fix: nginx intercept for exact /auth/login with empty args → 302 with ?provider=basic.
    # ·   Non-empty args proxy through to upstream normally.
    # · Rev: when upstream dashboard properly handles empty-strings-as-disabled config
    # ·   or PR #60978 fully resolves provider detection — remove this intercept.
    location = /auth/login {
        if ($args = '') {
            return 302 https://$host/auth/login?provider=basic;
        }
        set $upstream_hermes hermes-agent:9119;
        proxy_pass http://$upstream_hermes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
