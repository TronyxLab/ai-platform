# Langfuse dev vhost — HTTP only, no TLS
# @purpose  Proxy requests to Langfuse UI
# TRAP[DECISION] 2026-07-12 — $upstream_langfuse variable defers DNS resolution
# Nginx resolves hostnames at config load; Docker services may be down at startup.
# Using set + resolver 127.0.0.11 forces runtime DNS resolution via Docker embedded DNS.
# Rev: if architecture invalidates this decision
server {
    listen 80;
    listen 443 ssl;
    include /etc/nginx/ssl-dev.conf;
    http2 on;
    server_name ~^langfuse\.[a-z0-9-]+\.local$;
    # @rationale Regex покрывает базовый ai-platform.local и любой context.local (DD7 DevPlan 012).
    #   Без envsubst — nginx не расширяет env в conf. Конвергенция в envsubst-шаблоны —
    #   существующий TRAP[DEBT] в config/nginx.conf, расширение scope запрещено.

    # ── Security headers ───────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ── Rate limiting (dynamic zone: 10 r/s, burst 20) ─────────────────────
    limit_req zone=dynamic burst=20 nodelay;
    limit_req_status 429;

    location / {
        set $upstream_langfuse langfuse:3000;
        proxy_pass http://$upstream_langfuse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
