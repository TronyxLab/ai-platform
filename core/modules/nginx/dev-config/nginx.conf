# GREP_SUMMARY: nginx dev-config http-only static-server no-tls
# @purpose  Dev-mode nginx config — HTTP-only, static files, no TLS
# @scope    Used via docker-compose.dev.yml (dev-override поверх config/, DevPlan 116 D3)
# @invariants
#   - user nginx (Alpine-compatible)
#   - No SSL blocks (no certs needed)
#   - Ports 80 only (443 not used in dev)
#   - Services accessible on their own published ports
user nginx;
worker_processes auto;
# DevPlan 162 W8-2: worker_rlimit_nofile 65535 — потолок worker_connections 1024 при soft
# nofile 1024; dev-конфиг повторяет канон config/nginx.conf (W8-2).
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # ⚠️ TRAP[DECISION] · 2026-07-18 · LOW · Audit 013 L1: `Server: nginx` header remains (only version hidden)
    # · Rejected: ngx_headers_more (`more_clear_headers Server`) — requires forking the digest-pinned official nginx:alpine image
    # · Reason: hiding the product name has negligible security value (behavioral fingerprinting trivially identifies nginx)
    # · Rev: revisit if platform moves to a custom-built nginx image for other reasons
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting (audit 013 H5)
    # Two-tier: assets for static, dynamic for API/pages
    limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=dynamic:10m rate=10r/s;

    # ⚠️ TRAP[DECISION] 2026-07-12 — Docker DNS resolver for runtime upstream resolution
    # nginx resolves upstream hostnames at config load time by default. In Docker,
    # services may not be ready when nginx starts -> host not found -> nginx refuses to start.
    # Rev: if Docker changes embedded DNS IP, update to match
    # Using resolver 127.0.0.11 (Docker embedded DNS) + variables in proxy_pass defers
    # resolution to request time. If upstream is still not ready, nginx starts anyway
    # and returns 502 until upstream becomes available.
    # Rejected: startup-order with depends_on — brittle, doesn't handle restarts
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
