# GREP_SUMMARY: nginx dev-default http-only catch-all
# @purpose  Dev-mode default vhost — HTTP-only catch-all, no TLS, static files
# @scope    Used when NGINX_CONF_DIR=./dev-config
# @rationale Local dev: all services accessible on published ports (localhost:3000 etc).
#           No need for TLS or subdomain routing. Nginx serves as a simple HTTP server
#           for the default static page and health check endpoint.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    include /etc/nginx/ssl-dev.conf;
    http2 on;
    server_name _;

    root /var/www/platform-default;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /var/www/platform-default/error-pages;
        internal;
    }

    location = /50x.html {
        root /var/www/platform-default/error-pages;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Security headers ───────────────────────────────────────────────────
    include /etc/nginx/includes/security-headers.conf;

    # ── Rate limiting (dynamic zone: 10 r/s, burst 20) ─────────────────────
    limit_req zone=dynamic burst=20 nodelay;
    limit_req_status 429;
}
