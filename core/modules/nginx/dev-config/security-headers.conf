# Security headers — single policy for all vhosts (dev mode)
# GREP_SUMMARY: nginx security-headers CSP HSTS X-Frame-Options Permissions-Policy Referrer-Policy X-Content-Type-Options dev
# This file is identical to config/security-headers.conf — see that file for full documentation.
# @changes 2026-07-18 · audit 013 · Created as dev copy of config/security-headers.conf.

# ── CSP: enforce mode ────────────────────────────────────────────────────
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# ── HSTS — enforce HTTPS for 1 year, all subdomains, browser preload ──────
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ── Frame protection — prevent clickjacking ───────────────────────────────
add_header X-Frame-Options DENY always;

# ── MIME sniffing protection ──────────────────────────────────────────────
add_header X-Content-Type-Options nosniff always;

# ── Referrer policy — limit referrer leakage to same origin ───────────────
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Permissions-Policy — restrict browser features by default ─────────────
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
