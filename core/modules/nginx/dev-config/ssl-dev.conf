# ssl-dev.conf — shared SSL settings for dev vhosts (self-signed mkcert)
# @purpose  Include from each dev vhost server block to avoid SSL cert path duplication
# @scope    Only used with NGINX_CONF_DIR=./dev-config (local dev mode)
# @invariants
#   - Must be included inside a server { } block that has listen 443 ssl;
#   - Cert paths point to /etc/nginx/dev-certs/ (mounted from ./dev-certs/)
#   - Self-signed by mkcert, trusted only locally
# ⚠️ TRAP[BUG] · 2026-07-16 · MED · dev-серты были невоспроизводимы — 443 Connection reset вне машины владельца
# · Symptom: свежий клон/CI: dev-certs/ пуст (gitignored) → nginx -t FAIL / 443 reset
# · Root: mkcert запускался вручную один раз (волна T5.7); генерация не автоматизирована; SAN не обновлён после смены доменной схемы
# · Fix: dev_cert_generator.py — идемпотентная генерация, wildcard SAN из доменной схемы (PLATFORM_DOMAIN)
# · Prevention: хук в make up + смоук-фикстура + tests/test_nginx_dev_certs.py
ssl_certificate     /etc/nginx/dev-certs/fullchain.pem;
ssl_certificate_key /etc/nginx/dev-certs/privkey.pem;
ssl_session_cache    shared:dev_ssl:10m;
ssl_session_timeout  1d;
ssl_protocols        TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
