# @purpose  Dev-mode compose override for nginx module — dev-config files OVER config/ (DevPlan 116 D3)
# GREP_SUMMARY: nginx docker-compose.dev.yml dev-mode override dev-config ssl-dev dev-certs
# STRUCTURE: base.yml (NGINX_CONF_DIR=./config) + dev.yml → override dev-отличающиеся файлы поверх config/ → dev-режим явный opt-in
# region MODULE_CONTRACT
## @purpose  Dev-mode override for nginx — mounts dev-config files OVER config/ (explicit opt-in, DevPlan 116 D3)
## @scope    Local dev only: `docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up`
## @invariants
##   - NGINX_CONF_DIR default = ./config (SoT) — dev-режим НЕ через NGINX_CONF_DIR, а через этот override-файл
##   - Каждый файл dev-config обязан быть смонтирован здесь (правило: файлы config/, не переопределённые
##     в dev.yml, монтируются base.yml автоматически — dev.yml перекрывает только dev-отличающиеся)
##   - dev-certs + ssl-dev.conf перенесены сюда из base.yml (dev-only, не должны быть в prod-базе)
##   - dev-config vhost'ы используют server_name regex ~^<svc>\.[a-z0-9-]+\.local$ (HTTP-only, ssl-dev.conf)
##   - 0 дублей с config/: dev-config содержит только файлы, реально отличающиеся от config/ (U-46)
## @rationale Прод-дефолт NGINX_CONF_DIR=./dev-config уводил ноду в HTTP-only без TLS (U-46).
##   Dev-режим становится явным opt-in через compose-оверрайд — prod-конфиг никогда не заимствует dev-файлы.
# endregion MODULE_CONTRACT

services:
  nginx:
    volumes:
      # ── Dev-отличающиеся файлы (override поверх config/ из base.yml) ──
      - ./dev-config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dev-config/platform-default.conf.template:/etc/nginx/templates/platform-default.conf.template:ro
      - ./dev-config/platform-http.conf:/etc/nginx/templates/platform-http.conf.template:ro
      - ./dev-config/grafana-vhost.conf:/etc/nginx/templates/grafana-vhost.conf.template:ro
      - ./dev-config/hermes-dashboard.conf:/etc/nginx/templates/hermes-dashboard.conf.template:ro
      - ./dev-config/langfuse-vhost.conf:/etc/nginx/templates/langfuse-vhost.conf.template:ro
      - ./dev-config/loki-vhost.conf:/etc/nginx/templates/loki-vhost.conf.template:ro
      - ./dev-config/prometheus-vhost.conf:/etc/nginx/templates/prometheus-vhost.conf.template:ro
      # ── Dev SSL (mounted outside conf.d/ to avoid auto-load) ──
      - ./dev-config/ssl-dev.conf:/etc/nginx/ssl-dev.conf:ro
      # ── Dev TLS certs (mkcert, генерируются dev_cert_generator.py) ──
      - ./dev-certs:/etc/nginx/dev-certs:ro
