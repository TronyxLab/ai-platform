<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center;
    }
    .container { max-width: 520px; padding: 2rem; }
    .code {
      font-size: 6rem; font-weight: 800; color: #58a6ff;
      line-height: 1; margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; color: #f0f6fc; margin-bottom: 1rem; }
    p { color: #8b949e; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <p><a href="/">&larr; Back to home</a></p>
  </div>
</body>
</html>
