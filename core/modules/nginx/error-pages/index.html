<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform Node</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center;
    }
    .container { max-width: 520px; padding: 2rem; }
    .badge {
      display: inline-block;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      color: #3fb950; background: rgba(63,185,80,0.12);
      border: 1px solid rgba(63,185,80,0.3);
      padding: 0.3em 0.8em; border-radius: 2em;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.8rem; font-weight: 700; color: #f0f6fc; margin-bottom: 0.75rem; }
    p { color: #8b949e; font-size: 0.95rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Operational</div>
    <h1>Platform Node</h1>
    <p>This server is running and accepting connections.<br>Application services are being deployed.</p>
  </div>
</body>
</html>
