# OAuth-code page vhost — login.asiteam.ru (пилот managers-bot, блок C4/A3)
# GREP_SUMMARY: nginx overlay vhost login asiteam oauth code page bitrix24 authorize inline static no-backend
# STRUCTURE: ▶ HTTP:80 ┌acme-challenge | else→301 HTTPS┐ → ⊕ HTTPS:443 ssl-params(wildcard *.asiteam.ru) → ◇ = /oauth/code → ⎋ return 200 инлайн-HTML (JS читает ?code/?error из query Б24)
# region MODULE_CONTRACT
## @purpose  Страница показа OAuth-кода для local-приложения Битрикс24 (D3/A3): после авторизации
##           Б24 редиректит менеджера на redirect_uri с code в query; страница показывает код
##           крупно и даёт кнопку копирования — менеджер вставляет его в бот (/code в TG).
## @scope    САМОДОСТАТОЧНЫЙ overlay-вхост: инлайн-ответ nginx, НЕ требует бэкенда, монтирований
##           статики и правок репозитория платформы. Активация на ноде: положить файл в
##           NGINX_OVERLAY_DIR (по умолчанию ./overlays) и reload nginx.
## @invariants
##   - Точный server_name login.asiteam.ru (overlay-правило платформы; НЕ default_server)
##   - Внутри return-строки ЗАПРЕЩЁН символ доллара: nginx интерполирует свои переменные
##     в return-тексте; envsubst тут не при чём (overlay не шаблонизируется)
##   - Код отображается ТОЛЬКО из query владельца сессии браузера; страница не пишет в сеть
##     (navigator.clipboard — локальный буфер), секрет code уходит менеджером в TG самому себе
##   - TLS: include /etc/nginx/conf.d/ssl-params.conf — wildcard-серт *.asiteam.ru платформы;
##     отдельный выпуск сертификата НЕ нужен
## @rationale Q: почему инлайн-return, а не root+static или proxy_pass? A: overlay-механика
##           платформы монтирует только conf.d; статике нужен volume (правка base compose
##           модуля = правка чужого репо), бэкенда под страницу нет и не нужен — контент
##           целиком клиентский. Один дроп-ин закрывает C4-страницу без релиза платформы.
## @usecases поток /login → authorize-ссылка Б24 (src/entrypoints/tg.ts), вставка кода /code
# endregion MODULE_CONTRACT

# ── HTTP: ACME challenge + redirect на HTTPS ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name login.asiteam.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://login.asiteam.ru$request_uri;
    }
}

# ── HTTPS: страница показа кода ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name login.asiteam.ru;

    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/includes/security-headers.conf;

    # Инлайн-страница: одна строка, ограничена ОДНОКРАЙНЫМИ кавычками (внутри — только двойные),
    # без символа доллара (см. @invariants).
    location = /oauth/code {
        default_type text/html;
        add_header Cache-Control 'no-store';
        return 200 '<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>Код подключения Битрикс24</title><style>body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:34rem;padding:2rem;text-align:center}h1{font-size:1.1rem;font-weight:600;color:#94a3b8}code{display:block;font-size:1.6rem;word-break:break-all;background:#1e293b;border-radius:.75rem;padding:1.25rem;margin:1.25rem 0;user-select:all}.err{color:#f87171;font-size:1rem}button{background:#38bdf8;border:0;border-radius:.5rem;color:#0f172a;font-size:1rem;font-weight:600;padding:.7rem 1.6rem;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main><h1>Код подключения Битрикс24 — скопируйте и отправьте в бот командой /code</h1><code id=codeslot>…</code><p id=msgslot></p><button id=copybtn disabled>Скопировать код</button></main><script>var q=new URLSearchParams(location.search);var c=q.get("code");var e=q.get("error");var slot=document.getElementById("codeslot");var msg=document.getElementById("msgslot");var btn=document.getElementById("copybtn");if(e){slot.textContent="—";msg.className="err";msg.textContent="Ошибка авторизации: "+e+(q.get("error_description")?" — "+q.get("error_description"):"");}else if(c){slot.textContent=c;btn.disabled=false;}else{slot.textContent="—";msg.className="err";msg.textContent="Параметр code не найден — откройте ссылку authorize из бота заново.";}btn.addEventListener("click",function(){navigator.clipboard.writeText(c||"").then(function(){btn.textContent="Скопировано ✓";});});</script></body></html>';
    }

    location / {
        return 404;
    }
}
