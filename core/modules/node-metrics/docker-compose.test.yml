# GREP_SUMMARY: node-metrics docker-compose test override container_name-test cadvisor node-exporter
# STRUCTURE: base.yml + test.yml → node-metrics containers with -test suffix
# region MODULE_CONTRACT
## @purpose  Test override for node-metrics — -test container_name for both containers
## @scope    Only used in test fixtures. Never used in production.
## @invariants
##   - container_name: cadvisor-test, node-exporter-test
##   - Port mappings: смещённые (1XXXX:YYYY): 18081:8080, 19100:9100
##   - macOS: CADVISOR_IMAGE оверрайд v0.55.1 сохранён (последний рабочий на macOS-VM)
## @rationale Стандартный test-overlay контракт (DevPlan 04 DD2); перенесён из infra-metrics
##            при split (DevPlan 010 T3.2).
## @changes — 2026-08-22 | DevPlan 010 T3.2 — создан из infra-metrics test.yml (cadvisor/node-exporter часть)
# endregion MODULE_CONTRACT

services:
  cadvisor:
    container_name: cadvisor-test
    # 164 W1-5: v0.60.5 падает на macOS-VM («could not detect clock speed» — /proc/cpuinfo
    # без cpu MHz); test-оверлей пинит последний рабочий на macOS (VPS-ноды используют 0.60.5).
    # T1.4 (аудит 2026-08-22): это ОСОЗНАННЫЙ оверрайд параметризованного base
    # (${CADVISOR_IMAGE:-prod}) — НЕ дрейф; выравнивание на prod — после upstream-фикса macOS.
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    networks: !override  # DevPlan 017 W2.6 — test network isolation
      - test-observability-net
    # ⚠️ TRAP[BUG] · 2026-07-16 · HI · cadvisor-test port 18080 collided with nginx-test
    # · Fix: cadvisor-test shifted to 18081 (free port, verified no collisions).
    ports: !override  # ⚠️ TRAP[BUG] · 2026-07-18 · HIGH · compose merge склеивает ports base+test → F-7 · Fix: !override
      - "127.0.0.1:18081:8080"
    restart: "no"
    healthcheck:
      test: ["CMD", "/usr/bin/cadvisor", "--version"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 2s

  node-exporter:
    container_name: node-exporter-test
    networks: !override  # DevPlan 017 W2.6 — test network isolation
      - test-observability-net
    ports: !override  # ⚠️ TRAP[BUG] · 2026-07-18 · HIGH · compose merge склеивает ports base+test → F-7 · Fix: !override
      - "127.0.0.1:19100:9100"
    restart: "no"

networks:
  test-observability-net:
    external: true
