# GREP_SUMMARY: pg_hba.conf postgres authentication host network md5 docker-bridge
# region MODULE_CONTRACT
## @purpose  Host-based authentication rules for platform PostgreSQL
## @scope    Applied at container start via -c hba_file= flag; controls which hosts/users can connect
## @invariants
##   - local socket: trust for postgres superuser (internal Docker processes)
##   - shared-db-net (172.16.0.0/12): md5 auth for project connections
##   - No public network access (no 0.0.0.0/0 or 'all' with md5/trust)
##   - Docker bridge networks allocate from 172.17–172.31 (entire 172.16.0.0/12); /16 pin breaks
## @rationale L7 access control: only network-level auth, projects connect by user/password (00 §9).
##            B4 T5.2: Docker bridge networks dynamically allocate IP ranges from 172.17.0.0/16
##            to 172.31.0.0/16 (entire 172.16.0.0/12 range). A /16 pin like 172.20.0.0/16
##            breaks when Docker allocates a different /16 subnet on container recreate or
##            different host. pg_hba.test.conf already used 172.16.0.0/12 — production was out of sync.
## @changes — LAST_CHANGE: 2026-07-15 | 172.20.0.0/16→172.16.0.0/12 (B4 fix T5.2)
# endregion MODULE_CONTRACT

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust

# IPv4 local connections (Docker internal)
host    all             all             127.0.0.1/32            trust

# IPv6 local connections
host    all             all             ::1/128                 trust

# Docker shared-db-net (full bridge range 172.16.0.0/12): projects connect with password auth
# [IMP:8][pg_hba] shared-db-net subnet — md5 password required (B4: /12 covers all Docker bridges)
host    all             all             172.16.0.0/12           md5
host    all             all             10.0.0.0/8              md5
host    all             all             192.168.0.0/16          md5
