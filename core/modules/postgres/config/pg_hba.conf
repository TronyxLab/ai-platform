# GREP_SUMMARY: pg_hba.conf postgres authentication host network scram docker-bridge rfc1918
# region MODULE_CONTRACT
## @purpose  Host-based authentication rules for platform PostgreSQL
## @scope    Applied at container start via -c hba_file= flag; controls which hosts/users can connect
## @invariants
##   - local socket: trust for postgres superuser (internal Docker processes)
##   - RFC1918-диапазоны (172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16): scram-sha-256 для
##     проектных и кросс-нодовых подключений (DevPlan 010 T2.0c: md5 запрещён — challenge-response
##     replayable; scram обязателен ДО публикации 6432 пирам в multi-node)
##   - No public network access (no 0.0.0.0/0 or 'all' with md5/trust)
##   - Docker bridge networks allocate from 172.17–172.31 (entire 172.16.0.0/12); /16 pin breaks
## @rationale L7 access control: only network-level auth, projects connect by user/password (00 §9).
##            B4 T5.2: Docker bridge networks dynamically allocate IP ranges from 172.17.0.0/16
##            to 172.31.0.0/16 (entire 172.16.0.0/12 range). A /16 pin like 172.20.0.0/16
##            breaks when Docker allocates a different /16 subnet on container recreate or
##            different host. pg_hba.test.conf already used 172.16.0.0/12 — production was out of sync.
##            DevPlan 010 T2.0c: md5→scram-sha-256 — security-префикс multi-node (публикация
##            pgbouncer 6432 пирам требует non-replayable auth; pgbouncer AUTH_TYPE=scram-sha-256
##            + auth_query совместимы — docker-compose.base.yml).
## @changes — LAST_CHANGE: 2026-08-22 | md5→scram-sha-256 для RFC1918 (DevPlan 010 T2.0c security-префикс)
##            LAST_CHANGE: 2026-07-15 | 172.20.0.0/16→172.16.0.0/12 (B4 fix T5.2)
# endregion MODULE_CONTRACT

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust

# IPv4 local connections (Docker internal)
host    all             all             127.0.0.1/32            trust

# IPv6 local connections
host    all             all             ::1/128                 trust

# Docker shared-db-net (full bridge range 172.16.0.0/12): projects connect with password auth
# 🧐 TRAP[DECISION] · 2026-08-22 · DevPlan 010 T2.0c · RFC1918: md5→scram-sha-256 ·
# · Rejected: оставить md5 до первого multi-node · Reason: md5 challenge-response replayable;
# · активация ДО публикации pgbouncer 6432 пирам (security-префикс Волны 2 — порядок «сначала auth,
# · потом порт»); pgbouncer AUTH_TYPE=scram-sha-256 + auth_query совместимы ·
# · Rev: если legacy-клиент без scram появится в контуре — отдельная hba-строка суженного диапазона
# [IMP:8][pg_hba] RFC1918 subnets — scram-sha-256 required (B4: /12 covers all Docker bridges)
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
