# GREP_SUMMARY: postgresql.conf postgres platform config owner-tuning connections memory wal pitr logging
# region MODULE_CONTRACT
## @purpose  Owner reference tuning for shared PostgreSQL instance (T5.2)
## @scope    Applied at container start via -c config_file=/etc/postgresql/postgresql.conf
## @invariants
##   - listen_addresses = '*' required for Docker network connectivity
##   - log_destination = stderr (captured by Docker logging driver)
##   - No resource limits here (AR3 — managed at host level if needed)
##   - PITR block (WAL archiving) MUST be preserved across tuning changes
## @rationale Owner reference (T5.2): production-grade tuning for shared PG instance
##            on SSD storage. PITR block was present before T5.2 (B1) and MUST survive.
##            jit=off disables JIT compilation for OLTP workloads (no benefit, extra latency).
##            shared_preload_libraries=pg_stat_statements required for query observability.
## @changes — LAST_CHANGE: 2026-07-15 | Owner reference tuning (T5.2: B2 fix)
##            LAST_CHANGE: 2026-07-01 | WAL archiving block for PITR (TASK-1: B1)
# endregion MODULE_CONTRACT

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 30

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB

#------------------------------------------------------------------------------
# QUERY SAFETY — statement/transaction timeouts to prevent runaway queries
#------------------------------------------------------------------------------
statement_timeout = 5min
lock_timeout = 30s
idle_in_transaction_session_timeout = 60s
deadlock_timeout = 1s

#------------------------------------------------------------------------------
# PLANNER — SSD-optimised cost model
#------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 5
autovacuum_naptime = 30s

#------------------------------------------------------------------------------
# PERFORMANCE — jit off for OLTP, pg_stat_statements for observability
#------------------------------------------------------------------------------
jit = off
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

#------------------------------------------------------------------------------
# WRITE AHEAD LOG — WAL Archiving for PITR (PRESERVED from pre-T5.2)
#------------------------------------------------------------------------------
# [IMP:8][postgresql.conf] WAL settings support clean 60s shutdown
wal_level = replica
checkpoint_completion_target = 0.9
# [IMP:8][postgresql.conf] WAL archiving for PITR — MUST survive tuning changes
archive_mode = on
# ⚠️ TRAP[BUG] · 2026-08-03 · P0 · pg_archivecleanup в archive_command УДАЛЯЛ WAL из pg_wal
# · Symptom: SIGKILL postgres под нагрузкой (chaos T6, 126) → crash recovery PANIC
# ·   «could not find redo location 0/090002C8 referenced by checkpoint record» —
# ·   контейнер в crash-loop, данные кластера под угрозой.
# · Root: archive_command='pg_archivecleanup /var/lib/postgresql/data/pg_wal %f && cp ...' —
# ·   pg_archivecleanup удаляет из УКАЗАННОЙ директории файлы старее %f; с pg_wal в
# ·   качестве директории он вычищал WAL-сегменты, нужные для crash recovery (0x09 удалён,
# ·   redo 0/090002C8 потерян). pg_archivecleanup предназначен для standby archive_cleanup,
# ·   НЕ для pg_wal primary. Дополнительно: chown-фикс wal-archive (W1) сделал archive
# ·   УСПЕШНЫМ — после чего pg_archivecleanup начал реально удалять сегменты.
# · Fix: archive_command = ТОЛЬКО cp (архивирование без деструктивного cleanup);
# ·   wal_keep_size=1024 (1GB) страхует crash-recovery окном.
# · Prevention: T6 chaos-тест (kill -9 1 внутри контейнера) + restore-drill T10.
# · Восстановление после инцидента: сегмент 0x09 восстановлен из wal-archive вручную
# ·   (docker run --rm -v platform_postgres-data:/data ... cp) — 0 потерянных committed-строк.
archive_command = 'cp %p /var/lib/platform/wal-archive/%f'
archive_timeout = 60
wal_keep_size = 1024

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h '
log_statement = 'none'
log_duration = off
log_min_duration_statement = 500

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------
timezone = 'UTC'
