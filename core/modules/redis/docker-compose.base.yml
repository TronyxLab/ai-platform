# @purpose  Base compose definition for redis — cache-only redis:8.8.1-alpine, no persistence, allkeys-lfu
# GREP_SUMMARY: redis docker-compose redis-8.8.1-alpine shared-cache-net cache-only allkeys-lfu maxmemory-192mb healthcheck
# STRUCTURE: ▶ redis:8.8.1-alpine → shared-cache-net → cache-only → allkeys-lfu @192mb (headroom 64M) → redis-cli ping → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for redis — pure cache instance. NO persistence (no AOF, no RDB).
## @scope    Shared cache: no host ports, network shared-cache-net, allkeys-lfu eviction at 192mb (REF-0010: headroom под cgroup 256M)
## @invariants
##   - Image: redis:8.8.1-alpine (digest-pinned; ранее 7.4-alpine TASK-2)
##   - NO host ports в single-node (internal network only, D4); кросс-нодовая публикация 6379 —
##     только peer-scoped ufw после T2.0a auth (DevPlan 010)
##   - requirepass ОБЯЗАТЕЛЕН (T2.0a security-префикс multi-node): пароль из env REDIS_PASSWORD,
##     раскрывается ВНУТРИ контейнера shell'ом — не светится в compose-argv/ps
##   - restart: always — Docker policy (not manual lifecycle management)
##   - stop_grace_period: 10s (no persistence flush needed)
##   - Command: --save "" --appendonly no --maxmemory 192mb --maxmemory-policy allkeys-lfu --requirepass
##     REF-0010 (2026-08-24): maxmemory 256mb→192mb — headroom 64M под cgroup-лимитом 256M
##     (FAIL-0202: maxmemory==cgroup → OOM-kill до срабатывания eviction; 25% запас на
##     fragmentation/copy-on-write). Политика остаётся allkeys-lfu (cache-only owner verdict)
##   - Healthcheck аутентифицирован через REDISCLI_AUTH (без ps-экспозиции пароля)
##   - Network: shared-cache-net (external:true, pre-created by deploy-modules.sh)
##   - NO volumes — cache-only, no persistence data to store (owner verdict wave-redis 2026-07-15)
##   - Resource limits: memory 256M — intentional (AR3 cancelled: limits protect host from OOM)
##   - Container name: redis
## @rationale Owner verdict wave-redis 2026-07-15: redis is pure cache (no AOF, no RDB, no volume).
##   Eviction policy: allkeys-lfu (frequency-based, эффективнее recency-based). stop_grace_period 10s —
##   AOF flush на shutdown не требуется. no host ports — internal network only (D4).
##   DevPlan 010 T2.0a (2026-08-22): redis без аутентификации вообще → requirepass обязателен ДО
##   публикации порта пирам (порядок «сначала auth, потом порт»).
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  redis:
    # 🧐 TRAP[DECISION] · 2026-07-07 · — · Redis pinned 7-alpine → 7.4-alpine (TASK-2)
    # · 7-alpine gives any 7.x — non-deterministic across rebuilds
    # · 7.4-alpine pins minor version but allows security patches (7.4.x)
    # · Latest: 7.4.9-alpine3.21 (as of 2026-07-07)
    # · Rev: on next major upstream release — reevaluate pin
    image: redis:8.8.1-alpine@sha256:465aff338d817971674ff1ec3c0d59182e2b687018e87bf94b6e1491d0bb79e2
    container_name: redis
    profiles: [redis]
    restart: always
    stop_grace_period: 10s

    # 🧐 TRAP[DECISION] · 2026-07-16 · — · AR3 cancelled — resource limits intentional
    # · Previously: NO resource limits (AR3 rule from 00 §15, owner verdict Q2a)
    # · Decision: limits protect host from OOM — remain in place
    # · Rev: if OOM becomes issue for this module, consider adjusting limits
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
        reservations:
          memory: 128M
    logging: *default-logging

    # [IMP:9][redis-compose] Cache-only: NO persistence (no AOF, no RDB), allkeys-lfu eviction
    # Owner verdict wave-redis 2026-07-15: redis is pure cache — no volume, no dump
    # [IMP:9][redis-compose] REF-0010 (FAIL-0202): maxmemory 256mb→192mb — headroom 64M под
    # cgroup 256M (maxmemory==cgroup → OOM-kill раньше eviction); политика НЕ меняется
    # (cache-only, owner verdict; noeviction — только для langfuse-redis очереди)
    # 🧐 TRAP[DECISION] · 2026-07-15 · — · Cache-only: без persistence (AOF+RDB+volume)
    # · Rejected: AOF persistence
    # · Reason: owner verdict wave-redis — redis is pure cache, queues get noeviction Redis elsewhere
    # · Rev: if queue/critical state moves to this redis
    # 🧐 TRAP[DECISION] · 2026-08-22 · DevPlan 010 T2.0a · requirepass через shell-расширение env
    # · Rejected: --requirepass ${REDIS_PASSWORD} в argv (пароль виден в docker inspect/ps)
    # · Reason: shell-обёртка с exec раскрывает $REDIS_PASSWORD внутри контейнера из environment;
    #   argv остаётся без секрета; exec сохраняет PID-1 семантику
    # · Rev: если redis-server научится читать пароль из env нативно — убрать shell-обёртку
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --save "" \
          --appendonly no \
          --maxmemory 192mb \
          --maxmemory-policy allkeys-lfu \
          --requirepass "$REDIS_PASSWORD"

    # [IMP:8][redis-compose] T2.0a: fail-fast при отсутствии пароля (канон ${VAR:?}, DD3 reversed)
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}"

    # [IMP:8][redis-compose] DevPlan 010 T2.2: 6379 публикуется кросс-нодово ТОЛЬКО пирам —
    # bind ${SERVICE_BIND_HOST:-127.0.0.1} (single-node — loopback, байт-идентично легаси);
    # peer-доступ режет ufw (T2.3), аутентификация requirepass ОБЯЗАТЕЛЬНА до публикации (T2.0a)
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"

    # [IMP:9][redis-compose] NO volumes: — cache-only, no persistence data to store
    # volumes: deliberately absent by owner verdict wave-redis 2026-07-15

    networks:
      shared-cache-net:
        aliases:
          - redis

    # LIVENESS healthcheck — triggers Docker restart on failure
    # [IMP:8][redis-compose] T2.0a: аутентифицированный ping — REDISCLI_AUTH env (без ps-экспозиции);
    # $$ экранирует compose-интерполяцию, переменную раскрывает shell ВНУТРИ контейнера
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli -h 127.0.0.1 ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s  # 10→15s: standardized per DevPlan 083 (DB default)

    # [IMP:8][redis-compose] Resource limits: 256M — intentional (limits protect host from OOM)

networks:
  shared-cache-net:
    external: true
    name: shared-cache-net
