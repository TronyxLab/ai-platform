# @purpose  Base compose definition for service-exporters module — Redis + Postgres + PgBouncer exporters (co-located with services)
# GREP_SUMMARY: service-exporters docker-compose redis-exporter postgres-exporter pgbouncer-exporter profiles x-logging observability-net shared-cache-net shared-db-net SERVICE_BIND_HOST
# STRUCTURE: ▶ redis-exp:v1.88.0 (credentialed REDIS_ADDR/REDIS_PASSWORD) → ┬─ ▶ postgres-exp:v0.20.1 → ┬─ ▶ pgbouncer-exp:v0.12.1 (DSN @pgbouncer:6432/pgbouncer) → observability-net + shared-cache-net + shared-db-net → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for service-exporters Docker module (DevPlan 010 T3.2 — выделен из infra-metrics)
## @scope    Service metrics bridges: redis cache, postgres db, pgbouncer pool.
##           Nginx Exporter ПЕРЕНЕСЁН в модуль nginx (DR-H2 fix, 2026-08-25): co-location со
##           скрейпимым stub_status обязательна, а placement модулей различен (nginx на ingress-
##           ноде). Exporter'ы ходят Docker DNS к своим сервисам — размещаются singleton на ноде
##           своих сервисов (placement.yaml); скрейп центральным Prometheus — кросс-нодовый
##           (peer-firewall 9121/9187/9127, file_sd targets).
## @invariants
##   - profiles: [service-exporters] — pluggability: only included when COMPOSE_PROFILES contains service-exporters
##   - Redis Exporter: credentialed T2.0a — env REDIS_ADDR + REDIS_PASSWORD (флаг --redis.addr удалён:
##     exporter читает env нативно; пароль не светится в argv)
##   - Postgres Exporter: DATA_SOURCE_NAME DSN → postgres:5432, healthcheck via --version (busybox shell есть, liveness-only канон сохранён)
##   - PgBouncer Exporter (REF-0010, 2026-08-24): DSN → pgbouncer:6432/pgbouncer (admin-db
##     пула) — фасад БД виден Prometheus'у; postgres-exporter остаётся на postgres:5432
##     напрямую (метрики самой БД независимы от здоровья пула — разделение сигналов)
##   - Host-ports bind через ${SERVICE_BIND_HOST:-127.0.0.1} (T2.2): single-node — loopback;
##     multi-node — host ноды сервисов (peer ufw только monitoring-ноде, T2.4)
##   - Networks declared as external: true — pre-created by deploy-modules.sh
##   - redis-exporter on BOTH observability-net (Prometheus scrape) and shared-cache-net (Redis access)
##   - postgres-exporter on BOTH observability-net (Prometheus scrape) and shared-db-net (postgres access)
##   - pgbouncer-exporter on BOTH observability-net (scrape) and shared-db-net (pool access)
##   - All TRAP comments preserved from infra-metrics split
##   - Все exporter'ы: healthcheck via --help/--version (scratch/busybox image)
## @rationale DevPlan 010 §3: exporter'ы живут со своими сервисами (Docker DNS локален),
##            один модуль = одно решение размещения (singleton у сервисов).
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ── Redis Exporter (Metrics Bridge) ────────────────────────────────────────
  # region service:redis-exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0@sha256:ead15fa913b45314068b9237bb5eff1e97bcb41d63fbe6267befe34667b5f856
    container_name: redis-exporter
    profiles: [service-exporters]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 164 W1-5: 32M→128M — v1.88.0 + healthcheck-форк (--version = полный Go-процесс
          # ~40M RSS) превышают 64M в пике (43M main + 40M probe → OOM rc=137)
          memory: 128M
          pids: 256
        reservations:
          memory: 64M
    logging: *default-logging

    # 🧐 TRAP[DECISION] · 2026-08-22 · DevPlan 010 T2.0a · credentialed DSN через env
    # · Rejected: флаг --redis.addr=redis://:${REDIS_PASSWORD}@... (пароль в argv/ps)
    # · Reason: oliver006/redis_exporter читает env REDIS_ADDR/REDIS_PASSWORD нативно —
    #   секрет живёт в environment контейнера, не в process cmdline
    # · Network: shared-cache-net (reach redis) + observability-net (Prometheus scrape)
    # · Rev: если exporter потеряет env-поддержку — вернуть флаг с shell-обёрткой
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}"

    ports:
      # [IMP:8][service-exporters] T2.2: ранее порта не было вовсе — добавлен для peer-scrape
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${REDIS_EXPORTER_PORT:-9121}:9121"

    networks:
      observability-net:
        aliases:
          - redis-exporter
      shared-cache-net:
        aliases:
          - redis-exporter

    # Healthcheck: scratch image has no shell/wget/curl — use --version (returns 0)
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  # endregion service:redis-exporter

  # ── Postgres Exporter (Metrics Bridge) ──────────────────────────────────────
  # region service:postgres-exporter
  postgres-exporter:
    # ✅ TRAP[DECISION] · 2026-07-18 · — · postgres-exporter digest pinned
    # · 164 W1-5: v0.16.0→v0.20.1 (базовый образ busybox, не distroless; DATA_SOURCE_NAME env поддерживается)
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:4f3d82803c1f99ea5e767890de3557d2479ebbc711f63f2e04c663daa840057a
    container_name: postgres-exporter
    profiles: [service-exporters]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 164 W1-5: 32M→128M — v0.20.1 + healthcheck-форк (--version = полный Go-процесс)
          memory: 128M
          pids: 256
        reservations:
          memory: 64M
    logging: *default-logging

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?PG_PASSWORD_REQUIRED}@postgres:5432/${POSTGRES_DB:-platform}?sslmode=disable"

    ports:
      # [IMP:8][service-exporters] T2.2: ранее host-порта не было — добавлен для peer-scrape
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${POSTGRES_EXPORTER_PORT:-9187}:9187"

    networks:
      observability-net:
        aliases:
          - postgres-exporter
      shared-db-net:
        aliases:
          - postgres-exporter

    # ⚠️ TRAP[DECISION] · 2026-07-18 · — · healthcheck via --version (liveness-only канон)
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  # endregion service:postgres-exporter

  # ── PgBouncer Exporter (connection-pool metrics; REF-0010) ──────────────────
  # region service:pgbouncer-exporter
  pgbouncer-exporter:
    # [IMP:9][service-exporters] REF-0010 (FAIL-0100): pgbouncer — единственный фасад БД —
    # был невидим Prometheus'у (postgres-exporter ходил мимо на postgres:5432). Скрейп
    # admin-db pgbouncer:6432/pgbouncer даёт pool-метрики (cl_waiting/cl_active/max_client_conn).
    # Digest verified via `docker buildx imagetools inspect` (manifest-list) 2026-08-24;
    # binary path /bin/pgbouncer_exporter --verified (scratch image, rc=0)
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d
    container_name: pgbouncer-exporter
    profiles: [service-exporters]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Паритет с postgres/redis exporter'ами (164 W1-5): --version healthcheck-форк
          memory: 128M
          pids: 256
        reservations:
          memory: 64M
    logging: *default-logging

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?PG_PASSWORD_REQUIRED}@pgbouncer:6432/pgbouncer?sslmode=disable"

    ports:
      # [IMP:8][service-exporters] T2.2: peer-scrape центральным Prometheus (9127 — дефолт
      # порта pgbouncer_exporter; host=container, коллизий нет)
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${PGBOUNCER_EXPORTER_PORT:-9127}:9127"

    networks:
      observability-net:
        aliases:
          - pgbouncer-exporter
      shared-db-net:
        aliases:
          - pgbouncer-exporter

    # Liveness-only канон (--version; scratch image без shell/wget/curl;
    # readiness внешний через up{job="pgbouncer-exporter"} + alert-rules)
    healthcheck:
      test: ["CMD", "/bin/pgbouncer_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  # endregion service:pgbouncer-exporter

networks:
  observability-net:
    external: true
    name: observability-net
  shared-cache-net:
    external: true
    name: shared-cache-net
  shared-db-net:
    external: true
    name: shared-db-net
