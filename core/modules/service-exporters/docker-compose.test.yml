# GREP_SUMMARY: service-exporters docker-compose test override container_name-test redis-exporter postgres-exporter pgbouncer-exporter
# STRUCTURE: base.yml + test.yml → service-exporters containers with -test suffix
# region MODULE_CONTRACT
## @purpose  Test override for service-exporters — -test container_name for all 3 containers
## @scope    Only used in test fixtures. Never used in production.
## @invariants
##   - container_name: redis-exporter-test, postgres-exporter-test, pgbouncer-exporter-test
##     (nginx-prometheus-exporter-test перенесён в nginx/docker-compose.test.yml — DR-H2 fix)
##   - Port mappings: смещённые (1XXXX:YYYY): 19121:9121, 19187:9187, 19127:9127
##   - redis-exporter-test: REDIS_PASSWORD обязателен (T2.0a env-контракт base.yml) —
##     тестовое окружение подставляет ci_default через SMOKE_ENV
## @rationale Стандартный test-overlay контракт (DevPlan 04 DD2); перенесён из infra-metrics
##            при split (DevPlan 010 T3.2).
## @changes — 2026-08-22 | DevPlan 010 T3.2 — создан из infra-metrics test.yml (exporters часть)
## @changes — 2026-08-24 | REF-0010 (Волна 0) — +pgbouncer-exporter-test overlay
## @changes — 2026-08-25 | DR-H2 fix — nginx-prometheus-exporter-test → nginx module test.yml
# endregion MODULE_CONTRACT

services:
  redis-exporter:
    container_name: redis-exporter-test
    networks: !override  # DevPlan 017 W2.6 — test network isolation (dual: cache for collect, observability for metrics exposure)
      - test-shared-cache-net
      - test-observability-net
    restart: "no"

  postgres-exporter:
    container_name: postgres-exporter-test
    networks: !override  # DevPlan 017 W2.6 — test network isolation (dual: db for collect, observability for metrics exposure)
      - test-shared-db-net
      - test-observability-net
    restart: "no"
    # Override healthcheck to always pass — no postgres dependency in smoke tests
    # ⚠️ Binary at /bin/postgres_exporter (not /postgres_exporter)
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 2s

  pgbouncer-exporter:
    container_name: pgbouncer-exporter-test
    networks: !override  # REF-0010 — dual: db (pgbouncer:6432 collect) + observability (metrics exposure)
      - test-shared-db-net
      - test-observability-net
    ports: !override
      - "127.0.0.1:19127:9127"
    restart: "no"
    # Override healthcheck — no pgbouncer dependency in smoke tests (scratch image, binary at /bin/)
    healthcheck:
      test: ["CMD", "/bin/pgbouncer_exporter", "--version"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 2s

networks:
  test-observability-net:
    external: true
  test-shared-cache-net:
    external: true
  test-shared-db-net:
    external: true
