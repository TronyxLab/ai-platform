# GREP_SUMMARY: service-exporters module redis-exporter postgres-exporter pgbouncer-exporter metrics singleton placement
# STRUCTURE: ▶ module:service-exporters → redis-exp:v1.88.0 + postgres-exp:v0.20.1 + pgbouncer-exp:v0.12.1 → observability-net + shared-cache-net + shared-db-net → ┐
# region MODULE_CONTRACT
## @purpose  Service metrics bridges: Redis Exporter (credentialed T2.0a), Postgres Exporter,
##           PgBouncer Exporter — DevPlan 010 T3.2: выделен из infra-metrics.
##           Nginx Exporter ПЕРЕНЕСЁН в модуль nginx (DR-H2 fix: co-location со stub_status,
##           placement nginx-ноды ≠ data-ноды)
## @scope    redis cache metrics (auth), postgres db metrics, pgbouncer pool metrics;
##           размещение singleton на ноде своих сервисов (exporter'ы ходят Docker DNS)
## @invariants
##   - install_type: docker — managed by compose
##   - Redis Exporter: credentialed env REDIS_ADDR/REDIS_PASSWORD (T2.0a requirepass)
##   - Postgres Exporter: DATA_SOURCE_NAME → postgres:5432 (via shared-db-net)
##   - redis-exporter on both observability-net (Prometheus) and shared-cache-net (Redis access)
##   - postgres-exporter on both observability-net (Prometheus) and shared-db-net (Postgres access)
##   - depends_on [redis, postgres] — ИНФРА-тип (co-location семантика, НЕ data-plane:
##     off-зависимости placement проверяет только по DATA_PLANE_DEPS); nginx исключён
##     (DR-H2 fix: exporter nginx переехал в модуль nginx)
## @rationale DevPlan 010 §3 TRAP[DECISION]: физический split, один модуль = одно решение размещения.
## @changes — 2026-08-22 | DevPlan 010 T3.2 — создан из infra-metrics; redis-exporter credentialed (T2.0a);
##           host-порты 9113/9121/9187 добавлены для кросс-нодового скрейпа (T2.2)
##           2026-08-25 | DR-H2 fix — nginx-exporter → модуль nginx (depends_on/порты/память)
# endregion MODULE_CONTRACT

name: service-exporters
install_type: docker
description: "Service exporters: Redis Exporter (credentialed), Postgres Exporter, PgBouncer Exporter"

depends_on:
  - redis
  - postgres

# D5 (118 G4): severity/restart — метрики, non-critical; restart согласован с base.yml (все 3 сервиса unless-stopped)
severity: normal
restart: unless-stopped

interfaces:
  - healthcheck

spool_dir: /var/lib/platform/service-exporters-data

resources:
  # Синхронизировано с docker-compose.base.yml: redis-exporter 128M + postgres-exporter 128M
  # + pgbouncer-exporter 128M = 384M (REF-0010; nginx-exp 32M ушёл с переносом в модуль nginx).
  limits:
    memory: 416M
  reservations:
    memory: 64M

env_requires:
  - POSTGRES_USER
  - POSTGRES_PASSWORD
  - REDIS_PASSWORD
