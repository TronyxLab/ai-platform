# @purpose  Base compose definition for status-page Docker module — container_name:status-page, profiles, proxy-net, volumes
# GREP_SUMMARY: status-page docker-compose proxy-net profiles volumes healthcheck node.yaml status-metrics.json
# STRUCTURE: ▶ status-page:python-3.12-alpine [profiles:status-page] → proxy-net → volumes (app, node.yaml ro, status-metrics.json ro) → healthcheck → ┐
# region MODULE_CONTRACT
## @purpose  Base compose definition for status-page Docker module — live node status aggregation
## @scope    Merged with root docker-compose.yml via include:
## @invariants
##   - profiles: [status-page] — pluggability: only included when COMPOSE_PROFILES contains status-page
##   - Port: NO external ports — accessed via nginx proxy_pass on proxy-net
##   - restart: unless-stopped — Docker policy
##   - proxy-net — required for nginx proxy_pass to status-page:8080
##   - node.yaml: mounted ro from host /opt/node-configs/<node>/node.yaml
##   - status-metrics.json: mounted ro from host /run/platform/status-metrics.json (tmpfs, cron-exported every 1m) — META Δ
##   - healthcheck: curl localhost:8080/health — verifies status-page is responding
## @rationale   Profiles enable selective startup via `make up MODULES=status-page`.
##              No external ports — all access via nginx Basic Auth proxy.
##              Docker socket NOT mounted — reads pre-exported metrics JSON from cron.
## @changes
##   2026-07-23 | docker-health.json → status-metrics.json | META Δ
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  status-page:
    build:
      context: .
      dockerfile: Dockerfile
    image: status-page:latest
    container_name: status-page
    profiles: [status-page]
    restart: unless-stopped

    volumes:
      - ./app.py:/app/app.py:ro
      # node.yaml — SSoT for vhost list (projects[].domain with expose:true)
      - ${NODE_CONFIGS_DIR:-/opt/node-configs}/${NODE_NAME:-unknown}/node.yaml:/opt/node-configs/${NODE_NAME:-unknown}/node.yaml:ro
      # status-metrics.json — container/cert/project/host metrics (cron-exported every 1m)
      - /run/platform/status-metrics.json:/run/platform/status-metrics.json:ro

    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      NODE_NAME: ${NODE_NAME:-unknown}
      NODE_CONFIGS_DIR: ${NODE_CONFIGS_DIR:-/opt/node-configs}

    networks:
      proxy-net:
        aliases:
          - status-page

    deploy:
      resources:
        limits:
          memory: 128M

    logging: *default-logging

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Override entrypoint to run app.py directly
    entrypoint: ["python3", "/app/app.py"]
    working_dir: /app

networks:
  proxy-net:
    external: true
