# GREP_SUMMARY: status-page module docker live-status health endpoint basic-auth ci-gate status-metrics-json templates
# STRUCTURE: ▶ module:status-page → proxy-net → /health + /status.json + Jinja2 → depends_on:nginx → ┐
# region MODULE_CONTRACT
## @purpose  Live status-page service — aggregates node health (certs + containers + host disk),
##           renders Jinja2 HTML with 3 tables, exposes /health for CI post-deploy gate.
##           Protected by nginx Basic Auth with stealth 444.
## @scope    Docker module, runs on proxy-net, reads node.yaml + status-metrics.json, live-curls vhosts
## @invariants
##   - install_type: docker — managed by compose
##   - profiles: [status-page] — pluggable via COMPOSE_PROFILES
##   - Networks: proxy-net (external:true, pre-created by bootstrap)
##   - restart: unless-stopped
##   - Healthcheck: curl localhost:8080/health → 200
##   - NO ports — accessed via nginx proxy_pass only
##   - Anti-recursion: excludes status-page container from self-checks
##   - Timeout budget: total ≤30s, per-check ≤5s
##   - Reads /var/lib/platform/run/status-metrics.json (persistent, 142 W2; cron-exported every 1m)
##   - Reads node.yaml ro from /opt/node-configs/<node>/node.yaml
##   - Jinja2 templates at /app/templates/status.html
##   - Jinja2 autoescape enabled (XSS protection)
## @rationale Live-агрегатор статуса ноды: оператору — HTML с 3 таблицами, CI — /health как финальный gate.
##            platform-export-metrics.py (cron → JSON) вместо docker.sock для безопасности.
##            Jinja2 для шаблонов, cryptography для парсинга сертификатов.
## @changes
##   2026-07-23 | docker-health.json → status-metrics.json; +Jinja2 templates | META Δ
# endregion MODULE_CONTRACT

name: status-page
install_type: docker
description: "Live status-page service — node health aggregation (certs + containers + host disk), Jinja2 HTML with 3 tables, /health CI-gate endpoint. Status metrics exported via platform-export-metrics.py cron. Protected by nginx Basic Auth."

depends_on:
  - nginx

# D5 (118 G4): severity/restart/resources — status-page, non-critical;
# restart согласован с base.yml (unless-stopped); resources — limits 128M из base.yml
severity: normal
restart: unless-stopped

interfaces:
  - healthcheck

spool_dir: /var/lib/platform/status-page/data
spool_volume: status-page-data

resources:
  limits:
    memory: 128M

env_shared:
  PLATFORM_DOMAIN: "${PLATFORM_DOMAIN}"

# AI-0072 (DevPlan 17 T3.6): env_requires ПУСТ — контейнер не читает master-креды;
# Basic Auth живёт в nginx (.htpasswd-platform из PLATFORM_MASTER_EMAIL/PASSWORD,
# потребитель — nginx/module.yaml + secret-definitions.yaml глобально)
