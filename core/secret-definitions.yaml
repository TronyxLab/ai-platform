# core/secret-definitions.yaml
# GREP_SUMMARY: secret-definitions authoritative secrets ci_default tier source charset
# STRUCTURE: ┌secrets[]┐ → ◇ tier(required|generated|optional|removed) → ⊕ source(sops|autogen|ci-secret|provisioner) → ci_default → ⎋ gate-verifiable
#
# @standard Canonical AGE-key format:
#           • AGE_SECRET_KEY=AGE-SECRET-KEY-xxxxxxxxxxxxxxxxxxxxxxxxxxxx…
#           • The key is always stored as an environment variable (never bare)
#           • AGE_SECRET_KEY_FILE contains the raw key (same AGE-SECRET-KEY-xxx format)
#           • SOPS_AGE_KEY is a deprecated fallback (same format)
#           • The authoritative format definition lives in core/internal/shared/age_key.py
#           • All three locations (age_key.py, decrypt-secrets.sh, platform-secrets/install.sh)
#             MUST use the same AGE-SECRET-KEY-xxxxxxxx… format
#
# region MODULE_CONTRACT
## @purpose  Единый SSoT для всех секретов платформы (definitions only — consumers не хранятся).
##           Эталонный источник: core/secrets-manifest.yaml с удалёнными consumers + добавленным ci_default.
##           Consumers вычисляются динамически generate_secrets_manifest.py.
## @scope    Все секреты: module env_requires (13 module.yaml), autogen (7 из secrets.sh),
##           CI secrets, инфраструктурные. 31 entry.
## @invariants
##   - tier ∈ {required, generated, optional, removed}
##   - source ∈ {sops, autogen, ci-secret, provisioner}
##   - generated-секреты всегда имеют gen_command
##   - ci-secret секреты не имеют ci_default (используются только в CI/GitHub Secrets)
##   - provisioner-секреты генерируются на VPS через API (не локально, не через age)
##   - removed-секреты имеют tier=removed (историческая запись, не используется)
##   - Все ci_default — test-only значения, НЕ для production
## @rationale Разделение definitions + consumers: secret-definitions.yaml — чистый inventory
##            без consumers; generate_secrets_manifest.py динамически вычисляет consumers
##            из module.yaml. Устраняет дрейф consumers при добавлении/удалении env_requires.
## @changes  Plan 041 — secret-definitions split: created from core/secrets-manifest.yaml,
##            removed consumers fields, added ci_default from platform-env.yaml env_defaults
##            and tests/_conftest/smoke.py SMOKE_ENV.
# endregion MODULE_CONTRACT
version: 1
secrets:
  # ────────────────────────────────────────────
  # Module env_requires — required (sops)
  # ────────────────────────────────────────────

  - name: POSTGRES_PASSWORD
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "test-pg-pwd"
    note: "openssl rand -base64 32. Самый потребляемый секрет (4 модуля). ⚠️ CONSTRAINT: must match charset regex — embedded in DATABASE_URLs."

  - name: POSTGRES_USER
    tier: required
    source: sops
    ci_default: "postgres"
    note: "По умолчанию: postgres. Может быть переопределён."

  - name: CLICKHOUSE_PASSWORD
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "test-clickhouse-pwd-not-for-prod"
    note: "openssl rand -base64 32. Общий для clickhouse и langfuse. ⚠️ CONSTRAINT: must match charset regex — embedded in DATABASE_URLs."

  - name: MINIO_ROOT_USER
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "minioadmin"
    note: "Root user для MinIO S3. ⚠️ CONSTRAINT: must match charset regex — embedded in S3 endpoint URLs."

  - name: MINIO_ROOT_PASSWORD
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "minioadmin"
    note: "openssl rand -base64 32. Root password для MinIO S3. ⚠️ CONSTRAINT: must match charset regex — embedded in S3 endpoint URLs."

  - name: OPENAI_API_KEY
    tier: removed
    source: sops
    note: "Removed 2026-07-24 per DevPlan 049. Previously: OpenAI API key for LLM routing via LiteLLM. No longer used as provider key — LITELLM_MASTER_KEY replaces it for admin access; LITELLM_API_KEY (virtual key) replaces it for consumer access."

  - name: HERMES_DASHBOARD_PASSWORD
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "test-db-pwd"
    note: "Password для Hermes dashboard (htpasswd). ⚠️ CONSTRAINT: must match charset regex — preventive, unified auth with PLATFORM_MASTER_PASSWORD."

  - name: GF_SECURITY_ADMIN_PASSWORD
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "testpass"
    note: "Admin password для Grafana. ⚠️ CONSTRAINT: must match charset regex — preventive, unified auth with PLATFORM_MASTER_PASSWORD."

  - name: S3_BUCKET
    tier: required
    source: sops
    ci_default: "test-bucket"
    note: "S3 bucket name для backups (MinIO)."

  - name: S3_ACCESS_KEY
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "test-access-key"
    note: "S3 access key для S3-совместимого хранилища (backups, Langfuse event upload). ⚠️ CONSTRAINT: must match charset regex — embedded in S3 endpoint URLs."

  - name: S3_SECRET_KEY
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    ci_default: "test-secret-key"
    note: "S3 secret key для S3-совместимого хранилища. openssl rand -base64 32. ⚠️ CONSTRAINT: must match charset regex — embedded in S3 endpoint URLs."

  - name: AGE_SECRET_KEY
    tier: required
    source: sops
    charset: "^AGE-SECRET-KEY-[A-Za-z0-9]+$"
    ci_default: "AGE-SECRET-KEY-TEST1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    note: "Age-ключ для расшифровки SOPS-файлов. Критический: без него platform-secrets не стартует. ⚠️ CONSTRAINT: must match AGE-SECRET-KEY- format."

  - name: GHCR_PULL_TOKEN
    tier: required
    source: sops
    charset: "^[A-Za-z0-9_-]+$"
    ci_default: "ghp_test-token-for-ci-only"
    note: "Fine-grained PAT: read:packages на все orgs (ghcr.io pull). ⚠️ CONSTRAINT: must match charset regex — GitHub PAT format (alphanumeric + underscore)."

  - name: GHCR_PUSH_TOKEN
    tier: optional
    source: ci-secret
    ci_default: "ci-ghcr-push-token"
    note: "Fine-grained PAT: write:packages на ghcr.io (push L2 образов). CI uses GITHUB_TOKEN; standalone PAT needed for manual push."

  - name: TELEGRAM_BOT_TOKEN
    tier: required
    source: sops
    charset: "^[0-9]+:[A-Za-z0-9_-]+$"
    ci_default: "1234567890:test-telegram-bot-token-for-ci"
    note: "Telegram Bot API token для нотификаций (healthcheck, deploy, watchdog) и Hermes Agent команд. Создать через @BotFather. ⚠️ CONSTRAINT: must match Telegram Bot API token format (digits:alphanumeric)."

  - name: WEBNAMES_API_KEY
    tier: required
    source: sops
    charset: "^[A-Za-z0-9_*.-]+$"
    ci_default: "*test-webnames-api-key"
    note: "API key webnames.ru для acme.sh DNS-01 wildcard TLS. Требуется когда PLATFORM_CERTBOT_DNS_PLUGIN=webnames. ⚠️ NOTE: includes leading '*' asterisk — the key displayed in webnames control panel includes this prefix."

  # ────────────────────────────────────────────
  # Master credentials — unified auth for all platform services
  # ────────────────────────────────────────────

  - name: PLATFORM_MASTER_EMAIL
    tier: required
    source: sops
    ci_default: "admin@ai-platform.local"
    note: "Master email/login for all platform services. Default for Prometheus/Loki/Grafana/Langfuse/Hermes; overridable per-service via service-specific env var. ⚠️ legacy-тестовый домен упразднён (DevPlan 116 T3, U-16) — ci_default литерал admin@ai-platform.local (generated .py требуют литералы, не admin@${PLATFORM_DOMAIN})."

  - name: PLATFORM_MASTER_PASSWORD
    tier: required
    source: sops
    charset: "^[A-Za-z0-9._-]+$"
    gen_command: 'openssl rand -base64 32'
    ci_default: "test-master-password"
    note: "Master password for all platform services. Default for all service passwords; overridable per-service via service-specific env var. ⚠️ CONSTRAINT: must match charset regex — propagated to all service passwords via secrets-init.sh."

  # ────────────────────────────────────────────
  # Autogen-секреты — generated (secrets.sh step_12b)
  # ────────────────────────────────────────────

  - name: LITELLM_MASTER_KEY
    tier: generated
    source: autogen
    gen_command: 'echo "sk-$(openssl rand -hex 32)"'
    ci_default: "sk-ci-test-master-key"
    note: "Virtual key для LiteLLM API. Master key для прокси."

  - name: NEXTAUTH_SECRET
    tier: generated
    source: autogen
    gen_command: 'openssl rand -hex 32'
    ci_default: "ci-test-nextauth-secret-32-chars-min!!"
    note: "NextAuth.js secret для Langfuse (encryption)."

  - name: SALT
    tier: generated
    source: autogen
    gen_command: 'openssl rand -hex 16'
    ci_default: "ci-test-salt-value"
    note: "Password salt для Langfuse."

  - name: LANGFUSE_INIT_ORG_ID
    tier: generated
    source: autogen
    gen_command: 'echo "org_$(openssl rand -hex 4)"'
    ci_default: "ci-test-org"
    note: "Initial org ID для Langfuse bootstrap."

  - name: LANGFUSE_INIT_PROJECT_ID
    tier: generated
    source: autogen
    gen_command: 'echo "proj_$(openssl rand -hex 4)"'
    ci_default: "ci-test-project"
    note: "Initial project ID для Langfuse bootstrap."

  - name: LANGFUSE_PUBLIC_KEY
    tier: generated
    source: autogen
    gen_command: 'echo "pk-lf_$(openssl rand -hex 16)"'
    ci_default: "ci-test-public-key"
    note: "Langfuse public key (in-memory, не в env_requires)."

  - name: LANGFUSE_SECRET_KEY
    tier: generated
    source: autogen
    gen_command: 'echo "sk-lf_$(openssl rand -hex 16)"'
    ci_default: "ci-test-secret-key"
    note: "Langfuse secret key (in-memory, не в env_requires)."

  - name: LANGFUSE_INIT_USER_PASSWORD
    tier: generated
    source: autogen
    gen_command: 'echo "$(openssl rand -base64 16)"'
    ci_default: "ci-test-langfuse-pwd"
    note: "Initial admin password для Langfuse bootstrap."

  - name: API_SERVER_KEY
    tier: generated
    source: autogen
    gen_command: 'openssl rand -hex 32'
    ci_default: "test-api-server-key-for-ci-only"
    note: "API Server key для Hermes Agent Bearer token auth. Autogen при bootstrap. Без ключа API server отключен — graceful degradation."

  # ────────────────────────────────────────────
  # CI secrets — GitHub Actions secrets
  # consumers: [] — используются CI, не модулями
  # ci_secret: true — не имеют ci_default (реальные ключи в GitHub Secrets)
  # ────────────────────────────────────────────

  - name: VPS_HOST
    tier: required
    source: ci-secret
    ci_default: ""
    note: "VPS hostname для rsync core (platform-deploy.yml)."

  - name: VPS_SSH_KEY
    tier: required
    source: ci-secret
    ci_default: ""
    note: "SSH private key для rsync core на VPS (platform-deploy.yml)."

  - name: CI_DEPLOY_KEY
    tier: required
    source: ci-secret
    ci_default: ""
    note: "SSH deploy key для ci-deploy forced-command (deploy-project.yml, platform-deploy.yml)."

  - name: DOCKER_HUB_USERNAME
    tier: required
    source: ci-secret
    ci_default: ""
    note: "Docker Hub username для image pulls в CI (platform-test.yml, platform-deploy.yml)."

  - name: DOCKER_HUB_TOKEN
    tier: required
    source: ci-secret
    ci_default: ""
    note: "Docker Hub token для image pulls в CI (platform-test.yml, platform-deploy.yml)."

  - name: SSH_HOST
    tier: required
    source: ci-secret
    ci_default: ""
    note: "SSH host для platform-deploy.yml (workflow_call secret)."

  - name: SSH_KEY
    tier: required
    source: ci-secret
    ci_default: ""
    note: "SSH key для platform-deploy.yml (workflow_call secret). ≡ CI_DEPLOY_KEY (один ключ, разные роли: rsync vs forced-command)."

  - name: E2E_BASE_URL
    tier: required
    source: ci-secret
    ci_default: ""
    note: "Base URL для E2E smoke test (platform-deploy.yml)."

  - name: E2E_GRAFANA_URL
    tier: required
    source: ci-secret
    ci_default: ""
    note: "Grafana URL для E2E smoke test (platform-deploy.yml)."

  - name: NODE_HOST_MAP
    tier: required
    source: ci-secret
    ci_default: ""
    note: "JSON map node→host для deploy-project.yml (org variable)."

  # ────────────────────────────────────────────
  # Optional CI secrets
  # ────────────────────────────────────────────

  - name: GIT_MIRROR_TOKEN
    tier: optional
    feature: mirror
    source: ci-secret
    ci_default: ""
    note: "DEPRECATED for mirror.yml (2026-07-23) — replaced by MIRROR_SSH_KEY. Still used as HTTPS fallback in context-promote.sh."

  - name: MIRROR_SSH_KEY
    tier: optional
    feature: mirror
    source: ci-secret
    ci_default: ""
    note: "SSH private key for mirror.yml push to TronyxLab/ai-platform (user SSH key: github-actions). Public key: .github/mirror-deploy-key.pub. Replaces GIT_MIRROR_TOKEN."

  # ────────────────────────────────────────────
  # LLM Provider API keys — CI-only secrets (optional, per-org)
  # Используются в platform-test.yml для live integration тестов.
  # Не являются platform secrets — каждый контекст конфигурирует свои.
  # ────────────────────────────────────────────

  - name: DEEPSEEK_API_KEY
    tier: optional
    feature: integration-test
    source: ci-secret
    # ⚠️ TRAP[BUG] · 2026-07-31 · HI · SMOKE_ENV не самодостаточен для litellm
    # · Root: ci_default: "" → load_ci_defaults() опускает пустой ci_default →
    # ·   smoke_env_generated.py без DEEPSEEK_API_KEY → `${DEEPSEEK_API_KEY:?required}`
    # ·   в litellm base.yml (required: true per DevPlan 049) падает на config/up.
    # ·   На машинах разработчика маскировалось ambient-переменной окружения.
    # · Fix: ci_default со значением, синхронизированным с platform-infra.yaml и .env.example.
    # · Rev: если litellm перестанет требовать DeepSeek — удалить ci_default и ослабить module.yaml.
    ci_default: "sk-placeholder-key-for-ci"
    note: "DeepSeek API key для live integration тестов в CI (platform-test.yml). Опционально — per-org secret."

  # ────────────────────────────────────────────
  # Removed / deprecated secrets
  # ────────────────────────────────────────────

  - name: GHCR_TOKEN
    tier: removed
    source: ci-secret
    note: "DEPRECATED — removed in Plan 018. Replaced by GHCR_PULL_TOKEN (read-only PAT). Previously used by platform-test.yml, build-platform.yml."

  - name: ANTHROPIC_API_KEY
    tier: removed
    source: ci-secret
    note: "Never configured, removed per DevPlan 049 (2026-07-24). Anthropic was never used as a provider."

  - name: OPENROUTER_API_KEY
    tier: removed
    source: ci-secret
    note: "Never configured, removed per DevPlan 049 (2026-07-24). OpenRouter was never used as a provider."

  - name: GLM_API_KEY
    tier: removed
    source: ci-secret
    note: "Never configured, removed per DevPlan 049 (2026-07-24). GLM/Z.AI was never used as a provider."

  # ────────────────────────────────────────────
  # Provisioner-generated secrets — generated on VPS via key_provisioner.py
  # ────────────────────────────────────────────

  - name: LITELLM_PROJECT_KEYS
    description: "Virtual API keys for per-project LiteLLM access (provisioned automatically)"
    tier: generated
    source: provisioner
    type: map
    note: "Generated by key_provisioner.py on VPS. One key per LLM-enabled project. Stored in SOPS for durability."
