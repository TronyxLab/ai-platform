# core/secrets-manifest.yaml
# GREP_SUMMARY: secrets-manifest sso tier-model required generated optional consumers anti-drift
# STRUCTURE: ┌secrets[]┐ → ◇ tier(required|generated|optional|removed) → ⊕ consumers[] → ⟦source(sops|autogen|ci-secret)⟧ → ⎋ gate-verifiable
# region MODULE_CONTRACT
## @purpose  Единый SSoT для всех секретов платформы. Anti-drift механизм: gate блокирует незарегистрированные секреты.
## @scope    Все секреты: module env_requires (13 module.yaml), autogen (7 из secrets.sh), CI secrets (.env.example), инфраструктурные.
## @invariants
##   tier ∈ {required, generated, optional, removed}
##   source ∈ {sops, autogen, ci-secret}
##   generated-секреты всегда имеют gen_command
##   ci-secret секреты имеют consumers: [] (CI-side, не модули)
##   removed-секреты имеют tier=removed (историческая запись, не используется)
##   Каждый env_requires из любого module.yaml имеет matching entry с tier=required|generated
## @rationale SSoT предотвращает дрейф: gate блокирует добавление секретов без регистрации в манифесте
## @rationale (D2) GHCR_TOKEN помечен tier=removed, не удалён из манифеста — историческая запись для gate-совместимости
## @changes  Plan 018 — secrets-consolidation: SSoT создан из inventory TASK-1 (31 entries)
##            Plan 019 — secrets-reconciliation: +4 new entries (TELEGRAM_BOT_TOKEN, WEBNAMES_API_KEY, S3_ACCESS_KEY, S3_SECRET_KEY) по результатам аудита tronyx-vps
## @usecases
##   - deploy-modules.sh: _check_env_requires() читает manifest.consumers для проверки обязательных секретов
##   - secrets.sh: step_12b_ensure_secrets() читает generated-секреты из manifest
##   - CI gate: test_gate_secrets_manifest.py проверяет консистентность manifest ↔ module.yaml ↔ workflows ↔ .env.example
# endregion MODULE_CONTRACT
version: 1
secrets:
  # ────────────────────────────────────────────
  # Module env_requires — required (sops)
  # ────────────────────────────────────────────

  - name: POSTGRES_PASSWORD
    tier: required
    consumers: [postgres, litellm, backup-cron, infra-metrics]
    source: sops
    note: "openssl rand -base64 32. Самый потребляемый секрет (4 модуля)."

  - name: POSTGRES_USER
    tier: required
    consumers: [postgres, infra-metrics]
    source: sops
    note: "По умолчанию: postgres. Может быть переопределён."

  - name: CLICKHOUSE_PASSWORD
    tier: required
    consumers: [clickhouse, langfuse]
    source: sops
    note: "openssl rand -base64 32. Общий для clickhouse и langfuse."

  - name: MINIO_ROOT_USER
    tier: required
    consumers: [minio]
    source: sops
    note: "Root user для MinIO S3."

  - name: MINIO_ROOT_PASSWORD
    tier: required
    consumers: [minio]
    source: sops
    note: "openssl rand -base64 32. Root password для MinIO S3."

  - name: OPENAI_API_KEY
    tier: required
    consumers: [litellm]
    source: sops
    note: "OpenAI API key для LLM-роутинга через LiteLLM."

  - name: HERMES_DASHBOARD_PASSWORD
    tier: required
    consumers: [hermes-agent]
    source: sops
    note: "Password для Hermes dashboard (htpasswd)."

  - name: GF_SECURITY_ADMIN_PASSWORD
    tier: required
    consumers: [monitoring]
    source: sops
    note: "Admin password для Grafana."

  - name: S3_BUCKET
    tier: required
    consumers: [backup-cron]
    source: sops
    note: "S3 bucket name для backups (MinIO)."

  - name: S3_ACCESS_KEY
    tier: required
    consumers: [backup-cron, langfuse]
    source: sops
    note: "S3 access key для S3-совместимого хранилища (backups, Langfuse event upload)."

  - name: S3_SECRET_KEY
    tier: required
    consumers: [backup-cron, langfuse]
    source: sops
    note: "S3 secret key для S3-совместимого хранилища. openssl rand -base64 32."

  - name: AGE_SECRET_KEY
    tier: required
    consumers: [platform-secrets]
    source: sops
    note: "Age-ключ для расшифровки SOPS-файлов. Критический: без него platform-secrets не стартует."

  - name: GHCR_PULL_TOKEN
    tier: required
    consumers: [docker-login]
    source: sops
    note: "Fine-grained PAT: read:packages на все orgs (ghcr.io pull)."

  - name: TELEGRAM_BOT_TOKEN
    tier: required
    consumers: [hermes-agent, monitoring, backup-cron]
    source: sops
    note: "Telegram Bot API token для нотификаций (healthcheck, deploy, watchdog) и Hermes Agent команд. Создать через @BotFather."

  - name: WEBNAMES_API_KEY
    tier: required
    consumers: [nginx]
    source: sops
    note: "API key webnames.ru для acme.sh DNS-01 wildcard TLS. Требуется когда PLATFORM_CERTBOT_DNS_PLUGIN=webnames."

  # ────────────────────────────────────────────
  # Master credentials — unified auth for all platform services
  # ────────────────────────────────────────────

  - name: PLATFORM_MASTER_EMAIL
    tier: required
    consumers: [nginx, status-page, prometheus, loki, grafana, langfuse, hermes]
    source: sops
    note: "Master email/login for all platform services. Default for Prometheus/Loki/Grafana/Langfuse/Hermes; overridable per-service via service-specific env var."

  - name: PLATFORM_MASTER_PASSWORD
    tier: required
    consumers: [nginx, status-page, prometheus, loki, grafana, langfuse, hermes]
    source: sops
    gen_command: 'openssl rand -base64 32'
    note: "Master password for all platform services. Default for all service passwords; overridable per-service via service-specific env var."

  # ────────────────────────────────────────────
  # Autogen-секреты — generated (secrets.sh step_12b)
  # ────────────────────────────────────────────

  - name: LITELLM_MASTER_KEY
    tier: generated
    consumers: [litellm]
    source: autogen
    gen_command: 'echo "sk-$(openssl rand -hex 32)"'
    note: "Virtual key для LiteLLM API. Master key для прокси."

  - name: NEXTAUTH_SECRET
    tier: generated
    consumers: [langfuse]
    source: autogen
    gen_command: 'openssl rand -hex 32'
    note: "NextAuth.js secret для Langfuse (encryption)."

  - name: SALT
    tier: generated
    consumers: [langfuse]
    source: autogen
    gen_command: 'openssl rand -hex 16'
    note: "Password salt для Langfuse."

  - name: LANGFUSE_INIT_ORG_ID
    tier: generated
    consumers: [langfuse]
    source: autogen
    gen_command: 'echo "org_$(openssl rand -hex 4)"'
    note: "Initial org ID для Langfuse bootstrap."

  - name: LANGFUSE_INIT_PROJECT_ID
    tier: generated
    consumers: [langfuse]
    source: autogen
    gen_command: 'echo "proj_$(openssl rand -hex 4)"'
    note: "Initial project ID для Langfuse bootstrap."

  - name: LANGFUSE_PUBLIC_KEY
    tier: generated
    consumers: [langfuse]
    source: autogen
    gen_command: 'echo "pk-lf_$(openssl rand -hex 16)"'
    note: "Langfuse public key (in-memory, не в env_requires)."

  - name: LANGFUSE_SECRET_KEY
    tier: generated
    consumers: [langfuse]
    source: autogen
    gen_command: 'echo "sk-lf_$(openssl rand -hex 16)"'
    note: "Langfuse secret key (in-memory, не в env_requires)."

  # ────────────────────────────────────────────
  # CI secrets — GitHub Actions secrets
  # consumers: [] — используются CI, не модулями
  # ────────────────────────────────────────────

  - name: VPS_HOST
    tier: required
    consumers: []
    source: ci-secret
    note: "VPS hostname для rsync core (platform-deploy.yml)."

  - name: VPS_SSH_KEY
    tier: required
    consumers: []
    source: ci-secret
    note: "SSH private key для rsync core на VPS (platform-deploy.yml)."

  - name: CI_DEPLOY_KEY
    tier: required
    consumers: []
    source: ci-secret
    note: "SSH deploy key для ci-deploy forced-command (deploy-project.yml, platform-deploy.yml)."

  - name: DOCKER_HUB_USERNAME
    tier: required
    consumers: []
    source: ci-secret
    note: "Docker Hub username для image pulls в CI (platform-test.yml, platform-deploy.yml)."

  - name: DOCKER_HUB_TOKEN
    tier: required
    consumers: []
    source: ci-secret
    note: "Docker Hub token для image pulls в CI (platform-test.yml, platform-deploy.yml)."

  - name: SSH_HOST
    tier: required
    consumers: []
    source: ci-secret
    note: "SSH host для platform-deploy.yml (workflow_call secret)."

  - name: SSH_KEY
    tier: required
    consumers: []
    source: ci-secret
    note: "SSH key для platform-deploy.yml (workflow_call secret). ≡ CI_DEPLOY_KEY (один ключ, разные роли: rsync vs forced-command)."

  - name: E2E_BASE_URL
    tier: required
    consumers: []
    source: ci-secret
    note: "Base URL для E2E smoke test (platform-deploy.yml)."

  - name: E2E_GRAFANA_URL
    tier: required
    consumers: []
    source: ci-secret
    note: "Grafana URL для E2E smoke test (platform-deploy.yml)."

  - name: NODE_HOST_MAP
    tier: required
    consumers: []
    source: ci-secret
    note: "JSON map node→host для deploy-project.yml (org variable)."

  # ────────────────────────────────────────────
  # Optional CI secrets
  # ────────────────────────────────────────────

  - name: GIT_MIRROR_TOKEN
    tier: optional
    feature: mirror
    consumers: []
    source: ci-secret
    note: "HTTPS-токен для git mirror (Tronyx161→TronyxLab). Optional fallback — SSH primary per Plan 015 T3.4."

  # ────────────────────────────────────────────
  # LLM Provider API keys — CI-only secrets (optional, per-org)
  # Используются в platform-test.yml для live integration тестов.
  # Не являются platform secrets — каждый контекст конфигурирует свои.
  # ────────────────────────────────────────────

  - name: DEEPSEEK_API_KEY
    tier: optional
    feature: integration-test
    consumers: []
    source: ci-secret
    note: "DeepSeek API key для live integration тестов в CI (platform-test.yml). Опционально — per-org secret."

  # ────────────────────────────────────────────
  # Removed / deprecated secrets
  # ────────────────────────────────────────────

  - name: GHCR_TOKEN
    tier: removed
    consumers: []
    source: ci-secret
    note: "DEPRECATED — removed in Plan 018. Replaced by GHCR_PULL_TOKEN (read-only PAT). Previously used by platform-test.yml, build-platform.yml."
