# @purpose  Platform dev override — replaces L2 hermes-agent with L1 (hermes-agent-base:latest, no CONTEXT)
# GREP_SUMMARY: docker-compose platform-dev override hermes-agent-base L1 dev-mode no-context
# STRUCTURE: hermes-agent: image ← hermes-agent-base:latest → L1 without context overlay (explicit image override)
# region MODULE_CONTRACT
## @purpose  Docker Compose override file for platform development
## @scope    Overrides hermes-agent image to use the local L1 base image (hermes-agent-base:latest)
## @invariants
##   - Only modifies hermes-agent service (other 12+ services unchanged)
##   - L1 mechanism = EXPLICIT image override (`image: hermes-agent-base:latest`) — empty-string
##     env mechanism (CONTEXT_IMAGE empty-string env entry) is forbidden (DevPlan 116 B3 D4)
##   - Used with flag: -f docker-compose.yml -f docker-compose.platform-dev.yml
##   - L1 image (hermes-agent-base:latest) must be pre-built locally via make hermes-build-platform
## @rationale Platform dev: no context overlay needed — developer works on L1 code,
##           not Telegram configs/skills. Speeds up local development by skipping L2 build.
##           L1 is built locally and pushed to ghcr.io as DR backup / distribution base (hermes-push-l1).
# endregion MODULE_CONTRACT

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DEV OVERRIDE: hermes-agent — L1 without context overlay
  # ═══════════════════════════════════════════════════════════════════════════
  hermes-agent:
    # 🧐 TRAP[DECISION] · 2026-07-09 · — · L1 dev override (механизм обновлён B3 D4)
    # ·   Override image from L2 (ghcr.io/tronyxlab/hermes-agent-context:latest) to
    # ·   L1 (hermes-agent-base:latest) for platform development without context overlay.
    # ·   Механизм L1 = ЯВНЫЙ image-оверрайд (hermes-agent-base:latest). Пустая строка
    # ·   в environment запрещена (CONTEXT_IMAGE empty-string env entry удалён, DevPlan 116
    # ·   B3 D4, U-49) — base.yml НЕ передаёт CONTEXT_IMAGE в environment контейнера,
    # ·   удаление не влияет на runtime.
    # ·   Rejected: Using platform-dev.yml as a separate profile — Compose profiles would
    # ·   require service-level profile: annotations on every service, harder to maintain.
    # ·   Reason: Override compose is the standard Docker Compose pattern for env-specific config.
    # ·   Rev: If L2 context image becomes buildable locally, add build: section here.
    image: hermes-agent-base:latest
