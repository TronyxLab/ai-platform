# GREP_SUMMARY: node.yaml, tronyx-vps, context, modules, projects, domain, SSL, DNS, acme
# STRUCTURE: ┌context+repos┐ → ◇ node(host,keys,domain,email,acme,secrets,tor) → ◇ projects → ◇ modules(enabled/disabled)
# region MODULE_CONTRACT
## @purpose  Node configuration for tronyx-vps — context=tronyx-lab, modules, projects, DNS, SSL
## @scope    Single-node configuration consumed by bootstrap, node-update, deploy-modules, cert-orchestrator
## @invariants
##   - context: tronyx-lab — org определяет пути /opt/<context>/platform/
##   - node.host: 103.88.243.151 — IP VPS
##   - repos.core: TronyxLab/ai-platform.git — context-overlay git-репозиторий
##   - projects[].expose: true → генерируется nginx vhost + SSL-сертификат
##   - modules[].enabled: true → deploy-modules.sh обрабатывает модуль
## @rationale  Единственный source of truth конфигурации ноды для всех bootstrap- и lifecycle-операций.
##   Вынесен из core/ в node-configs/ для разделения платформенного кода и per-node конфигурации.
# endregion MODULE_CONTRACT
context: tronyx-lab
repos:
  core: https://github.com/TronyxLab/ai-platform.git
node:
  name: tronyx-vps
  host: 103.88.243.151
  owner_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOY0cwBbb9jKQgCJ0qX6hKnRfvQwqaeHMhC3V4DcsO+D
    Tronyx
  ci_deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMO1cBJ4ISAYkk2K2EVB1nu9nghQeIk19kKtEepUHyFf
    tronyx@platform_personal_cicd
  timezone: Europe/Moscow
domain: tronyx.ru
email: ai@tronyx.ru
acme_dns_plugin: webnames
secrets:
  enc_file: secrets/tronyx-vps.enc.yaml
tor:
  enabled: true
projects:
- name: tronyx-site
  domain: www.tronyx.ru
  repo: https://github.com/tronyx161/tronyx-site.git
  branch: main
  expose: true
- name: dance-site
  domain: sexydancerostov.ru
  repo: tronyx-lab/dance-site
  type: adopted
  expose: true
- name: botanika
  domain: botanika.tronyx.ru
  repo: tronyx-lab/botanika
  type: adopted
  expose: true
postgres_init_databases:
- realty_db
modules:
- name: nginx
  enabled: true
  config_overlay: /opt/node-configs/tronyx-vps/overlays/nginx
- name: platform-secrets
  enabled: true
- name: postgres
  enabled: true
- name: redis
  enabled: true
- name: clickhouse
  enabled: true
- name: minio
  enabled: true
- name: litellm
  enabled: true
- name: langfuse
  enabled: true
- name: monitoring
  enabled: true
- name: logging
  enabled: true
- name: infra-metrics
  enabled: true
- name: backup-cron
  enabled: true
- name: status-page
  enabled: true
- name: hermes-agent
  enabled: true
