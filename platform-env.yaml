    port: 443
    url_template: https://${DOMAIN}
    networks:
    - proxy-net
  litellm:
    host: litellm
    port: 4000
    url_template: http://litellm:4000
    networks:
    - hermes-agent-net
  langfuse:
    host: langfuse
    port: 3001
    url_template: http://langfuse:3001
    networks:
    - hermes-agent-net
  minio:
    host: minio
    port: 9000
    url_template: http://minio:9000
    networks:
    - hermes-agent-net
  clickhouse:
    host: clickhouse
    port: 8123
    url_template: http://clickhouse:8123
    dsn_template: clickhouse://clickhouse:8123/${NAME}
    networks:
    - hermes-agent-net
