# region MODULE_CONTRACT
## @purpose  Canonical environment descriptor — generated from platform-infra.yaml + secret-definitions.yaml + module discovery
## @scope    Consumed by provision-environment.sh, tests/_conftest/infra.py, deploy-modules.sh, CI workflows, Makefile
## @invariants
##   - This is the ONLY place where networks, volumes, and CI env vars are defined
##   - Consumers MUST read this file, never hardcode
##   - env_defaults are CI/test defaults only — do NOT override .env
##   - profiles are auto-discovered from core/modules/ directory names
# endregion MODULE_CONTRACT
#
# platform-env.yaml — GENERATED by generate_platform_env.py
# DO NOT EDIT — changes will be overwritten on next generation.
# Edit core/platform-infra.yaml for static sections, or
# core/secret-definitions.yaml for CI default values.
# Profiles, port_mappings, test_ports are auto-discovered.

