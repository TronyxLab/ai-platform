- path: /var/log/platform/backup
proxy:
  consumers:
  - hermes-agent
  - monitoring
  no_proxy_internal: localhost,127.0.0.1,.local,postgres,pgbouncer,redis,clickhouse,litellm,langfuse,minio,grafana,prometheus,loki,nginx,node-exporter,cadvisor,hermes-agent,status-page,backup-cron,nginx-prometheus-exporter,redis-exporter,postgres-exporter
provides:
  postgres:
    host: pgbouncer
    port: 6432
    dsn_template: postgresql://${NAME}_user:***@pgbouncer:6432/${NAME}_db
    networks:
    - shared-db-net
  redis:
    host: redis
    port: 6379
    url_template: redis://redis:6379/0
    networks:
    - shared-cache-net
  nginx:
    host: nginx-proxy
    port: 443
    url_template: https://${DOMAIN}
    networks:
    - proxy-net
  litellm:
    host: litellm
    port: 4000
    url_template: http://litellm:4000
    networks:
    - hermes-agent-net
  langfuse:
    host: langfuse
    port: 3001
    url_template: http://langfuse:3001
    networks:
    - hermes-agent-net
  minio:
    host: minio
    port: 9000
    url_template: http://minio:9000
    networks:
    - hermes-agent-net
  clickhouse:
    host: clickhouse
    port: 8123
    url_template: http://clickhouse:8123
    dsn_template: clickhouse://clickhouse:8123/${NAME}
    networks:
    - hermes-agent-net
