# GREP_SUMMARY: ruff config linter formatter target-version line-length select ignore per-file-ignores preview S B9 ASYNC PGH T20 FLY EXE ISC LOG TID A TRY PTH EM FBT PLR PLW BLE ARG SLF PLC
# STRUCTURE: ▶ [ruff] target-version=py310 line-length=120 preview=true → [lint] select(~30+ префиксов, M3′) + ignore(defer/политика) + per-file-ignores(семантические+seam) → [format] quote-style=double → ⎋
# ⚠️ TRAP[DECISION] · 2026-08-13 · HI · ruff.toml.new — КОНФИГУРАЦИЯ W-B (B1), НЕ АКТИВИРОВАНА (M3′)
# · Rejected: активация до чистоты (`ruff check .` = 0 под ним) — дерево стало бы RED на каждом коммите
# · Reason: M3′ clean-at-ship — конфиг включается только вместе с чистотой (DevPlan 163 §2); реестр
# ·   решения по каждому правилу — files/ruff_policy.md (сверка §12.5); активация: rename → ruff.toml
# ·   ТОЛЬКО когда `ruff check .` (всё дерево) даст 0. Блокирующее правило для всех воркеров.
# · Rev: если фиксы займут >3 сессий на слой — сузить select (M3′ Rev), не вводя ratchet-механик.
# ⚠️ TRAP[DECISION] · 2026-08-13 · MED · Seam-class per-file-ignores (session 1) — os.path-моки тестов
# · Rejected: оставить pathlib-конверсии PTH101/103/106/107/108/111/112/113/204 (ломают 12+ тест-файлов)
# · Reason: установленный тестовый seam — monkeypatch/patch os.path.isfile/isdir, os.makedirs/os.replace/
# ·   os.chmod/os.unlink/os.remove, os.path.getmtime/expanduser, builtins.open; Path-эквиваленты обходят моки;
# ·   Path.expanduser("~user") RAISES на macOS (os.path возвращает как есть) — импорт-краш security_posture;
# ·   Path.resolve() в sys.path — PosixPath-объект ломает импорты (project_registry).
# ·   Конверсии отменены (реверт в os.path-форму), правила per-file-ignored с Rev-условием.
# · Rev: миграция тестов с os.*-моков на higher-seam (W-F/W-H, DI-HYG §5) → вернуть pathlib-конверсии и снять ignores.

required-version = ">=0.16.1"
target-version = "py310"
line-length = 120

# preview = true — включает стабилизированные preview-правила (M3′: maximum clean-at-ship)
preview = true

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "templates",   # payload-шаблоны new-project (локальный пакет `config`; I001-секции
                   # версионно-нестабильны — паритет pyrightconfig.json, DevPlan 163 W-G)
    ".ai",   # ruff 0.16 форматирует python-фрагменты в markdown — планы это CoT-артефакты,
             # не исходники (паритет check-doc-headers: ^\.ai/ исключён); правка чужих
             # артефактов форматтером = churn в активных планах
    "vendor",  # вендоренный ai_instructions (апстрим-код, не платформенный) — 2026-08-16
]

[lint]
# Кастомный код маркера «top-level CLI handler» (DevPlan 171 W3.8): детекторы
# exception_patterns (static + ci.mk) требуют inline `# noqa: EXC` на `except Exception`
# в CLI-генераторах — external-регистрация делает маркер валидным для ruff.
external = ["EXC"]
select = [
    "E4", "E7", "E9",   # pycodestyle errors
    "F",                  # Pyflakes
    "I",                  # isort
    "B", "B9",            # flake8-bugbear + extensions
    "SIM",                # flake8-simplify
    "C4",                 # flake8-comprehensions
    "UP",                 # pyupgrade — modern typing (dict, X | None), deprecated typing.*
    "RUF",                # ruff-specific — unused noqa, implicit Any, __all__ sort
    "PIE",                # flake8-pie — unnecessary pass/spread/kwargs
    "RET",                # flake8-return — superfluous else/return
    "PERF",               # Perflint — list comprehensions, unnecessary copies
    # ---- M3′ расширение (DevPlan 163): maximum clean-at-ship минус defer-реестр §4.4 ----
    "S",                  # flake8-bandit — parity-база для bandit retire (B4)
    "ASYNC",              # flake8-async — async-антипаттерны
    "PGH",                # pygrep-hooks — blanket-type-ignore и пр.
    "T20",                # flake8-print — print в production
    "FLY",                # flynt — f-strings вместо .format()/%
    "EXE",                # flake8-executable — shebang/exec-bit
    "ISC",                # flake8-implicit-str-concat
    "LOG",                # flake8-logging — logging-инфраструктура
    "TID",                # flake8-tidy-imports — banned-api (пустой/минимальный список)
    "A",                  # flake8-builtins — тень встроенных имён
    "TRY",                # tryceratops — try/except-качество (TRY003/TRY400 — defer §4.4)
    "PTH",                # flake8-use-pathlib — os.path → pathlib
    "EM",                 # flake8-errmsg — ошибки без контекста
    "FBT",                # flake8-boolean-trap — позиционные bool в сигнатурах
    "PLR",                # pylint refactor — (PLR0911-0917 — defer §4.4)
    "PLW",                # pylint warnings — широкие предупреждения
    "BLE",                # flake8-blind-except — bare/except Exception
    "ARG",                # flake8-unused-arguments
    "SLF",                # flake8-self — приватный доступ
    "PLC",                # pylint convention — (PLC0415 — defer §4.4)
    # DTZ — tz-correctness (170 W10-C: DTZ001/DTZ005/DTZ007/DTZ011 закрыты — 5 мест core/ + 2 теста;
    # DTZ002-004/006/008-010/012 — не присутствуют в дереве, включаются вместе с префиксом при будущих правках)
    "call-datetime-without-tzinfo", "call-datetime-now-without-tzinfo", "call-datetime-strptime-without-zone", "call-date-today",
    # ANN, DOC — исключены §11 (конфликт с #region-стилем док-заголовков)
    # PTQ — НЕ существует в ruff ≤0.16.x — defer §4.4
    # C90 — defer §4.4 (complexity → advisory agent-check)
]
ignore = [
    "line-too-long",              # line-too-long — handled by formatter
    "module-import-not-at-top-of-file",              # module-import-not-at-top-of-file — project convention: #region MODULE_CONTRACT before imports
    "ambiguous-unicode-character-string",            # ambiguous-unicode-character-string — Cyrillic in project strings is intentional
    "ambiguous-unicode-character-docstring",            # ambiguous-unicode-character-docstring — Cyrillic in project docstrings is intentional
    "ambiguous-unicode-character-comment",            # ambiguous-unicode-character-comment — Cyrillic in project comments is intentional
    "assert",              # assert — осознанная fail-fast валидация (DI/инварианты), включая tests/
    "subprocess-without-shell-equals-true",              # subprocess-without-shell — политика: subprocess ВСЕГДА без shell; S607/PLW1510 покрывают
    "suspicious-subprocess-import",              # suspicious-subprocess-import — политика (bandit-parity B404): import subprocess легитимен;
                         #   subprocess ВСЕГДА без shell (S603 ignore), использование контролируется S607/PLW1510
    "start-process-with-partial-path",              # start-process-with-partial-path — политика (ruff_policy.md §ПОЛИТИКА-IGNORE): subprocess
                         #   без shell; частичные пути ("python3","docker","systemctl") — контролируемое окружение
                         #   ноды/контейнера; полные пути ломают кроссплатформу (macOS/Linux/CI)
    "hardcoded-temp-file",              # hardcoded-temp-file — политика: фиксированные пути платформы
                         #   (/var/lib/platform/*, /tmp/platform-*) — контрактные пути, не временные файлы
    "hardcoded-password-string",              # hardcoded-password-string — политика: ci-test-значения в генераторах/тестах/шаблонах
                         #   — НЕ секреты (реальные секреты — SOPS/AGE; гейт gitleaks + inline_secrets)
    "float-equality-comparison",            # float-equality-comparison — политика: compat-проверки версий (== 0.0/1.0) —
                         #   сравнение констант, не вычислений
    "boolean-type-hint-positional-argument",            # boolean-type-hint-positional-argument — политика (ruff_policy.md): существующие
    "boolean-default-value-positional-argument",            # boolean-default-value-positional-argument —   публичные API; изменение сигнатур
                         #   ломает 30+ вызовов/тестов. НОВЫЙ код — keyword-only bool (agent-check advisory FBT)
    "import-private-name",           # import-private-name — политика: осознанный доступ к приватному API модулей-соседей
                         #   платформы (единая кодовая база); подъём публичности ради линтера — лишний public-surface
    "private-member-access",            # private-member-access — та же политика (единая кодовая база: cli→state_machine,
                         #   orchestrator_cli→orchestrator, receive_flow→deploy-цепочки — осознанный доступ)
    "suspicious-url-open-usage",              # suspicious-url-open-usage — политика: urllib-пробы здоровья (healthcheck_poller)
                         #   и mirror/CI-проверки — vetted внутренние URL, контролируемые схемы http/https
    "hardcoded-bind-all-interfaces",              # hardcoded-bind-all-interfaces — политика: сервисы платформы слушают 0.0.0.0 ВНУТРИ
                         #   docker-сетей (контейнерная изоляция); внешняя экспозиция — только через nginx
    "suspicious-xml-etree-import",              # suspicious-xml-etree-import — политика: xml.etree для prometheus/alerting XML-конфигов
    "suspicious-xml-element-tree-usage",              # suspicious-xml-element-tree-usage — парсинг vetted конфигов платформы, не внешний ввод
                         #   (мониторинг-рендеры); внешний XML-ввод не парсится платформой
    "hardcoded-sql-expression",              # hardcoded-sql-expression — политика: SQL-запросы платформы фиксированные/
                         #   параметризованные (pg_roles checks, BACKUP-маркеры); интерполяция — только
                         #   из vetted констант (имя роли валидируется [a-z0-9_]), не пользовательский ввод
    "line-contains-todo",            # line-contains-fixme — TODO/FIXME не гейтятся (допустимые маркеры)
    "missing-todo-author",             # invalid-todo-tag — TODO-авторы не требуются
    "missing-todo-link",             # missing-todo-link — TODO-ссылки не требуются
    "pytest-raises-too-broad",             # pytest-raises-too-broad — широкое исключение в raises допустимо в тестах
    "single-line-implicit-string-concatenation",            # single-line-implicit-string-concatenation — конфликт с форматтером (ruff format)
    "root-logger-call",            # logging-module-not-imported — не критично; EM/BLE покрывают контекст
    "import-outside-top-level",           # import-outside-top-level — документированный lazy-import паттерн (defer §4.4)
    "raise-vanilla-args",            # raise-vanilla-args — defer §4.4: меняет публичные exception-контракты
    "error-instead-of-exception",            # error-instead-of-exception — defer §4.4: семантический рефакторинг
    "too-many-return-statements",           # too-many-returns — defer §4.4 (complexity → advisory agent-check)
    "too-many-branches",           # too-many-branches — defer §4.4
    "too-many-arguments",           # too-many-arguments — defer §4.4
    "too-many-locals",           # too-many-locals — defer §4.4
    "too-many-statements",           # too-many-statements — defer §4.4
    "too-many-boolean-expressions",           # too-many-boolean-expressions — defer §4.4
    "too-many-positional-arguments",           # too-many-positional — defer §4.4
    "rule-codes-in-suppression-comments",            # rule-codes-in-suppression-comments — preview-стилистика; code-in-brackets —
                         # единственная форма suppression, валидная и в текущем (preview-off) конфиге,
                         # и в новом (переходная зелень M3′); name-in-brackets ломает старый конфиг (RUF102)
]

# Семантические per-file-ignores (M3′): только семантика, не «заглушить шум»
[lint.per-file-ignores]
"tests/**/*.py" = ["if-else-block-instead-of-if-exp", "try-except-in-loop", "magic-value-comparison", "unused-function-argument", "private-member-access", "pytest-raises-with-multiple-statements", "hardcoded-password-func-arg", "no-self-use", "print"]
"**/conftest.py" = ["if-else-block-instead-of-if-exp"]
"**/merge_junit.py" = ["try-except-in-loop"]
# 🧐 TRAP[DECISION] · 2026-08-14 · — · Плагин-регистрация в __init__ (RUF067-исключение) · Rejected: вынос регистрации из __init__ · Reason: плагин-паттерн hermes-agent (регистрация профиля при импорте пакета — контракт плагинов); каталог в ruff-exclude, но check-diff сканирует изменённые файлы явно · Rev: модульный конфиг-механизм плагинов → убрать ignore
"core/modules/hermes-agent/build/plugins/model-providers/litellm/__init__.py" = ["non-empty-init-module"]
"**/__init__.py" = ["unused-import", "undefined-local-with-import-star", "undefined-local-with-import-star-usage", "undefined-export"]  # F822: lazy-export __all__ (importlib-паттерн scaffold/__init__.py и аналогов)
"core/internal/healthcheck/metrics/host_collector.py" = ['builtin-open']  # /proc-чтения — тестовый seam (test_host_collector мокает builtins.open)
"core/internal/shared/node_yaml/resolve.py" = ['os-path-expanduser', 'os-path-isfile', 'os-path-join', 'glob']  # тестовые seam-моки os.path.expanduser/isfile
"core/internal/shared/node_yaml/validation.py" = ['os-path-abspath', 'os-path-isfile', 'os-path-dirname', 'os-path-join']  # dirname-цепочка — семантика abspath без symlink-резолва + seam-мок isfile
"core/internal/bootstrap/deploy/context_overlay.py" = ['os-path-isdir', 'unspecified-encoding']  # тестовый seam (мокает os.path.isdir + write_text без kwargs)
"core/modules/status-page/app.py" = ['jinja2-autoescape-false', 'unsafe-markup-use', 'os-path-join', 'print', 'blind-except']  # jinja2 autoescape — шаблоны из репозитория; webview не используется; CLI/сервисная диагностика; blind-except: HTTP handler boundary (документированный catch-all, noqa EXC)
# 170 W7-E2: collectors.py → пакет collectors/ (config/checks/readiness/aggregate/staleness);
# os.path-моки (seam) + LDD print(stderr) сохранены для всех подмодулей пакета.
"core/modules/status-page/collectors/**" = ['os-path-isdir', 'os-path-isfile', 'os-path-join', 'os-listdir', 'print']  # seam-моки os.path + CLI/сервисная диагностика (LDD print stderr)

