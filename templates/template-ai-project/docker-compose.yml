# GREP_SUMMARY: docker-compose {{PROJECT_NAME}} template-ai-project resources limits healthcheck logging volumes proxy-net shared-db-net hermes-agent-net env DSN
# STRUCTURE: service({{PROJECT_NAME}}) → deploy.resources.limits → restart: unless-stopped → healthcheck(/health 127.0.0.1) → volumes(config/+content/:ro) → env(DATABASE_URL←PLATFORM_POSTGRES_DSN/LLM_BASE_URL←PLATFORM_LITELLM_URL) → networks(own + proxy-net + shared-db-net + hermes-agent-net)
# region MODULE_CONTRACT
## @purpose  Production compose определения проекта-бота (template-ai-project, W3 D9; бриф §7):
##           ресурсные лимиты, restart-политика, healthcheck /health, json-file логи, volume
##           config/+content/ (hot-reload, образ неизменяем), env DATABASE_URL/LLM_BASE_URL.
## @scope    Проекты AI Project; сети платформы (external): proxy-net (ingress/TLS),
##           shared-db-net (pgbouncer:6432), hermes-agent-net (litellm:4000) —
##           SoT platform-infra.yaml#provides (DR-M4)
## @invariants
##   - deploy.resources.limits ОБЯЗАТЕЛЬНЫ (бриф §7: cpus '1.0', memory 256M)
##   - restart: unless-stopped — канон платформы (164 W1-4)
##   - healthcheck: http://127.0.0.1:${HEALTH_PORT:-8787}/health (127.0.0.1, НЕ localhost — IPv6-ловушка)
##   - logging json-file max-size/max-file — канон §7
##   - volumes ./config:/app/config:ro и ./content:/app/content:ro — конфиг/контент на volume
##   - env DATABASE_URL — маппинг ${PLATFORM_POSTGRES_DSN} из .env.platform (план 019 TASK-1;
##     литеральный ${DATABASE_URL} не резолвится из .env.platform — инцидент пилотов asi-group)
##   - env LLM_BASE_URL — маппинг ${PLATFORM_LITELLM_URL:-http://litellm:4000}
##   - networks: own-net + proxy-net (aliases) + shared-db-net + hermes-agent-net —
##     сети ВСЕХ потребляемых платформенных сервисов (K1/K3-гейт service-network-coverage)
## @rationale Бот хранит kernel-стейт в Postgres и ходит в LiteLLM — без сетей провайдеров
##            pgbouncer/litellm недостижимы (ингредиент инцидента 019: proxy-net only);
##            shared-cache-net НЕ подключается — redis бот не потребляет (least privilege)
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  {{PROJECT_NAME}}:
    image: "${IMAGE_REGISTRY:-ghcr.io}/{{ORG_NAME}}/{{PROJECT_NAME}}:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: "256M"
          cpus: "1.0"
    logging: *default-logging
    env_file:
      - .env.platform
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${PLATFORM_POSTGRES_DSN}
      - LLM_BASE_URL=${PLATFORM_LITELLM_URL:-http://litellm:4000}
      - HEALTH_PORT=${HEALTH_PORT:-8787}
    volumes:
      - ./config:/app/config:ro
      - ./content:/app/content:ro
    networks:
      {{PROJECT_NAME}}-net:
      proxy-net:
        aliases:
          - {{PROJECT_NAME}}
      shared-db-net:
      hermes-agent-net:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${HEALTH_PORT:-8787}/health"]
      # ⚠️ 127.0.0.1 НЕ localhost — Alpine резолвит localhost в ::1 (IPv6), healthcheck будет падать
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "platform.type=ai-project"
      - "platform.domain={{DOMAIN}}"

networks:
  {{PROJECT_NAME}}-net:
    name: {{PROJECT_NAME}}-net
    driver: bridge
  proxy-net:
    name: proxy-net
    external: true
  shared-db-net:
    name: shared-db-net
    external: true
  hermes-agent-net:
    name: hermes-agent-net
    external: true
