# GREP_SUMMARY: GitHub Actions CI/CD deploy reusable workflow backend
# STRUCTURE: on(push:main) → deploy(uses {{ORG_NAME}}/ai-platform/deploy-project.yml)
# region MODULE_CONTRACT
## @purpose  Simplified CI/CD: build+delegation to reusable platform workflow (T14)
## @invariants
##   - Единственный job делегирует в reusable workflow платформы
##   - secrets: inherit — CI_DEPLOY_KEY, GITHUB_TOKEN наследуются
##   - org-agnostic ({{ORG_NAME}} заменяется при scaffold)
##   - ≤40 строк, ≤15 non-comment
# endregion MODULE_CONTRACT
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: {{ORG_NAME}}/ai-platform/.github/workflows/deploy-project.yml@main
    with:
      project_name: {{PROJECT_NAME}}
    secrets: inherit
