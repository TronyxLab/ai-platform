# GREP_SUMMARY: ai-platform.yaml project-manifest backend template
# STRUCTURE: ┌manifest┐ → deploy(node) → sync-env
# region MODULE_CONTRACT
## @purpose   Manifest проекта для платформы ai-platform (шаблон backend-проекта)
## @scope     Определяет имя, тип, целевой узел, домен платформы и зависимости
## @invariants
##   - type: backend — для backend-проектов
##   - {{PROJECT_NAME}}, {{NODE_NAME}}, {{DOMAIN}}, {{PLATFORM_DOMAIN}} заменяются при scaffold
##   - database: true — backend обычно требует БД
## @rationale  Единый манифест для деплоя и каталогизации; используется add-project.sh и adopt-project.sh
# endregion MODULE_CONTRACT

name: {{PROJECT_NAME}}
type: backend
target_node: {{NODE_NAME}}
platform_domain: {{PLATFORM_DOMAIN}}

needs:
  domain: {{DOMAIN}}
  database: false
  expose: false

monitoring:
  metrics: true
  metrics_port: 8080
  logs_retention: 7d

quality:
  level: auto    # baseline | full | auto (default auto, DevPlan 137 — решение 2026-08-05)
