# GREP_SUMMARY: ai-platform.yaml project-manifest backend monitoring template
# STRUCTURE: ┌manifest┐ → scaffold(create_project) → generate-catalog → deploy(node)
# region MODULE_CONTRACT
## @purpose   Manifest проекта для платформы ai-platform (шаблон backend-проекта)
## @scope     Определяет имя, тип, целевой узел, зависимости и мониторинг проекта.
##            Используется platform-deploy.sh (_reconfigure_monitoring) и generate-catalog.sh.
## @invariants
##   - type: backend — для backend-проектов
##   - metrics_port: 8080 — порт метрик по умолчанию для backend
##   - $PROJECT_NAME и $NODE_NAME заменяются при создании проекта из шаблона
## @rationale  Единый манифест для деплоя, мониторинга и каталогизации проекта.
##             Трёхуровневый мерж (L1 defaults → L2 org overrides → L3 project config).
# endregion MODULE_CONTRACT

name: $PROJECT_NAME
type: backend
context: personal
target_node: $NODE_NAME

needs:
  domain: "$DOMAIN"       # e.g., api.myproject.com
  database: "$DB_NAME"    # PostgreSQL database name
  llm: false
  expose: false

monitoring:
  metrics: false
  logs_retention: 7d
  alerting: false
  dashboard: false
