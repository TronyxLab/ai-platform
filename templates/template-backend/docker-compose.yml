# GREP_SUMMARY: docker-compose backend shared-db-net proxy-net env_file
# STRUCTURE: service(<project>) → env_file(.env.platform) → networks(shared-db-net + proxy-net:external) → healthcheck
# region MODULE_CONTRACT
## @purpose  Development and production compose definition for backend projects
## @scope    Service with platform env_file contract
## @invariants
##   - shared-db-net is external (created by postgres-shared module)
##   - proxy-net is external (created by nginx module)
##   - env_file: .env.platform — единственный источник платформенных переменных
## @rationale .env.platform заменяет environment-блок; исключает дрейф между проектами (DD5)
# endregion MODULE_CONTRACT

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  {{PROJECT_NAME}}:
    # ⚠️ TRAP[BUG] · 2026-06-11 · P1 · GHCR требует lowercase org names
    #   Root: Docker registry spec — repository name must be lowercase
    #   Fix: передавайте --org в lowercase (e.g., tronyxlab, не TronyxLab)
    image: "${IMAGE_REGISTRY:-ghcr.io}/{{ORG_NAME}}/{{PROJECT_NAME}}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    # Канон restart-политики (164 W1-4): unless-stopped для проектов — `always` только у
    # stateful-модулей с обоснованием (postgres/redis/backup-cron).
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # DevPlan 162 W4-3: лимиты 128M/0.25CPU проектам (K3/L1-практики) —
          # контейнер без memory/cpu лимита = OOM-риск общего стека; L1-контракт limits-present.
          memory: "128M"
          cpus: "0.25"
    logging: *default-logging
    env_file:
      - .env.platform
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - {{PROJECT_NAME}}-data:/app/data
    networks:
      {{PROJECT_NAME}}-net:
      shared-db-net:
      proxy-net:
        aliases:
          - {{PROJECT_NAME}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      # 127.0.0.1 НЕ localhost: curl резолвит localhost → ::1 (IPv6), приложение слушает
      # IPv4 — healthcheck фейлится (канон 164 W1-4, тот же класс что frontend Alpine TRAP)
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - "platform.type=backend"
      - "platform.domain={{DOMAIN}}"

volumes:
  {{PROJECT_NAME}}-data:
    name: {{PROJECT_NAME}}-data

networks:
  {{PROJECT_NAME}}-net:
    name: {{PROJECT_NAME}}-net
    driver: bridge
  shared-db-net:
    name: shared-db-net
    external: true
  proxy-net:
    name: proxy-net
    external: true
