# GREP_SUMMARY: GitHub Actions CI/CD deploy reusable workflow frontend
# STRUCTURE: on(push:main) → deploy(uses __ORG_NAME__/ai-platform/deploy-project.yml)
# @purpose  Simplified CI/CD: build+delegation to reusable platform workflow (T13)
## @invariants
##   - Единственный job делегирует в reusable workflow платформы
##   - secrets: inherit — CI_DEPLOY_KEY, GITHUB_TOKEN наследуются
##   - org-agnostic (__ORG_NAME__ заменяется при scaffold)
##   - ≤40 строк, ≤15 non-comment
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: __ORG_NAME__/ai-platform/.github/workflows/deploy-project.yml@main
    with:
      project_name: __PROJECT_NAME__
    secrets: inherit
