# GREP_SUMMARY: GitHub Actions CI/CD deploy reusable workflow frontend build-push ghcr image channel
# STRUCTURE: on(push:main) → build-and-push(ghcr.io/<org>/<proj>:<sha>+latest) → deploy(uses {{ORG_NAME}}/ai-platform/deploy-project.yml@sha-pin)
# region MODULE_CONTRACT
## @purpose  Project CI/CD: build+push образа в ghcr, затем делегация в reusable platform
##           workflow (T13; REF-0001 — канал сборки образов проектов)
## @invariants
##   - build-and-push job пушит ghcr.io/{{ORG_NAME}}/{{PROJECT_NAME}}:${{ github.sha }}
##     (+latest) — тег <sha> = контракт receive-канала: deploy-project.yml вызывает
##     `receive <project> ${{ github.sha }}`, engine тянет строго :<sha>, compose проекта
##     читает IMAGE_TAG. Без этого job первый деплой гарантированно умирает
##     (5 неудачных pull → PlatformFatalError)
##   - deploy job делегирует в reusable workflow платформы, needs: [build-and-push]
##   - secrets: inherit — CI_DEPLOY_KEY, GITHUB_TOKEN наследуются
##   - org-agnostic ({{ORG_NAME}} заменяется при scaffold); registry требует lowercase
##     org/repo (TRAP в docker-compose.yml шаблона — --org в lowercase)
##   - Reusable workflow запинен на full commit SHA платформы (REF-0012,
##     meta-refactoring W0): обновление пина — сознательный bump в проекте;
##     mirror/context-promote сохраняют commit SHA, пин резолвится во всех org
##   - Все внешние actions запинены на full commit SHA с версией-комментарием
##     (гейт test_gate_workflow_sha_pins сканирует templates/*/workflows)
##   - permissions: top-level contents:read; packages:write — только у build-job (минимум прав)
##   - concurrency-group (REF-0011): push-деплои проекта сериализуются
##     (cancel-in-progress:false — очередь); node-side страховка — flock в receive
## @changes 2026-08-24 | REF-0001 (meta-refactoring W2): +job build-and-push (копия блока
##           adopter'а с SHA-pins REF-0012); deploy needs build; input image_tag не
##           существует — образ доставляется push-каналом, не ручным тегом
## @changes 2026-08-24 | REF-0012: deploy-project.yml@main → @<full-sha>
## @changes 2026-08-24 | REF-0011: +concurrency group (сериализация деплоев проекта)
# endregion MODULE_CONTRACT
name: Deploy

on:
  push:
    branches: [main]

# REF-0011: сериализация деплоев проекта. Ключ github.workflow (а не inputs.project_name —
# контекст inputs недоступен в push-workflow): один репозиторий = один проект, константный
# ключ внутри репо даёт ровно нужную семантику очереди.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

# REF-0012 hygiene: минимум прав на уровне workflow; publish-право — только у build-job.
permissions:
  contents: read

jobs:
  # REF-0001: канал сборки образов проектов — единственный источник образа для receive.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/{{ORG_NAME}}/{{PROJECT_NAME}}:${{ github.sha }}
            ghcr.io/{{ORG_NAME}}/{{PROJECT_NAME}}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    uses: {{ORG_NAME}}/ai-platform/.github/workflows/deploy-project.yml@4425ce0835665b1d0a9ef3f1e2cbf702663645ed # main snapshot 2026-08-24 (REF-0012)
    with:
      project_name: {{PROJECT_NAME}}
    secrets: inherit
