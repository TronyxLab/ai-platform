# GREP_SUMMARY: reusable workflow platform-deploy SSH forced-command frontend staging-production
# STRUCTURE: on(workflow_call with inputs) → deploy(SSH forced-command via appleboy)
# region MODULE_CONTRACT
## @purpose  Reusable GitHub Actions workflow: SSH deploy with forced-command (platform-deploy.sh)
## @scope    Called from deploy.yml; handles staging / production routing
## @invariants
##   - SSH forced-command: ci-deploy user has NO shell (authorized_keys forces platform-deploy.sh)
##   - project_name + image_tag passed as positional arguments to platform-deploy.sh
##   - CI_DEPLOY_KEY passed as secret from caller workflow
## @rationale Centralized deploy logic avoids copy-paste; workflow copied into project repo (D2)
# endregion MODULE_CONTRACT

name: Platform Deploy

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
        description: "Project name (passed as first arg to platform-deploy.sh)"
      image_tag:
        required: true
        type: string
        description: "Docker image tag (sha or latest, passed as second arg)"
      ssh_host:
        required: true
        type: string
        description: "SSH host resolved from node-configs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH forced-command
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.ssh_host }}
          username: ci-deploy
          key: ${{ secrets.CI_DEPLOY_KEY }}
          script: |
            ${{ inputs.project_name }} ${{ inputs.image_tag }}
