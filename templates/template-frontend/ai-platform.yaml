# GREP_SUMMARY: ai-platform.yaml project-manifest frontend monitoring template
# STRUCTURE: ┌manifest┐ → scaffold(create_project) → generate-catalog → deploy(node)
# region MODULE_CONTRACT
## @purpose   Manifest проекта для платформы ai-platform (шаблон frontend-проекта)
## @scope     Определяет имя, тип, целевой узел, зависимости и мониторинг проекта.
##            Используется platform-deploy.sh (_reconfigure_monitoring) и generate-catalog.sh.
## @invariants
##   - type: frontend — для frontend-проектов
##   - metrics_port: 3000 — порт метрик по умолчанию для frontend
##   - $PROJECT_NAME и $NODE_NAME заменяются при создании проекта из шаблона
## @rationale  Единый манифест для деплоя, мониторинга и каталогизации проекта.
##             Трёхуровневый мерж (L1 defaults → L2 org overrides → L3 project config).
# endregion MODULE_CONTRACT

name: $PROJECT_NAME
type: frontend
context: personal
target_node: $NODE_NAME

needs:
  domain: "$DOMAIN"       # e.g., app.myproject.com
  database: false         # frontend typically needs no DB
  llm: false
  expose: false

monitoring:
  metrics: true
  metrics_port: 3000
  logs_retention: 7d
  alerting: false
  dashboard: false
