# GREP_SUMMARY: ai-platform.yaml project-manifest fullstack template
# STRUCTURE: ┌manifest┐ → deploy(node) → sync-env
# region MODULE_CONTRACT
## @purpose   Manifest проекта для платформы ai-platform (шаблон fullstack-проекта)
## @scope     Определяет имя, тип, целевой узел, домен платформы и зависимости
## @invariants
##   - type: fullstack — для fullstack-проектов
##   - __PROJECT_NAME__, __NODE_NAME__, __DOMAIN__, __PLATFORM_DOMAIN__ заменяются при scaffold
##   - expose: true — frontend обычно public
## @rationale  Единый манифест для деплоя и каталогизации; используется add-project.sh и adopt-project.sh
# endregion MODULE_CONTRACT

name: __PROJECT_NAME__
type: fullstack
context: personal
target_node: __NODE_NAME__
platform_domain: __PLATFORM_DOMAIN__

needs:
  domain: __DOMAIN__
  database: false
  expose: true

monitoring:
  metrics: true
  metrics_port: 3000
  logs_retention: 7d
