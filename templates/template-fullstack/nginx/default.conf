# GREP_SUMMARY: nginx SPA health ready static cache-headers fullstack
# STRUCTURE: server(80) → location /(SPA try_files) + /health(status 200) + /ready(status 200)
# region NGINX_CONFIG
## @purpose  Nginx configuration for SPA / static site serving (04-templates §3)
## @scope    Container-internal config; TLS handled by external nginx-proxy
## @invariants
##   - /health returns 200 (Docker healthcheck target)
##   - /ready returns 200 (load balancer / pre-stop readiness)
##   - SPA routing: try_files $uri $uri/ /index.html
##   - Static assets cached 30d
## @rationale Health and readiness endpoints enable zero-downtime atomic deploys (06 §7)
# endregion NGINX_CONFIG

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check — Docker HEALTHCHECK target
    location /health {
        access_log off;
        return 200 "OK";
    }

    # Readiness probe — pre-stop check
    location /ready {
        access_log off;
        return 200 "OK";
    }

    # SPA routing — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
