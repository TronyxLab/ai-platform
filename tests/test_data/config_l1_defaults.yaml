monitoring:
  metrics: false
  metrics_port: 3000
  logs_retention: 7d
  ai_retention: 30d
  alerting: false
  dashboard: false
  alerts:
    slack:
      enabled: false
      webhook: ""
      channel: "#alerts"
    email:
      enabled: true
      recipients:
        - "admin@platform.local"
