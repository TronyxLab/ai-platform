# GREP_SUMMARY: policy.valid.yaml, fixture, valid, aliases, profiles, providers, auto_provision
# STRUCTURE: ┌providers┐ → ┌aliases(reasoning,chat,coding,vision,embedding)┐ → ┌profiles(default,premium,unlimited)┐ → ┌auto_provision┐
# region MODULE_CONTRACT
## @purpose  Valid LLM policy fixture for unit tests. Matches the canonical structure
##           of core/internal/llm/policy.yaml — providers, aliases, profiles, auto_provision.
## @scope    Test fixture — loaded by test_llm_policy_schema.py::test_valid_policy_loading
## @invariants
##   - Must pass both JSON Schema and Pydantic validation
##   - At least reasoning + chat aliases with non-empty deployments
##   - At least default profile
##   - auto_provision.default_profile references existing profile
## @changes — 2026-07-24 | Created (DevPlan 049 Phase 1)
# endregion MODULE_CONTRACT

providers:
  deepseek:
    key_env: DEEPSEEK_API_KEY

aliases:
  reasoning:
    label: "Complex reasoning"
    context_window: 128000
    features: [reasoning, structured_output]
    deployments:
      primary:
        provider: deepseek
        model: deepseek/deepseek-v4-pro
      fallback:
        provider: deepseek
        model: deepseek/deepseek-v4-flash

  chat:
    label: "Fast chat"
    context_window: 128000
    features: [chat]
    deployments:
      primary:
        provider: deepseek
        model: deepseek/deepseek-v4-flash

  coding:
    label: "Code generation"
    context_window: 200000
    features: [code, structured_output]
    deployments: []

  vision:
    label: "Image analysis"
    context_window: 128000
    features: [vision, multimodal]
    deployments: []

  embedding:
    label: "Text embeddings"
    features: [embedding]
    deployments: []

profiles:
  default:
    label: "Default (chat only)"
    models: [chat]
    budget: {daily: 1.0}
    rpm_limit: 10
    metadata: {tier: default}

  premium:
    label: "Premium (reasoning + chat)"
    models: [reasoning, chat]
    budget: {daily: 10.0}
    rpm_limit: 60
    metadata: {tier: premium}

  unlimited:
    label: "Unlimited (all active models)"
    models: [reasoning, chat]
    budget: {daily: 50.0}
    rpm_limit: 120
    metadata: {tier: unlimited}

auto_provision:
  default_profile: default
  profile_rules:
    - match: {name: hermes-agent}
      profile: unlimited
