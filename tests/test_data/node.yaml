# GREP_SUMMARY: node-config test-data firewall secrets modules
# STRUCTURE: ▶ node(host, keys, timezone) → ◇ firewall(extra_ports) → ◇ secrets(enc_file) → ◇ modules(nginx, postgres, backup) → ⎋ complete node config
# region MODULE_CONTRACT
## @purpose  Test node configuration for node-resolver and firewall tests
## @scope    Used by tests for node resolution, firewall config, and module deployment
## @rationale Full node definition with firewall, secrets, and module declarations.
# endregion MODULE_CONTRACT

context: production
node:
  name: node-01
  host: 192.168.1.100
  owner_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestOwnerKey owner@example.com"
  ci_deploy_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestCiKey ci-deploy@example.com"
  timezone: Europe/Moscow

firewall:
  extra_ports:
    - 8080

secrets:
  enc_file: secrets/node-01.enc.yaml

modules:
  - name: nginx
    enabled: true
    config_overlay: overlays/node-01/nginx
  - name: postgres
    enabled: true
  - name: backup-cron
    enabled: true

domain: test.local
email: admin@test.local
projects:
  - name: test-frontend
    repo: test-org/test-frontend
    type: frontend
    domain: app.test.local
  - name: test-landing
    repo: test-org/test-landing
    type: landing
    domain: independent-project.com
