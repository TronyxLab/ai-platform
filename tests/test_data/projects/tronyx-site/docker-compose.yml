# @purpose Test docker-compose.yml fixture for predeploy gate T1-T4 validation — tronyx-site variant with proxy-net
# Test compose file for predeploy gate T1-T4 validation
# Mirrors a real project structure with proxy-net and a non-conflicting host port
version: "3.8"

services:
  web:
    image: nginx:stable-alpine
    ports:
      - "8082:80"
    networks:
      - proxy-net
    environment:
      - SITE_DOMAIN=tronyx-site.example.com

networks:
  proxy-net:
    external: true
