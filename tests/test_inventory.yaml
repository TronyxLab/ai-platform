# GREP_SUMMARY: test-inventory, baseline, origin-main, gate-validation
# STRUCTURE: ┌test_inventory.yaml┐ → ◇ nodeid list → ◇ baseline from origin/main → ⊕ gate compares PR vs baseline
# region MODULE_CONTRACT
## @purpose — Baseline inventory of all test node IDs collected from `pytest --collect-only -q`.
##            This file is generated from origin/main and serves as the immutable reference
##            for test_gate_test_inventory.py. Any test removal without documented changelog FAILS the gate.
## @rationale — Prevents silent test deletion in PRs. If a test is removed from the suite
##              without an entry in test_inventory_changes.yaml, the inventory gate catches it.
## @changes — 2026-07-24 | regenerated (1743 tests)
## @changes — 2026-07-15 | Added 5 gate tests (DevPlan 007: P20 + compose-include-sync)
## @changes — 2026-07-10 | Initial baseline per TestsMetaDevPlan2.md TASK-10
# endregion MODULE_CONTRACT
#
# HOW TO UPDATE:
#   1. Run: python -c "import subprocess,sys;r=subprocess.run([sys.executable,'-m','pytest','tests/','--collect-only','-q'],capture_output=True,text=True);lines=r.stdout.splitlines();ids=[];curr=[];import re;[(None if not (s:=l.strip()) else (curr:=curr[:len(l)-len(s)//2],curr.append(m.group(1))) if (m:=re.match(r'<Module (.*?)>',s)) else (curr:=curr[:len(l)-len(s)//2],curr.append(m.group(2))) if (m:=re.match(r'<(Dir|Package) (.*?)>',s)) else (None)) for l in lines];print('\n'.join(sorted(ids)))
#   2. Update this file with the new baseline
#   3. Commit
#
# NOTE: This baseline is from local collection. The gate compares PR's collected tests against it.
#       Adding new tests is always OK. Removing tests requires a changelog entry.

